<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#be185d" id="themeMeta">
<title>Catálogo · Varelia Store</title>
<style>
:root{--p:#be185d;--p2:#9d174d;--bg:#f7f8fc;--card:#fff;--ink:#111827;--muted:#64748b;--line:#e5e7eb;--shadow:0 14px 34px rgba(15,23,42,.09)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,color-mix(in srgb,var(--p) 7%,#fff),var(--bg) 260px);color:var(--ink)}button,input{font:inherit}.wrap{width:min(1120px,100%);margin:auto;padding:18px 15px 60px}.top{display:flex;align-items:center;gap:13px;padding:8px 0 19px}.vs{width:58px;height:58px;border-radius:19px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-weight:950;font-size:27px;letter-spacing:-.06em;box-shadow:0 12px 28px color-mix(in srgb,var(--p) 28%,transparent);flex:0 0 auto}.title{min-width:0}.title h1{margin:0;font-size:clamp(22px,5vw,32px);line-height:1.05;overflow-wrap:anywhere}.title p{margin:5px 0 0;color:var(--muted);font-size:13px}.hero{padding:18px;border:1px solid color-mix(in srgb,var(--p) 18%,var(--line));border-radius:24px;background:color-mix(in srgb,var(--p) 5%,var(--card));box-shadow:var(--shadow);margin-bottom:15px}.hero strong{font-size:18px}.hero p{margin:5px 0 0;color:var(--muted);font-size:13px}.search{position:sticky;top:0;z-index:10;padding:10px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px)}.search input{width:100%;border:1px solid var(--line);border-radius:16px;padding:13px 15px;background:var(--card);color:var(--ink);outline:none;box-shadow:0 6px 18px rgba(15,23,42,.05)}.search input:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 12%,transparent)}.chips{display:flex;gap:8px;overflow:auto;padding:3px 0 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 13px;white-space:nowrap;font-weight:800;font-size:12px}.chip.active{background:var(--p);border-color:var(--p);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.product{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.photo{aspect-ratio:1.18/1;background:color-mix(in srgb,var(--p) 6%,var(--bg));display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12px}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.cat{display:inline-block;padding:5px 8px;border-radius:999px;background:color-mix(in srgb,var(--p) 8%,var(--card));color:var(--p);font-size:11px;font-weight:900}.body h2{font-size:17px;margin:8px 0 5px;line-height:1.18}.desc{color:var(--muted);font-size:12px;line-height:1.4;min-height:34px}.bottom{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-top:13px}.price{font-size:21px;font-weight:950;color:var(--p)}.available{font-size:11px;font-weight:900;color:#047857;background:#ecfdf5;border:1px solid #a7f3d0;padding:6px 8px;border-radius:999px;white-space:nowrap}.empty,.loading{grid-column:1/-1;text-align:center;padding:40px 18px;border:1px dashed var(--line);border-radius:20px;background:var(--card);color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:11px;padding-top:28px}.error{color:#991b1b}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.wrap{padding-inline:12px}.grid{grid-template-columns:1fr}.vs{width:54px;height:54px;font-size:25px}.photo{aspect-ratio:1.3/1}.desc{min-height:0}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top"><div class="vs" title="Varelia Store">VS</div><div class="title"><h1 id="businessName">Catálogo</h1><p>Productos disponibles</p></div></header>
  <section class="hero"><strong>Catálogo de productos</strong><p id="catalogMeta">Consulta los productos que este negocio tiene disponibles para la venta.</p></section>
  <div class="search"><input id="search" type="search" placeholder="Buscar producto o categoría" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
  <section class="grid" id="grid"><div class="loading">Cargando catálogo…</div></section>
  <footer class="footer">Catálogo publicado con Varelia Store</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
  const SUPABASE_URL='https://onvdcaohnftrjunwdvjp.supabase.co';
  const SUPABASE_KEY=atob('c2JfcHVibGlzaGFibGVfYnoyejV1Z2xmX0VBTEplenF2NHJDd19TNzNHTU5yaA==');
  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'S/ '+Number(n||0).toFixed(2);
  let products=[],active='Todos';
  const catalogId=new URLSearchParams(location.search).get('c')||'';
  function shade(h,a=-28){let n=parseInt(h.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+a)),g=Math.max(0,Math.min(255,((n>>8)&255)+a)),b=Math.max(0,Math.min(255,(n&255)+a));return '#'+(b|g<<8|r<<16).toString(16).padStart(6,'0')}
  function applyTheme(c){if(!/^#[0-9a-f]{6}$/i.test(c||''))return;document.documentElement.style.setProperty('--p',c);document.documentElement.style.setProperty('--p2',shade(c));$('themeMeta').content=c}
  function render(){
    const q=$('search').value.trim().toLowerCase();
    const cats=['Todos',...new Set(products.map(p=>p.category).filter(Boolean))];
    $('chips').innerHTML=cats.map(c=>`<button class="chip ${active===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
    const list=products.filter(p=>(active==='Todos'||p.category===active)&&(!q||[p.name,p.category,p.description].some(v=>String(v||'').toLowerCase().includes(q))));
    $('grid').innerHTML=list.length?list.map(p=>`<article class="product"><div class="photo">${p.image_data?`<img src="${esc(p.image_data)}" alt="${esc(p.name)}" loading="lazy">`:'Sin imagen'}</div><div class="body"><span class="cat">${esc(p.category||'Producto')}</span><h2>${esc(p.name)}</h2>${p.description?`<div class="desc">${esc(p.description)}</div>`:'<div class="desc"></div>'}<div class="bottom"><div class="price">${money(p.sell_price)}</div><span class="available">Disponible</span></div></div></article>`).join(''):'<div class="empty">No hay productos que coincidan con tu búsqueda.</div>';
  }
  $('search').addEventListener('input',render);
  $('chips').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;active=b.dataset.cat;render()});
  async function load(){
    if(!/^[0-9a-f-]{36}$/i.test(catalogId)){$('grid').innerHTML='<div class="empty error">Este enlace de catálogo no es válido.</div>';return}
    const {data:catalog,error:ce}=await sb.from('public_catalogs').select('business_id,business_name,theme_color,updated_at').eq('public_id',catalogId).maybeSingle();
    if(ce||!catalog){$('grid').innerHTML='<div class="empty error">Este catálogo no está disponible.</div>';return}
    applyTheme(catalog.theme_color);$('businessName').textContent=catalog.business_name||'Catálogo';document.title=(catalog.business_name||'Catálogo')+' · Varelia Store';
    const {data,error}=await sb.from('public_catalog_products').select('product_id,name,category,sell_price,stock,unit,description,image_data').eq('business_id',catalog.business_id).gt('stock',0).order('category').order('name');
    if(error){$('grid').innerHTML='<div class="empty error">No se pudo cargar el catálogo. Intenta nuevamente.</div>';return}
    products=data||[];render();
  }
  load();
})();
</script>
</body>
</html>
