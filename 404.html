<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página no encontrada · Varelia Store</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f7f8fc;color:#111827;display:grid;place-items:center;min-height:100vh;padding:24px}.box{max-width:520px;text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:28px;box-shadow:0 16px 40px rgba(15,23,42,.08)}a{color:#be185d;font-weight:800}</style>
</head>
<body>
<div class="box"><h1>Página no encontrada</h1><p>La dirección que abriste no existe.</p><a href="/">Volver a Varelia Store</a></div>
<script>
(()=>{
  const m=location.pathname.match(/^\/catalogo\/([^/]+)\/?$/i);
  if(!m)return;
  try{sessionStorage.setItem('varelia_catalog_route',decodeURIComponent(m[1]));}catch{}
  location.replace('/catalogo/');
})();
</script>
</body>
</html>
