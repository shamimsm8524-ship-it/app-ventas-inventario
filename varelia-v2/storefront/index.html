<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Varelia · Catálogo de negocio</title><link rel="stylesheet" href="../web/receipt.css"><style>:root{--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#1c2840;font:16px system-ui}header,main{max-width:950px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}main{padding-bottom:70px}.card{background:white;border-radius:20px;border:1px solid #e2e8f0;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.product{background:white;padding:16px;border-radius:15px;border:1px solid #e2e8f0}.product button{margin-top:12px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:white}input,select,textarea{padding:12px;width:100%;border:1px solid #ccd6e6;border-radius:10px;font:inherit}label{display:block;margin:10px 0}.line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed #cbd5e1}.muted{color:#64748b}.hidden{display:none}dialog{border:0;border-radius:24px;max-height:92vh;overflow:auto;width:min(96vw,670px);padding:12px;box-shadow:0 20px 90px #0005}dialog::backdrop{background:#10182899}#order-form{padding:18px}#error{color:#b91c1c}.vr-receipt{padding:12px}@media print{header,main,#order-form{display:none!important}dialog{position:static;max-height:none;box-shadow:none;width:100%}}</style></head><body>
<header><div><h1 id="name">Catálogo Varelia</h1><small class="muted" id="contact"></small></div><strong id="cart-count">🛒 0</strong></header>
<main><section class="card"><h2>Productos disponibles</h2><p class="muted">Arma tu pedido y espera la confirmación de la tienda.</p><input id="search" placeholder="Buscar productos" aria-label="Buscar productos"></section><p id="error" role="alert"></p><section id="products" class="grid"></section><section class="card" style="margin-top:18px"><h2>Tu pedido</h2><div id="cart"></div><div class="line"><strong>Total de productos</strong><strong id="total">S/ 0.00</strong></div><p class="muted">El envío y la disponibilidad se confirman con el negocio.</p><button id="order-button" class="primary" disabled>Realizar pedido</button></section></main>
<dialog id="order-dialog"><form id="order-form"><h2>Confirmar datos del pedido</h2><label>Nombre<input id="customer" maxlength="80" minlength="2" required></label><label>Teléfono / WhatsApp<input id="phone" type="tel" maxlength="25" minlength="6" required></label><label>Entrega<select id="delivery"><option value="pickup">Recojo en tienda</option><option value="delivery">Delivery</option></select></label><label>Pago preferido<select id="payment"><option value="cash">Efectivo</option><option value="yape">Yape</option><option value="plin">Plin</option><option value="transfer">Transferencia</option><option value="card">Tarjeta</option></select></label><label>Notas<textarea id="notes" maxlength="250"></textarea></label><p id="order-error" role="alert"></p><button type="button" id="cancel">Cancelar</button><button id="submit" class="primary" type="submit">Enviar pedido</button></form></dialog>
<dialog id="receipt-dialog"><div id="receipt"></div></dialog>
<script src="../web/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="../web/receipt.js"></script><script src="./storefront.js"></script></body></html>
