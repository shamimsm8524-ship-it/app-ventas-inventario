<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Mi Negocio - Ventas e Inventario</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--primary:#111827;--warn:#b45309;--danger:#b91c1c;--shadow:0 8px 28px rgba(17,24,39,.08)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px}.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1100px;margin:auto}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}.wrap{max-width:1100px;margin:auto;padding:16px 16px 92px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:4px;font-size:20px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.tab,.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap}.tab.active,.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}.view{display:none}.view.active{display:block}.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar input{flex:1}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--primary);color:#fff}.btn.secondary{background:#fff;border:1px solid var(--line)}.btn.danger{background:#fee2e2;color:var(--danger)}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.photo{aspect-ratio:1.2/1;background:#e5e7eb;display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.pbody{padding:12px}.pbody h3{font-size:15px;margin:0 0 4px}.meta{font-size:12px;color:var(--muted);line-height:1.5}.price{font-size:18px;font-weight:800;margin-top:7px}.stock{margin-top:6px;font-size:12px;font-weight:700}.stock.low{color:var(--warn)}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1;padding:9px}.list{display:grid;gap:10px}.rowcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:34px 18px;color:var(--muted)}dialog{border:0;border-radius:22px;padding:0;width:min(94vw,620px);box-shadow:0 24px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(17,24,39,.5)}.modal{padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{font-size:20px;margin:0}.close{width:38px;height:38px;border:0;border-radius:50%;font-size:24px;background:#f3f4f6}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:700}.form label span{display:block;margin-bottom:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview{width:100%;max-height:220px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}.cartitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:#fff}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-top:14px}.fab{position:fixed;right:18px;bottom:20px;z-index:15;border:0;border-radius:999px;background:var(--primary);color:#fff;padding:15px 18px;font-weight:800;box-shadow:0 10px 30px rgba(17,24,39,.3)}@media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.fab{display:none}}@media(max-width:460px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.toolbar{flex-wrap:wrap}.toolbar .btn{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div><h1>Mi Negocio</h1><p>Tienda · Bodega · Importaciones · Inventario</p></div><button class="btn primary" id="newSaleTop">+ Nueva venta</button></div></header>
<main class="wrap">
<section class="stats"><div class="stat"><small>Productos</small><strong id="statProducts">0</strong></div><div class="stat"><small>Stock bajo</small><strong id="statLow">0</strong></div><div class="stat"><small>Ventas de hoy</small><strong id="statToday">S/ 0.00</strong></div></section>
<nav class="tabs"><button class="tab active" data-view="products">Productos</button><button class="tab" data-view="categories">Categorías</button><button class="tab" data-view="sales">Ventas</button></nav>
<section id="products" class="view active"><div class="toolbar"><input id="search" type="search" placeholder="Buscar nombre, código o categoría"><button class="btn primary" id="newProduct">+ Producto</button></div><div class="chips" id="categoryChips"></div><div class="grid" id="productGrid"></div></section>
<section id="categories" class="view"><div class="toolbar"><input id="newCategoryName" placeholder="Ej. Bebidas, Limpieza, Tecnología..."><button class="btn primary" id="addCategory">Agregar</button></div><div class="list" id="categoryList"></div></section>
<section id="sales" class="view"><div class="list" id="salesList"></div></section>
</main>
<button class="fab" id="newSaleFab">+ Venta</button>
<dialog id="productDialog"><div class="modal"><div class="modalhead"><h2 id="productTitle">Nuevo producto</h2><button class="close" data-close="productDialog">×</button></div><form class="form" id="productForm"><input type="hidden" id="productId"><label><span>Imagen del producto</span><input id="productImage" type="file" accept="image/*"></label><img id="imagePreview" class="preview" hidden><label><span>Código de barras</span><input id="barcode" inputmode="numeric" placeholder="Escribe o pega el código"></label><label><span>Nombre del producto</span><input id="productName" required placeholder="Ej. Gaseosa 1.5 L, Audífonos, Detergente..."></label><label><span>Categoría</span><select id="productCategory" required></select></label><div class="two"><label><span>Precio compra (S/)</span><input id="buyPrice" type="number" min="0" step="0.01" value="0"></label><label><span>Precio venta (S/)</span><input id="sellPrice" type="number" min="0" step="0.01" required></label></div><div class="two"><label><span>Stock</span><input id="stock" type="number" min="0" step="0.01" value="0" required></label><label><span>Unidad</span><select id="unit"><option>Unidad</option><option>Caja</option><option>Paquete</option><option>Bolsa</option><option>Botella</option><option>Lata</option><option>Docena</option><option>Kg</option><option>Gramo</option><option>Litro</option><option>Metro</option><option>m²</option><option>Rollo</option><option>Par</option><option>Set</option><option>Otro</option></select></label></div><label><span>Descripción</span><textarea id="description" rows="3" placeholder="Marca, modelo, color, tamaño, proveedor u otros detalles"></textarea></label><div class="two"><button type="button" class="btn secondary" data-close="productDialog">Cancelar</button><button class="btn primary">Guardar producto</button></div></form></div></dialog>
<dialog id="saleDialog"><div class="modal"><div class="modalhead"><h2>Nueva venta</h2><button class="close" data-close="saleDialog">×</button></div><div class="form"><input id="saleSearch" placeholder="Buscar por nombre o código"><div id="saleResults" class="list"></div><div id="cart"></div><div class="total"><span>Total</span><span id="saleTotal">S/ 0.00</span></div><div class="two"><button class="btn secondary" data-close="saleDialog">Cancelar</button><button class="btn primary" id="checkout">Cobrar</button></div></div></div></dialog>
<script>
const K={products:'miNegocio_products_v1',categories:'miNegocio_categories_v1',sales:'miNegocio_sales_v1'};
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
let products=load(K.products,[]),categories=load(K.categories,['Abarrotes','Bebidas','Snacks','Limpieza','Cuidado personal','Hogar','Tecnología','Ropa y accesorios','Importados','Ferretería','Otros']),sales=load(K.sales,[]),activeCategory='Todos',cart=[];
if(categories.some(c=>['Pisos SPC','Pisos laminados','Parquet','Parquetón'].includes(c))&&products.length===0){categories=['Abarrotes','Bebidas','Snacks','Limpieza','Cuidado personal','Hogar','Tecnología','Ropa y accesorios','Importados','Ferretería','Otros'];localStorage.setItem(K.categories,JSON.stringify(categories))}
const $=s=>document.querySelector(s),money=n=>'S/ '+Number(n||0).toFixed(2),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function save(){localStorage.setItem(K.products,JSON.stringify(products));localStorage.setItem(K.categories,JSON.stringify(categories));localStorage.setItem(K.sales,JSON.stringify(sales));render()}
function render(){renderStats();renderCategories();renderProducts();renderSales();fillCategories()}
function renderStats(){$('#statProducts').textContent=products.length;$('#statLow').textContent=products.filter(p=>Number(p.stock)<=5).length;const d=new Date().toDateString();$('#statToday').textContent=money(sales.filter(s=>new Date(s.date).toDateString()===d).reduce((a,s)=>a+s.total,0))}
function renderCategories(){const chips=['Todos',...categories];$('#categoryChips').innerHTML=chips.map(c=>`<button class="chip ${activeCategory===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');$('#categoryList').innerHTML=categories.map(c=>`<div class="rowcard"><div><strong>${esc(c)}</strong><div class="meta">${products.filter(p=>p.category===c).length} producto(s)</div></div><button class="btn danger" data-delcat="${esc(c)}">Eliminar</button></div>`).join('')||'<div class="empty">No hay categorías.</div>'}
function renderProducts(){const q=$('#search').value.trim().toLowerCase();const list=products.filter(p=>(activeCategory==='Todos'||p.category===activeCategory)&&(!q||[p.name,p.barcode,p.category,p.description].some(x=>String(x||'').toLowerCase().includes(q))));$('#productGrid').innerHTML=list.map(p=>`<article class="product"><div class="photo">${p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:'Sin imagen'}</div><div class="pbody"><h3>${esc(p.name)}</h3><div class="meta">${esc(p.category)}${p.barcode?`<br>Cód. ${esc(p.barcode)}`:''}</div><div class="price">${money(p.sellPrice)}</div><div class="stock ${Number(p.stock)<=5?'low':''}">Stock: ${esc(p.stock)} ${esc(p.unit)}</div><div class="actions"><button class="btn secondary" data-edit="${p.id}">Editar</button><button class="btn primary" data-add="${p.id}">Vender</button></div></div></article>`).join('')||'<div class="empty" style="grid-column:1/-1">Agrega tu primer producto.</div>'}
function renderSales(){$('#salesList').innerHTML=[...sales].reverse().map(s=>`<div class="rowcard"><div><strong>${new Date(s.date).toLocaleString('es-PE')}</strong><div class="meta">${s.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(' · ')}</div></div><strong>${money(s.total)}</strong></div>`).join('')||'<div class="empty">Todavía no hay ventas.</div>'}
function fillCategories(){const v=$('#productCategory').value;$('#productCategory').innerHTML=categories.map(c=>`<option>${esc(c)}</option>`).join('');if(categories.includes(v))$('#productCategory').value=v}
function openProduct(id){const p=products.find(x=>x.id===id);$('#productForm').reset();$('#productId').value=p?.id||'';$('#productTitle').textContent=p?'Editar producto':'Nuevo producto';$('#barcode').value=p?.barcode||'';$('#productName').value=p?.name||'';fillCategories();if(p?.category)$('#productCategory').value=p.category;$('#buyPrice').value=p?.buyPrice??0;$('#sellPrice').value=p?.sellPrice??'';$('#stock').value=p?.stock??0;$('#unit').value=p?.unit||'Unidad';$('#description').value=p?.description||'';const pr=$('#imagePreview');if(p?.image){pr.src=p.image;pr.hidden=false}else{pr.hidden=true;pr.src=''}$('#productDialog').showModal()}
function fileData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
$('#productImage').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const d=await fileData(f);$('#imagePreview').src=d;$('#imagePreview').hidden=false});
$('#productForm').addEventListener('submit',e=>{e.preventDefault();const id=$('#productId').value||uid(),old=products.find(p=>p.id===id);const p={id,barcode:$('#barcode').value.trim(),name:$('#productName').value.trim(),category:$('#productCategory').value,buyPrice:Number($('#buyPrice').value||0),sellPrice:Number($('#sellPrice').value||0),stock:Number($('#stock').value||0),unit:$('#unit').value,description:$('#description').value.trim(),image:$('#imagePreview').hidden?'':$('#imagePreview').src};if(old)Object.assign(old,p);else products.push(p);save();$('#productDialog').close()});
function openSale(prefill=''){cart=[];$('#saleSearch').value=prefill;$('#saleDialog').showModal();renderSaleResults();renderCart()}
function renderSaleResults(){const q=$('#saleSearch').value.trim().toLowerCase();let list=q?products.filter(p=>[p.name,p.barcode,p.category].some(x=>String(x||'').toLowerCase().includes(q))):products.slice(0,8);$('#saleResults').innerHTML=list.slice(0,10).map(p=>`<div class="rowcard"><div><strong>${esc(p.name)}</strong><div class="meta">${money(p.sellPrice)} · Stock ${p.stock}</div></div><button class="btn primary" data-cartadd="${p.id}">Agregar</button></div>`).join('')}
function renderCart(){const total=cart.reduce((a,i)=>a+i.qty*i.sellPrice,0);$('#cart').innerHTML=cart.map(i=>`<div class="cartitem"><div><strong>${esc(i.name)}</strong><div class="meta">${money(i.sellPrice)} c/u</div></div><div class="qty"><button data-minus="${i.id}">−</button><strong>${i.qty}</strong><button data-plus="${i.id}">+</button></div></div>`).join('');$('#saleTotal').textContent=money(total)}
function addCart(id){const p=products.find(x=>x.id===id);if(!p||p.stock<=0)return alert('Producto sin stock');let i=cart.find(x=>x.id===id);if(i){if(i.qty>=p.stock)return alert('No hay más stock');i.qty++}else cart.push({...p,qty:1});renderCart()}
$('#checkout').onclick=()=>{if(!cart.length)return alert('Agrega productos a la venta');const total=cart.reduce((a,i)=>a+i.qty*i.sellPrice,0);cart.forEach(i=>{const p=products.find(x=>x.id===i.id);p.stock=Number(p.stock)-i.qty});sales.push({id:uid(),date:new Date().toISOString(),items:cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.sellPrice})),total});save();$('#saleDialog').close();alert('Venta registrada: '+money(total))};
$('#search').addEventListener('input',renderProducts);$('#saleSearch').addEventListener('input',renderSaleResults);$('#newProduct').onclick=()=>openProduct();$('#newSaleTop').onclick=()=>openSale();$('#newSaleFab').onclick=()=>openSale();$('#addCategory').onclick=()=>{const c=$('#newCategoryName').value.trim();if(!c)return;if(categories.some(x=>x.toLowerCase()===c.toLowerCase()))return alert('La categoría ya existe');categories.push(c);$('#newCategoryName').value='';save()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.view).classList.add('active')}if(b.dataset.cat){activeCategory=b.dataset.cat;renderCategories();renderProducts()}if(b.dataset.edit)openProduct(b.dataset.edit);if(b.dataset.add)openSale(products.find(p=>p.id===b.dataset.add)?.name||'');if(b.dataset.cartadd)addCart(b.dataset.cartadd);if(b.dataset.plus){const i=cart.find(x=>x.id===b.dataset.plus),p=products.find(x=>x.id===b.dataset.plus);if(i.qty<p.stock)i.qty++;renderCart()}if(b.dataset.minus){const i=cart.find(x=>x.id===b.dataset.minus);i.qty--;if(i.qty<=0)cart=cart.filter(x=>x.id!==i.id);renderCart()}if(b.dataset.delcat){const c=b.dataset.delcat;if(products.some(p=>p.category===c))return alert('Esta categoría tiene productos. Muévelos antes de eliminarla.');if(confirm('¿Eliminar '+c+'?')){categories=categories.filter(x=>x!==c);save()}}if(b.dataset.close)$('#'+b.dataset.close).close()});
render();
</script>
</body>
</html>
