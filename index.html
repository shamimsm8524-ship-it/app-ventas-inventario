<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Mi Negocio - Ventas e Inventario</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--primary:#111827;--success:#0f766e;--warn:#b45309;--danger:#b91c1c;--radius:18px;--shadow:0 8px 28px rgba(17,24,39,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px}.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1100px;margin:auto}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}.wrap{max-width:1100px;margin:auto;padding:16px 16px 92px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:4px;font-size:20px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.tab,.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap}.tab.active,.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}.view{display:none}.view.active{display:block}.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar input{flex:1}.field,input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--primary);color:#fff}.btn.secondary{background:#fff;border:1px solid var(--line)}.btn.danger{background:#fee2e2;color:var(--danger)}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.photo{aspect-ratio:1.2/1;background:#e5e7eb;display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.pbody{padding:12px}.pbody h3{font-size:15px;margin:0 0 4px}.meta{font-size:12px;color:var(--muted);line-height:1.5}.price{font-size:18px;font-weight:800;margin-top:7px}.stock{margin-top:6px;font-size:12px;font-weight:700}.stock.low{color:var(--warn)}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1;padding:9px}.list{display:grid;gap:10px}.rowcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:34px 18px;color:var(--muted)}dialog{border:0;border-radius:22px;padding:0;width:min(94vw,620px);box-shadow:0 24px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(17,24,39,.5)}.modal{padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{font-size:20px;margin:0}.close{width:38px;height:38px;border:0;border-radius:50%;font-size:24px;background:#f3f4f6}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:700}.form label span{display:block;margin-bottom:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview{width:100%;max-height:220px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}.camera{width:100%;background:#000;border-radius:14px;max-height:50vh}.cartitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:#fff}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-top:14px}.sale small{color:var(--muted)}.fab{position:fixed;right:18px;bottom:20px;z-index:15;border:0;border-radius:999px;background:var(--primary);color:#fff;padding:15px 18px;font-weight:800;box-shadow:0 10px 30px rgba(17,24,39,.3)}@media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.stats{grid-template-columns:repeat(3,1fr)}.fab{display:none}}@media(max-width:460px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.toolbar{flex-wrap:wrap}.toolbar .btn{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div><h1>Mi Negocio</h1><p>Ventas e inventario</p></div><button class="btn primary" id="newSaleTop">+ Nueva venta</button></div></header>
<main class="wrap">
<section class="stats"><div class="stat"><small>Productos</small><strong id="statProducts">0</strong></div><div class="stat"><small>Stock bajo</small><strong id="statLow">0</strong></div><div class="stat"><small>Ventas de hoy</small><strong id="statToday">S/ 0.00</strong></div></section>
<nav class="tabs"><button class="tab active" data-view="products">Productos</button><button class="tab" data-view="categories">Categorías</button><button class="tab" data-view="sales">Ventas</button></nav>
<section id="products" class="view active"><div class="toolbar"><input id="search" type="search" placeholder="Buscar nombre, código o categoría"><button class="btn primary" id="newProduct">+ Producto</button></div><div class="chips" id="categoryChips"></div><div class="grid" id="productGrid"></div></section>
<section id="categories" class="view"><div class="toolbar"><input id="newCategoryName" placeholder="Ej. Pisos SPC"><button class="btn primary" id="addCategory">Agregar</button></div><div class="list" id="categoryList"></div></section>
<section id="sales" class="view"><div class="list" id="salesList"></div></section>
</main>
<button class="fab" id="newSaleFab">+ Venta</button>

<dialog id="productDialog"><div class="modal"><div class="modalhead"><h2 id="productTitle">Nuevo producto</h2><button class="close" data-close="productDialog">×</button></div><form class="form" id="productForm"><input type="hidden" id="productId"><label><span>Imagen del producto</span><input id="productImage" type="file" accept="image/*" capture="environment"></label><img id="imagePreview" class="preview" hidden><div class="two"><label><span>Código de barras</span><input id="barcode" inputmode="numeric" placeholder="Escanea o escribe"></label><div style="align-self:end"><button type="button" class="btn secondary" id="scanForProduct" style="width:100%">📷 Escanear</button></div></div><label><span>Nombre</span><input id="productName" required placeholder="Ej. Piso SPC Roble 5 mm"></label><label><span>Categoría</span><select id="productCategory" required></select></label><div class="two"><label><span>Precio compra (S/)</span><input id="buyPrice" type="number" min="0" step="0.01" value="0"></label><label><span>Precio venta (S/)</span><input id="sellPrice" type="number" min="0" step="0.01" required></label></div><div class="two"><label><span>Stock</span><input id="stock" type="number" min="0" step="1" value="0" required></label><label><span>Unidad</span><select id="unit"><option>Unidad</option><option>Caja</option><option>m²</option><option>Paquete</option><option>Galón</option></select></label></div><label><span>Descripción</span><textarea id="description" rows="3" placeholder="Opcional"></textarea></label><div class="two"><button type="button" class="btn secondary" data-close="productDialog">Cancelar</button><button class="btn primary">Guardar producto</button></div></form></div></dialog>

<dialog id="saleDialog"><div class="modal"><div class="modalhead"><h2>Nueva venta</h2><button class="close" data-close="saleDialog">×</button></div><div class="form"><div class="two"><input id="saleSearch" placeholder="Buscar o escanear producto"><button class="btn secondary" id="scanForSale">📷 Escanear</button></div><div id="saleResults" class="list"></div><div id="cart"></div><div class="total"><span>Total</span><span id="saleTotal">S/ 0.00</span></div><div class="two"><button class="btn secondary" data-close="saleDialog">Cancelar</button><button class="btn primary" id="checkout">Cobrar</button></div></div></div></dialog>

<dialog id="scannerDialog"><div class="modal"><div class="modalhead"><h2>Escanear código</h2><button class="close" id="closeScanner">×</button></div><video id="scannerVideo" class="camera" autoplay playsinline></video><p id="scannerText" class="meta">Apunta la cámara al código de barras.</p></div></dialog>

<script>
const K={products:'miNegocio_products_v1',categories:'miNegocio_categories_v1',sales:'miNegocio_sales_v1'};
let products=load(K.products,[]), categories=load(K.categories,['Pisos SPC','Pisos laminados','Parquet','Parquetón','Zócalos','Pegamentos','Herramientas','Otros']), sales=load(K.sales,[]), activeCategory='Todos', cart=[], scannerTarget=null, stream=null, scanTimer=null;
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function save(){localStorage.setItem(K.products,JSON.stringify(products));localStorage.setItem(K.categories,JSON.stringify(categories));localStorage.setItem(K.sales,JSON.stringify(sales));render()}
const money=n=>'S/ '+Number(n||0).toFixed(2); const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function render(){renderStats();renderCategories();renderProducts();renderSales();fillCategorySelect()}
function renderStats(){document.querySelector('#statProducts').textContent=products.length;document.querySelector('#statLow').textContent=products.filter(p=>Number(p.stock)<=5).length;const today=new Date().toDateString();const t=sales.filter(s=>new Date(s.date).toDateString()===today).reduce((a,s)=>a+s.total,0);document.querySelector('#statToday').textContent=money(t)}
function renderCategories(){const chips=['Todos',...categories];document.querySelector('#categoryChips').innerHTML=chips.map(c=>`<button class="chip ${activeCategory===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelector('#categoryList').innerHTML=categories.length?categories.map(c=>`<div class="rowcard"><div><strong>${esc(c)}</strong><div class="meta">${products.filter(p=>p.category===c).length} producto(s)</div></div><button class="btn danger" data-delcat="${esc(c)}">Eliminar</button></div>`).join(''):'<div class="empty">No hay categorías.</div>'}
function renderProducts(){const q=document.querySelector('#search').value.trim().toLowerCase();let list=products.filter(p=>(activeCategory==='Todos'||p.category===activeCategory)&&(!q||[p.name,p.barcode,p.category].some(x=>String(x||'').toLowerCase().includes(q))));document.querySelector('#productGrid').innerHTML=list.length?list.map(p=>`<article class="product"><div class="photo">${p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:'Sin imagen'}</div><div class="pbody"><h3>${esc(p.name)}</h3><div class="meta">${esc(p.category)}${p.barcode?`<br>Cód. ${esc(p.barcode)}`:''}</div><div class="price">${money(p.sellPrice)}</div><div class="stock ${Number(p.stock)<=5?'low':''}">Stock: ${esc(p.stock)} ${esc(p.unit)}</div><div class="actions"><button class="btn secondary" data-edit="${p.id}">Editar</button><button class="btn primary" data-add="${p.id}">Vender</button></div></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1">No encontramos productos. Agrega el primero.</div>'}
function renderSales(){document.querySelector('#salesList').innerHTML=sales.length?[...sales].reverse().map(s=>`<div class="rowcard sale"><div><strong>${new Date(s.date).toLocaleString('es-PE')}</strong><br><small>${s.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(' · ')}</small></div><strong>${money(s.total)}</strong></div>`).join(''):'<div class="empty">Todavía no hay ventas registradas.</div>'}
function fillCategorySelect(){const el=document.querySelector('#productCategory'),v=el.value;el.innerHTML=categories.map(c=>`<option>${esc(c)}</option>`).join('');if(categories.includes(v))el.value=v}
function openProduct(id){const p=products.find(x=>x.id===id);document.querySelector('#productForm').reset();document.querySelector('#productId').value=p?.id||'';document.querySelector('#productTitle').textContent=p?'Editar producto':'Nuevo producto';document.querySelector('#barcode').value=p?.barcode||'';document.querySelector('#productName').value=p?.name||'';fillCategorySelect();if(p?.category)document.querySelector('#productCategory').value=p.category;document.querySelector('#buyPrice').value=p?.buyPrice??0;document.querySelector('#sellPrice').value=p?.sellPrice??'';document.querySelector('#stock').value=p?.stock??0;document.querySelector('#unit').value=p?.unit||'Unidad';document.querySelector('#description').value=p?.description||'';const prev=document.querySelector('#imagePreview');if(p?.image){prev.src=p.image;prev.hidden=false}else{prev.src='';prev.hidden=true}document.querySelector('#productDialog').showModal()}
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
document.querySelector('#productImage').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const data=await fileToDataURL(f);const prev=document.querySelector('#imagePreview');prev.src=data;prev.hidden=false});
document.querySelector('#productForm').addEventListener('submit',e=>{e.preventDefault();if(!categories.length)return alert('Crea una categoría primero.');const id=document.querySelector('#productId').value,old=products.find(x=>x.id===id),barcode=document.querySelector('#barcode').value.trim();if(barcode&&products.some(x=>x.barcode===barcode&&x.id!==id))return alert('Ese código de barras ya está registrado.');const p={id:id||uid(),barcode,name:document.querySelector('#productName').value.trim(),category:document.querySelector('#productCategory').value,buyPrice:Number(document.querySelector('#buyPrice').value||0),sellPrice:Number(document.querySelector('#sellPrice').value||0),stock:Number(document.querySelector('#stock').value||0),unit:document.querySelector('#unit').value,description:document.querySelector('#description').value.trim(),image:document.querySelector('#imagePreview').src||old?.image||''};if(old)Object.assign(old,p);else products.push(p);save();document.querySelector('#productDialog').close()});
document.querySelector('#addCategory').onclick=()=>{const i=document.querySelector('#newCategoryName'),c=i.value.trim();if(!c)return;if(categories.some(x=>x.toLowerCase()===c.toLowerCase()))return alert('Esa categoría ya existe.');categories.push(c);i.value='';save()};
document.body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.close)document.querySelector('#'+b.dataset.close).close();if(b.dataset.view){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.view))}if(b.dataset.cat!==undefined){activeCategory=b.dataset.cat;renderCategories();renderProducts()}if(b.dataset.edit)openProduct(b.dataset.edit);if(b.dataset.add){openSale();addToCart(b.dataset.add)}if(b.dataset.delcat){const c=b.dataset.delcat;if(products.some(p=>p.category===c))return alert('No puedes eliminar esta categoría porque tiene productos.');if(confirm('¿Eliminar la categoría '+c+'?')){categories=categories.filter(x=>x!==c);save()}}});
document.querySelector('#search').addEventListener('input',renderProducts);document.querySelector('#newProduct').onclick=()=>openProduct();
function openSale(){cart=[];document.querySelector('#saleSearch').value='';document.querySelector('#saleResults').innerHTML='';renderCart();document.querySelector('#saleDialog').showModal()}
document.querySelector('#newSaleTop').onclick=openSale;document.querySelector('#newSaleFab').onclick=openSale;
function searchSale(){const q=document.querySelector('#saleSearch').value.trim().toLowerCase();if(!q){document.querySelector('#saleResults').innerHTML='';return}const list=products.filter(p=>[p.name,p.barcode,p.category].some(x=>String(x||'').toLowerCase().includes(q))).slice(0,6);document.querySelector('#saleResults').innerHTML=list.map(p=>`<button class="btn secondary" data-saleadd="${p.id}" style="text-align:left">${esc(p.name)} · ${money(p.sellPrice)} · Stock ${p.stock}</button>`).join('')}
document.querySelector('#saleSearch').addEventListener('input',searchSale);document.querySelector('#saleResults').addEventListener('click',e=>{const b=e.target.closest('[data-saleadd]');if(b)addToCart(b.dataset.saleadd)});
function addToCart(id){const p=products.find(x=>x.id===id);if(!p||p.stock<=0)return alert('Producto sin stock.');const item=cart.find(x=>x.id===id);if(item){if(item.qty>=p.stock)return alert('No hay más stock disponible.');item.qty++}else cart.push({id:p.id,name:p.name,price:p.sellPrice,qty:1});renderCart()}
function renderCart(){const el=document.querySelector('#cart');el.innerHTML=cart.length?cart.map(i=>`<div class="cartitem"><div><strong>${esc(i.name)}</strong><div class="meta">${money(i.price)} c/u</div></div><div class="qty"><button data-q="-1" data-id="${i.id}">−</button><strong>${i.qty}</strong><button data-q="1" data-id="${i.id}">+</button></div></div>`).join(''):'<div class="empty">Agrega productos a la venta.</div>';document.querySelector('#saleTotal').textContent=money(cart.reduce((a,i)=>a+i.price*i.qty,0))}
document.querySelector('#cart').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;const i=cart.find(x=>x.id===b.dataset.id),p=products.find(x=>x.id===i.id),d=Number(b.dataset.q);if(d>0&&i.qty>=p.stock)return alert('No hay más stock disponible.');i.qty+=d;if(i.qty<=0)cart=cart.filter(x=>x.id!==i.id);renderCart()});
document.querySelector('#checkout').onclick=()=>{if(!cart.length)return alert('Agrega al menos un producto.');for(const i of cart){const p=products.find(x=>x.id===i.id);if(!p||p.stock<i.qty)return alert('El stock cambió. Revisa la venta.')}for(const i of cart)products.find(x=>x.id===i.id).stock-=i.qty;const total=cart.reduce((a,i)=>a+i.price*i.qty,0);sales.push({id:uid(),date:new Date().toISOString(),items:cart.map(x=>({...x})),total});save();document.querySelector('#saleDialog').close();alert('Venta registrada por '+money(total))};
async function startScanner(target){scannerTarget=target;const dlg=document.querySelector('#scannerDialog'),video=document.querySelector('#scannerVideo'),msg=document.querySelector('#scannerText');if(!navigator.mediaDevices?.getUserMedia){alert('Este navegador no permite usar la cámara. Puedes escribir el código manualmente.');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});video.srcObject=stream;dlg.showModal();if('BarcodeDetector' in window){const formats=await BarcodeDetector.getSupportedFormats();const det=new BarcodeDetector({formats:formats.filter(f=>['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar'].includes(f))});scanTimer=setInterval(async()=>{try{const codes=await det.detect(video);if(codes[0]?.rawValue){handleScan(codes[0].rawValue);stopScanner()}}catch{}},450)}else msg.textContent='Tu navegador no tiene detección automática. Puedes escribir el código manualmente.'}catch(err){alert('No se pudo abrir la cámara. Revisa el permiso de cámara.')}}
function handleScan(code){if(scannerTarget==='product'){document.querySelector('#barcode').value=code}else{document.querySelector('#saleSearch').value=code;searchSale();const p=products.find(x=>x.barcode===code);if(p)addToCart(p.id)}}
function stopScanner(){if(scanTimer)clearInterval(scanTimer);scanTimer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;const d=document.querySelector('#scannerDialog');if(d.open)d.close()}
document.querySelector('#scanForProduct').onclick=()=>startScanner('product');document.querySelector('#scanForSale').onclick=()=>startScanner('sale');document.querySelector('#closeScanner').onclick=stopScanner;document.querySelector('#scannerDialog').addEventListener('close',()=>{if(stream)stopScanner()});
render();
</script>
</body>
</html>
