<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizando Varelia</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui;background:#f8fafc;color:#111827}.box{text-align:center;padding:28px}.logo{width:68px;height:68px;border-radius:22px;margin:auto;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900}.spin{width:36px;height:36px;border:4px solid #e5e7eb;border-top-color:#6366f1;border-radius:50%;margin:22px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="logo">V</div><h2>Actualizando Varelia</h2><div class="spin"></div><p>No cierres esta ventana.</p></div><script>(async()=>{try{if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}const stamp=Date.now();await Promise.allSettled([fetch('product-view.js?v='+stamp,{cache:'reload'}),fetch('supabase-auth.js?v='+stamp,{cache:'reload'}),fetch('auth-enhancements.js?v='+stamp,{cache:'reload'})]);setTimeout(()=>location.replace('index.html?actualizado='+stamp),700)}catch(e){location.replace('index.html?actualizado='+Date.now())}})();</script></body></html>
