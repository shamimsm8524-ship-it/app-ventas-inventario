<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#be185d">
<title>Catálogo · Varelia Store</title>
<meta name="description" content="Explora el catálogo de productos disponibles y elige lo que quieres comprar.">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:title" content="Catálogo · Varelia Store">
<meta property="og:description" content="Explora el catálogo de productos disponibles y elige lo que quieres comprar.">
<meta property="og:image" content="https://vareliastore.tech/og-image.jpg">
<meta property="og:url" id="catalogOgUrl" content="https://vareliastore.tech/catalogo/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="canonical" id="catalogCanonical" href="https://vareliastore.tech/catalogo/">
<style>
html,body{width:100%;height:100%;margin:0;background:#f7f8fc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#111827}body{overflow:hidden}#catalogFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}.state{position:fixed;inset:0;display:grid;place-items:center;padding:24px}.box{max-width:520px;text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:28px;box-shadow:0 16px 40px rgba(15,23,42,.08)}.spin{width:34px;height:34px;border:4px solid #f3d5e2;border-top-color:#be185d;border-radius:50%;margin:0 auto 15px;animation:spin .8s linear infinite}.error{display:none}.error a{color:#be185d;font-weight:800}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="state" id="loading"><div class="box"><div class="spin"></div><strong>Abriendo catálogo…</strong></div></div>
<div class="state error" id="error"><div class="box"><h2>Catálogo no disponible</h2><p>Revisa que el enlace esté completo.</p><a href="/">Volver a Varelia Store</a></div></div>
<iframe id="catalogFrame" title="Catálogo de productos"></iframe>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
  const params=new URLSearchParams(location.search);
  let slug=params.get('s')||'';
  if(!slug){try{slug=sessionStorage.getItem('varelia_catalog_route')||'';sessionStorage.removeItem('varelia_catalog_route')}catch{}}
  slug=String(slug).trim().toLowerCase().replace(/^\/+|\/+$/g,'');
  const fail=()=>{document.getElementById('loading').style.display='none';document.getElementById('error').style.display='grid'};
  if(!/^[a-z0-9-]{1,80}$/.test(slug)){fail();return}

  history.replaceState(null,'','/catalogo/'+encodeURIComponent(slug)+'/');

  const SUPABASE_URL='https://onvdcaohnftrjunwdvjp.supabase.co';
  const SUPABASE_KEY=atob('c2JfcHVibGlzaGFibGVfYnoyejV1Z2xmX0VBTEplenF2NHJDd19TNzNHTU5yaA==');
  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  const {data,error}=await sb.from('public_catalogs').select('public_id,business_name').eq('public_slug',slug).eq('enabled',true).maybeSingle();
  if(error||!data?.public_id){fail();return}

  const businessName=data.business_name||'Catálogo';
  document.title=businessName+' · Varelia Store';
  const desc='Catálogo de '+businessName+': mira los productos disponibles y elige lo que quieres comprar.';
  document.querySelector('meta[name="description"]')?.setAttribute('content',desc);
  document.querySelector('meta[property="og:title"]')?.setAttribute('content',document.title);
  document.querySelector('meta[property="og:description"]')?.setAttribute('content',desc);
  const canonicalUrl='https://vareliastore.tech/catalogo/'+encodeURIComponent(slug)+'/';
  document.getElementById('catalogCanonical')?.setAttribute('href',canonicalUrl);
  document.getElementById('catalogOgUrl')?.setAttribute('content',canonicalUrl);
  const frame=document.getElementById('catalogFrame');
  frame.onload=()=>{document.getElementById('loading').style.display='none';frame.style.display='block'};
  frame.src='/catalogo.html?c='+encodeURIComponent(data.public_id);
})();
</script>
</body>
</html>
