(async function loadCatalogSafe(){
 try{
  var a=await get('public_catalogs?select=business_id,business_name,business_info,social_links,theme_color&public_id=eq.'+encodeURIComponent(PID)+'&enabled=eq.true&limit=1');
  if(a&&a[0]){
   var x=a[0];if(!x.business_id)throw Error('El catálogo no tiene un negocio asociado');BID=String(x.business_id);business=x.business_name||business;info=x.business_info||info;$('business').textContent=business;
   var slogan=String(info.slogan||'').trim();if(slogan.toLowerCase()==='calidad y buenos precios')slogan='';
   $('heroSlogan').textContent=slogan;$('heroSlogan').style.display=slogan?'block':'none';$('businessSloganText').textContent=slogan;$('businessSlogan').style.display='none';
   if(/^#[0-9a-f]{6}$/i.test(x.theme_color||''))document.documentElement.style.setProperty('--b',x.theme_color);
   var f=[];if(info.phone)f.push(['CONTACTO',info.phone]);if(info.address)f.push(['UBICACIÓN',info.address]);if(info.hours)f.push(['HORARIO',info.hours]);
   $('facts').innerHTML=f.map(function(z){var cls=z[0]==='HORARIO'?'fact fact-hours':'fact';return'<div class="'+cls+'"><small>'+z[0]+'</small><b>'+esc(z[1])+'</b></div>'}).join('');
   $('socials').innerHTML=(x.social_links||[]).map(function(y){return'<a class="pill" href="'+esc(y.url)+'" target="_blank">'+esc(y.label||y.type)+'</a>'}).join('');
   $('waTop').href='https://wa.me/'+String(info.whatsapp||info.phone||'').replace(/\D/g,'');
  }
 }catch(e){console.error('catalog info',e)}
 try{
  if(!BID)throw Error('No se encontró el negocio de este catálogo');products=await get('public_catalog_products?select=product_id,name,category,sell_price,stock,unit,image_data,description,specifications,characteristics,variant_combinations,medicine,blisters_per_box,units_per_blister,box_price,blister_price,unit_medicine_price&business_id=eq.'+encodeURIComponent(BID)+'&order=name.asc')||[];
  deliveryOptions();paymentOptions();cats();render();
 }catch(e){
  console.error('catalog products',e);
  $('grid').innerHTML='<p>No se pudo cargar los productos. Error: '+esc(e&&e.message||'desconocido')+'</p>';
 }
})();})();</script></body></html>
