<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Catálogo Varelia</title><style>html,body{margin:0;min-height:100%;background:#f7f7f5;font-family:Arial,sans-serif}#status{padding:24px;text-align:center;color:#374151}</style></head><body><div id="status">Cargando catálogo…</div><script>(async function(){try{var base='/catalogo/milagros/catalogo-base-v110.html'+location.search;var r=await fetch(base,{cache:'no-store'});if(!r.ok)throw new Error('No se pudo cargar el catálogo');var html=await r.text();var a=html.indexOf('function salePresentations(p){');var b=html.indexOf('function cartPrice',a);if(a<0||b<0)throw new Error('No se encontró la lógica de presentaciones');var fixed="function salePresentations(p){return (Array.isArray(p&&p.sale_presentations)?p.sale_presentations:[]).map(function(x,i){var units=Math.max(1,Math.floor(Number(x&&x.units)||1)),total=Math.max(0,Number(x&&x.price)||0),unitPrice=units?total/units:total;return{id:String(x&&x.id||('presentacion_'+(i+1))),name:String(x&&x.name||'Presentación'),units:units,price:Math.round(total*100)/100,unitPrice:Math.round(unitPrice*100)/100,active:!x||x.active!==false}}).filter(function(x){return x.active&&x.units>1&&x.price>0})}\n";html=html.slice(0,a)+fixed+html.slice(b);document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='No se pudo cargar el catálogo. '+String(e&&e.message||e)}})();</script></body></html>
