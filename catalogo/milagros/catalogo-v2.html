<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>Catálogo Milagros</title><style>:root{--b:#2463eb;--bg:#f8f4ee;--card:#fffdf9;--ink:#171310;--muted:#81766d;--line:#e7ddd2}*{box-sizing:border-box}html{touch-action:manipulation}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}button,a,input,select,textarea{touch-action:manipulation}.hero{background:#201915;color:#fff;padding:28px 22px 70px}.hero h1{font:400 46px Georgia;margin:45px 0 8px}.top{display:flex;justify-content:space-between;align-items:center}.top a,.top button{border:1px solid #ffffff55;background:transparent;color:#fff;padding:10px 13px;border-radius:999px;text-decoration:none}.seller{margin:-42px 18px 0;background:var(--card);padding:20px;border-radius:22px;box-shadow:0 16px 40px #00000014}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.fact{border-top:1px solid var(--line);padding-top:10px}.fact small{display:block;color:var(--muted);font-size:9px;font-weight:800}.fact b{font-size:12px}.pills{display:flex;gap:7px;overflow:auto;margin-top:14px}.pill{border:1px solid var(--line);padding:8px 11px;border-radius:99px;white-space:nowrap;font-size:10px;text-decoration:none;color:var(--ink)}.shop{padding:38px 18px 110px}.shop h2{text-align:center;font:400 32px Georgia}.search{width:100%;padding:13px 4px;border:0;border-bottom:1px solid #aaa;background:transparent;font-size:15px}.cats{display:flex;gap:7px;overflow:auto;padding:16px 0}.cat{border:0;background:transparent;padding:9px 12px;border-radius:99px;font-weight:800}.cat.on{background:#2463eb18;color:var(--b)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px}.photo{aspect-ratio:.84;background:#eee7df;overflow:hidden;display:grid;place-items:center;font-size:11px;color:#888}.photo img{width:100%;height:100%;object-fit:cover}.name{font:17px Georgia;margin:8px 0 3px}.price{font-weight:900}.buy{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.add{border:1px solid var(--b);background:#fff;color:var(--b);padding:10px 12px;font-weight:900;position:relative;z-index:2}.bar{display:none;position:fixed;z-index:20;left:12px;right:12px;bottom:12px;background:#171310;color:#fff;padding:12px 14px;align-items:center;justify-content:space-between}.bar.on{display:flex}.bar button,.primary{border:0;background:var(--b);color:#fff;padding:12px 14px;font-weight:900}.modal{display:none;position:fixed;z-index:50;inset:0;background:#0009;padding:10px;align-items:flex-end}.modal.on{display:flex}.sheet{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}.sheet h2{font:28px Georgia;margin:0 0 12px}.item,.row,.total{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.box{background:#f2ece5;padding:13px;margin:13px 0}.box input,.box textarea,.box select{width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);background:#fff}.note{font-size:11px;color:var(--muted);line-height:1.45;margin-top:8px}.total{font-size:17px;font-weight:900}.primary,.close{width:100%;margin-top:8px}.close{border:0;padding:13px}.shalomNote{color:var(--muted);font-style:italic}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}.facts{grid-template-columns:repeat(4,1fr)}.seller,.shop{max-width:1100px;margin-left:auto;margin-right:auto}}</style></head><body><header class="hero"><div class="top"><b>MQ</b><div><a id="waTop" href="#">WhatsApp</a> <button id="share" type="button">Compartir</button></div></div><h1 id="business">Milagros Quispe</h1><div>Catálogo oficial · Stock actualizado</div></header><section class="seller"><h3>La boutique</h3><div class="facts" id="facts"></div><div class="pills" id="payments"></div><div class="pills" id="socials"></div></section><section class="shop"><h2>Descubre nuestros productos</h2><input class="search" id="q" placeholder="Buscar en la colección"><div class="cats" id="cats"></div><div class="grid" id="grid"></div></section><div class="bar" id="bar"><div><b id="count">0 productos</b><div id="sum">S/ 0.00</div></div><button id="view" type="button">VER PEDIDO</button></div><div class="modal" id="modal"><div class="sheet"><h2>Tu selección</h2><div id="items"></div><div class="box"><b>DATOS DEL CLIENTE</b><input id="cname" placeholder="Nombre y apellido *"><input id="phone" inputmode="tel" placeholder="Celular / WhatsApp *"><input id="city" placeholder="Distrito / ciudad *"><textarea id="address" placeholder="Dirección de entrega *"></textarea><input id="shalom" placeholder="Sucursal / agencia Shalom" hidden><input id="ref" placeholder="Referencia (opcional)"></div><div class="box"><b>FORMA DE ENTREGA</b><select id="delivery"></select><div class="note" id="note"></div></div><div class="row"><span>Productos</span><b id="subtotal"></b></div><div class="row"><span>Envío</span><b id="ship"></b></div><div class="total"><span>Total</span><span id="total"></span></div><button class="primary" id="order" type="button">Enviar pedido</button><button class="close" id="close" type="button">Seguir comprando</button></div></div><script>'use strict';const API='https://onvdcaohnftrjunwdvjp.supabase.co/rest/v1/',KEY='sb_publishable_bz2z5uglf_EALJezqv4rCw_S73GMNrh',PID='bcb528ba-4495-4aaa-886d-676f8833ff19',BID='c16b1eb0-ce53-46f5-acde-be72df266376',$=id=>document.getElementById(id),money=n=>'S/ '+Number(n||0).toFixed(2);let info={allow_pickup:true,delivery:{}},products=[],cart={},category='Todos',business='Milagros Quispe';async function get(path){const r=await fetch(API+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY},cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function deliveryOptions(){const d=info.delivery||{},o=[];if(info.allow_pickup!==false)o.push(['pickup','Recojo en tienda — S/ 0.00',0]);for(const k of ['indrive','olva'])if(d[k]?.enabled!==false)o.push([k,(k==='indrive'?'InDrive':'Olva')+' — '+money(d[k]?.cost),Number(d[k]?.cost||0)]);if(d.shalom?.enabled!==false)o.push(['shalom','Shalom · Pago en agencia',0]);$('delivery').innerHTML=o.map(x=>`<option value="${x[0]}" data-cost="${x[2]}">${x[1]}</option>`).join('')}function cats(){const a=['Todos',...new Set(products.map(p=>p.category||'Otros'))];$('cats').innerHTML=a.map(x=>`<button type="button" class="cat ${x===category?'on':''}" data-cat="${esc(x)}">${esc(x)}</button>`).join('')}function render(){const q=$('q').value.trim().toLowerCase();const a=products.filter(p=>(category==='Todos'||(p.category||'Otros')===category)&&(!q||String(p.name).toLowerCase().includes(q)));$('grid').innerHTML=a.map(p=>`<article><div class="photo">${p.image_data?`<img src="${esc(p.image_data)}" alt="">`:'Sin imagen'}</div><div class="name">${esc(p.name)}</div><small>${esc(p.category||'Producto')}</small><div class="buy"><span class="price">${money(p.sell_price)}</span><button type="button" class="add" data-id="${esc(p.product_id)}">Añadir</button></div></article>`).join('')||'<p>No hay productos disponibles.</p>';drawCart()}function totals(){let n=0,sub=0;for(const [id,q] of Object.entries(cart)){const p=products.find(x=>String(x.product_id)===id);if(p){n+=q;sub+=q*Number(p.sell_price)}}const type=$('delivery').value;const ship=type==='shalom'?0:Number($('delivery').selectedOptions[0]?.dataset.cost||0);return{n,sub,ship,total:sub+ship}}function drawCart(){const s=totals();$('bar').classList.toggle('on',s.n>0);$('count').textContent=s.n+' producto'+(s.n===1?'':'s');$('sum').textContent=money(s.total);$('subtotal').textContent=money(s.sub);$('ship').textContent=$('delivery').value==='shalom'?'Pago en agencia':money(s.ship);$('total').textContent=money(s.total);$('items').innerHTML=Object.entries(cart).map(([id,q])=>{const p=products.find(x=>String(x.product_id)===id);return p?`<div class="item"><span>${esc(p.name)} × ${q}</span><b>${money(q*p.sell_price)}</b></div>`:''}).join('');const t=$('delivery').value;$('shalom').hidden=t!=='shalom';$('note').innerHTML=t==='shalom'?'<span class="shalomNote">El envío se abona directamente en Shalom y no se incluye en el total.</span>':t==='pickup'?'Recojo en tienda.':'El costo de envío se suma al pedido.'}document.addEventListener('click',e=>{const add=e.target.closest('.add');if(add){const id=add.dataset.id;cart[id]=(cart[id]||0)+1;drawCart();return}const c=e.target.closest('.cat');if(c){category=c.dataset.cat;cats();render();return}});$('q').addEventListener('input',render);$('delivery').addEventListener('change',drawCart);$('view').onclick=()=>{$('modal').classList.add('on');drawCart()};$('close').onclick=()=>$('modal').classList.remove('on');$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('on')});$('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:business,url:location.href});else await navigator.clipboard.writeText(location.href)}catch(e){}};$('order').onclick=()=>{const name=$('cname').value.trim(),phone=$('phone').value.trim(),city=$('city').value.trim(),type=$('delivery').value;if(!name||!phone||!city){alert('Completa nombre, celular y distrito/ciudad.');return}if(type!=='pickup'&&!$('address').value.trim()){alert('Ingresa la dirección de entrega.');return}if(type==='shalom'&&!$('shalom').value.trim()){alert('Indica la sucursal o agencia Shalom.');return}const s=totals(),lines=Object.entries(cart).map(([id,q])=>{const p=products.find(x=>String(x.product_id)===id);return p?`• ${p.name} x${q} — ${money(q*p.sell_price)}`:''}).filter(Boolean);let txt=`PEDIDO - ${business}\n\nCliente: ${name}\nCelular: ${phone}\nDistrito/Ciudad: ${city}\nEntrega: ${$('delivery').selectedOptions[0]?.textContent||type}`;if(type!=='pickup')txt+=`\nDirección: ${$('address').value.trim()}`;if(type==='shalom')txt+=`\nAgencia Shalom: ${$('shalom').value.trim()}\nEl envío se paga directamente en Shalom y no está incluido en el total.`;if($('ref').value.trim())txt+=`\nReferencia: ${$('ref').value.trim()}`;txt+=`\n\n${lines.join('\n')}\n\nProductos: ${money(s.sub)}\nEnvío: ${type==='shalom'?'Pago en agencia':money(s.ship)}\nTOTAL: ${money(s.total)}`;const wa=String(info.whatsapp||info.phone||'919757859').replace(/\D/g,'');location.href='https://wa.me/'+wa+'?text='+encodeURIComponent(txt)};async function init(){deliveryOptions();try{const [a,p]=await Promise.all([get('public_catalogs?select=business_name,business_info,social_links,theme_color&public_id=eq.'+PID+'&enabled=eq.true&limit=1'),get('public_catalog_products?select=product_id,name,category,sell_price,stock,image_data,description,specifications&business_id=eq.'+BID+'&stock=gt.0&order=name.asc')]);if(a[0]){const x=a[0];business=x.business_name||business;info=x.business_info||info;$('business').textContent=business;if(/^#[0-9a-f]{6}$/i.test(x.theme_color||''))document.documentElement.style.setProperty('--b',x.theme_color);const f=[];if(info.phone)f.push(['CONTACTO',info.phone]);if(info.address)f.push(['UBICACIÓN',info.address]);if(info.hours)f.push(['HORARIO',info.hours]);$('facts').innerHTML=f.map(x=>`<div class="fact"><small>${x[0]}</small><b>${esc(x[1])}</b></div>`).join('');$('payments').innerHTML=(info.payment_methods||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('');$('socials').innerHTML=(x.social_links||[]).map(y=>`<a class="pill" href="${esc(y.url)}" target="_blank" rel="noopener">${esc(y.label||y.type)}</a>`).join('');const wa=String(info.whatsapp||info.phone||'919757859').replace(/\D/g,'');$('waTop').href='https://wa.me/'+wa}products=p||[];deliveryOptions();cats();render()}catch(e){$('grid').innerHTML='<p>No se pudo cargar el catálogo. Recarga la página.</p>';console.error(e)}}init();</script></body></html>
