rand)!important;border-color:var(--brand-mid)!important}.social:active,.social.selected,.cat.on,.cat:active{background:var(--brand-soft)!important;color:var(--brand)!important;box-shadow:inset 0 0 0 1px var(--brand-mid)!important}.add{border-color:var(--brand)!important;color:var(--brand)!important}.add:active{background:var(--brand-soft)!important;box-shadow:0 0 0 3px var(--brand-soft)!important}.cartbar button,.order{background:var(--brand)!important;border-color:var(--brand)!important;color:#fff!important}.customer{margin:15px 0;padding:15px;background:#fff;border:1px solid #e9e0d5}.customer h3{font:800 12px Arial;margin:0 0 11px;text-transform:uppercase}.customer .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.customer input,.customer textarea{width:100%;border:1px solid #ded5cc;background:#fff;padding:11px;margin:0 0 8px;font:12px Arial;outline:none}.customer input:focus,.customer textarea:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}.customer textarea{min-height:58px;resize:vertical}.delivery select{border-color:var(--brand-mid)!important}.deliveryHint{font:10px Arial;color:#81766d;margin-top:8px}`;function install(){const sheet=d.querySelector('.sheet'),del=d.querySelector('.delivery'),sel=d.querySelector('#delivery'),order=d.querySelector('#order');if(!sheet||!del||!sel||!order)return;if(!d.getElementById('customerData')){const box=d.createElement('div');box.id='customerData';box.className='customer';box.innerHTML='<h3>Datos del cliente</h3><div class="two"><input id="cname" placeholder="Nombre y apellido *"><input id="cphone" inputmode="tel" placeholder="Celular / WhatsApp *"></div><input id="cdistrict" placeholder="Distrito / ciudad *"><textarea id="caddress" placeholder="Dirección de entrega"></textarea><input id="cshalom" placeholder="Sucursal / agencia Shalom"><input id="cref" placeholder="Referencia (opcional)">';sheet.insertBefore(box,del)}const dv=info.delivery||{},cost=x=>Math.max(0,Number(x?.cost||0)),money=n=>'S/ '+Number(n||0).toFixed(2),enabled=x=>x?.enabled!==false;const opts=[];opts.push(['pickup','Recojo en tienda — S/ 0.00']);if(enabled(dv.indrive))opts.push(['indrive','InDrive — '+money(cost(dv.indrive))]);if(enabled(dv.olva))opts.push(['olva','Olva — '+money(cost(dv.olva))]);if(enabled(dv.shalom))opts.push(['shalom','Shalom — '+money(cost(dv.shalom))]);const old=sel.value;sel.innerHTML=opts.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');if(opts.some(x=>x[0]===old))sel.value=old;if(!d.getElementById('deliveryExtra')){const h=d.createElement('div');h.id='deliveryExtra';h.className='deliveryHint';del.appendChild(h)}const sync=()=>{const h=d.getElementById('deliveryExtra'),addr=d.getElementById('caddress'),shal=d.getElementById('cshalom'),v=sel.value;shal.style.display=v==='shalom'?'block':'none';addr.placeholder=v==='pickup'?'No necesitas dirección para recojo en tienda':'Dirección de entrega';h.textContent=v==='pickup'?`Recojo en tienda${info.address?' · '+info.address:''}.`:v==='shalom'?'Indica la dirección/destino y la sucursal de Shalom. El precio mostrado es el configurado por el administrador.':`El precio mostrado es el configurado por el administrador y se suma al pedido.`};sel.onchange=sync;sync();if(!order.dataset.customerBound){order.dataset.customerBound='1';order.addEventListener('click',async e=>{const name=d.getElementById('cname').value.trim(),phone=d.getElementById('cphone').value.trim(),district=d.getElementById('cdistrict').value.trim(),address=d.getElementById('caddress').value.trim(),shalom=d.getElementById('cshalom').value.trim(),ref=d.getElementById('cref').value.trim(),type=sel.value;if(!name||!phone||!district||(type!=='pickup'&&!address)||(type==='shalom'&&!shalom)){e.preventDefault();e.stopImmediatePropagation();alert(type==='shalom'?'Completa nombre, celular, distrito, dirección y sucursal Shalom.':type==='pickup'?'Completa nombre, celular y distrito.':'Completa nombre, celular, distrito y dirección.');return}e.preventDefault();e.stopImmediatePropagation();const items=[...d.querySelectorAll('#items .item')].map(x=>x.innerText.trim()).join('\n'),total=d.querySelector('#total')?.innerText||'',delivery=sel.options[sel.selectedIndex]?.text||sel.value,text=`PEDIDO - Milagros Quispe\n\nCLIENTE\nNombre: ${name}\nCelular: ${phone}\nDistrito/Ciudad: ${district}\nDirección: ${address||'-'}\nSucursal Shalom: ${shalom||'-'}\nReferencia: ${ref||'-'}\n\nPRODUCTOS\n${items}\n\nENTREGA\n${delivery}\n\nTOTAL\n${total}\n\nhttps://vareliastore.tech/catalogo/milagros/`;try{if(navigator.share)await navigator.share({title:'Pedido Milagros Quispe',text});else{await navigator.clipboard.writeText(text);alert('Pedido copiado.')}}catch{}},true)}}install();const mo=new w.MutationObserver(install);mo.observe(d.body,{childList:true,subtree:true});d.querySelectorAll('.social').forEach(a=>a.onclick=()=>{d.querySelectorAll('.social').forEach(x=>x.classList.remove('selected'));a.classList.add('selected')})}frame.addEventListener('load',async()=>{await cfg();patch()})})()</script></body></html>
