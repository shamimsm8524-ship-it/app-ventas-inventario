<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Catálogo Milagros</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8f4ee}iframe{border:0;width:100%;height:100%;display:block;pointer-events:auto}</style></head><body><iframe id="catalog" src="/catalogo-publico-boutique.html?c=bcb528ba-4495-4aaa-886d-676f8833ff19&_v=clickfix-1" title="Catálogo público"></iframe><script>(()=>{const frame=document.getElementById('catalog');frame.addEventListener('load',()=>{const d=frame.contentDocument;if(!d)return;const apply=()=>{const sel=d.getElementById('delivery'),note=d.getElementById('note'),ship=d.getElementById('shipcost');if(!sel)return;const opt=[...sel.options].find(o=>o.value==='shalom');if(opt){opt.textContent='Shalom · Pago en agencia';opt.dataset.cost='0'}if(sel.value==='shalom'){if(note){note.textContent='El envío se abona directamente en Shalom y no se incluye en el total.';note.style.cssText='margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font:italic 11px/1.55 Georgia,serif;letter-spacing:.1px'}if(ship)ship.textContent='Pago en agencia'}else if(note){note.style.cssText=''}};d.addEventListener('change',e=>{if(e.target&&e.target.id==='delivery')setTimeout(apply,0)},true);const obs=new MutationObserver(()=>apply());obs.observe(d.getElementById('delivery')||d.body,{childList:true,subtree:true});apply()})})();</script></body></html>
