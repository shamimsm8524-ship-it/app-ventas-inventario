<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Ingresando a Varelia...</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(145deg,#f8fafc,#eef2ff);color:#111827}.box{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:28px;box-shadow:0 20px 50px #0f172a1f;text-align:center;max-width:360px;margin:20px}.logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;display:grid;place-items:center;font-weight:900;font-size:24px;margin:0 auto 14px}.msg{color:#64748b;font-size:14px;line-height:1.45}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="box"><div class="logo">V</div><h2>Ingresando a Varelia</h2><div id="msg" class="msg">Completando inicio con Google...</div></div>
<script>
(async()=>{
const SUPABASE_URL='https://onvdcaohnftrjunwdvjp.supabase.co';
const SUPABASE_KEY=atob('c2JfcHVibGlzaGFibGVfYnoyejV1Z2xmX0VBTEplenF2NHJDd19TNzNHTU5yaA==');
const RETURN_TO_APP=new URLSearchParams(location.search).get('app')==='1';
const CALLBACK='https://vareliastore.tech/auth-callback.html'+(RETURN_TO_APP?'?app=1':'');
const HOME='https://vareliastore.tech/';
const msg=document.getElementById('msg');

function goHome(session){
  if(RETURN_TO_APP&&session?.access_token&&session?.refresh_token){
    const q=new URLSearchParams({
      access_token:session.access_token,
      refresh_token:session.refresh_token
    }).toString();
    const intent='intent://auth?'+q+'#Intent;scheme=varelia;package=tech.vareliastore.app;end';

    msg.innerHTML='Inicio correcto.<br><b>Volviendo a la app Varelia...</b><br><button id="openVareliaApp" style="margin-top:14px;border:0;border-radius:12px;padding:12px 16px;background:#be185d;color:#fff;font-weight:900">Abrir Varelia</button>';
    const open=()=>{location.href=intent};
    document.getElementById('openVareliaApp')?.addEventListener('click',open);
    setTimeout(open,180);
    setTimeout(()=>{
      // Si Android/Chrome impide el salto automático, dejamos el botón visible.
      msg.querySelector('b').textContent='Toca “Abrir Varelia” para volver a la app.';
    },1300);
    return;
  }
  location.replace(HOME+'?login=ok&t='+Date.now());
}
try{
  // Un solo cliente y un único intercambio: los códigos PKCE son de un solo uso.
  const params=new URLSearchParams(location.search);
  const hash=new URLSearchParams(location.hash.slice(1));
  const authError=params.get('error_description')||params.get('error')||hash.get('error_description')||hash.get('error');
  if(authError)throw new Error(authError);
  if(!window.supabase)throw new Error('No se pudo cargar el servicio de acceso. Comprueba tu conexión.');
  const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,flowType:'pkce'}});
  const code=params.get('code');
  const access=hash.get('access_token'),refresh=hash.get('refresh_token');
  let result;
  if(code){
    result=await client.auth.exchangeCodeForSession(code);
  }else if(access&&refresh){
    // Retorno de Android: el navegador externo recibe el flujo implícito.
    result=await client.auth.setSession({access_token:access,refresh_token:refresh});
  }else{
    result=await client.auth.getSession();
  }
  if(result.error)throw result.error;
  if(!result.data?.session)throw new Error('No se recibió una sesión de Google. Vuelve al inicio e inténtalo otra vez.');
  history.replaceState({},document.title,location.pathname+(RETURN_TO_APP?'?app=1':''));
  goHome(result.data.session);
}catch(e){
  console.error('Varelia OAuth callback',e);
  msg.textContent='No se pudo completar el inicio con Google: '+(e.message||'Error de conexión');
  const back=document.createElement('a');back.href=HOME;back.textContent='Volver a iniciar sesión';back.style.cssText='display:block;margin-top:16px';msg.appendChild(back);
}
})();
</script>
</body>
</html>
