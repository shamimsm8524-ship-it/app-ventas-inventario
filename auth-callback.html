<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingresando a Varelia...</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(145deg,#f8fafc,#eef2ff);color:#111827}.box{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:28px;box-shadow:0 20px 50px #0f172a1f;text-align:center;max-width:360px;margin:20px}.logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;display:grid;place-items:center;font-weight:900;font-size:24px;margin:0 auto 14px}.msg{color:#64748b;font-size:14px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="box"><div class="logo">V</div><h2>Ingresando a Varelia</h2><div id="msg" class="msg">Completando inicio con Google...</div></div>
<script>
(async()=>{
const SUPABASE_URL='https://onvdcaohnftrjunwdvjp.supabase.co';
const SUPABASE_KEY=atob('c2JfcHVibGlzaGFibGVfYnoyejV1Z2xmX0VBTEplenF2NHJDd19TNzNHTU5yaA==');
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,flowType:'pkce'}});
const msg=document.getElementById('msg');
try{
 const code=new URLSearchParams(location.search).get('code');
 if(code){
   const {error}=await sb.auth.exchangeCodeForSession(code);
   if(error)throw error;
 }
 const {data,error}=await sb.auth.getSession();
 if(error)throw error;
 if(!data.session)throw new Error('No se creó la sesión.');
 location.replace('https://vareliastore.tech/?login=ok&t='+Date.now());
}catch(e){
 msg.textContent='No se pudo completar el inicio: '+(e.message||e);
}
})();
</script>
</body>
</html>
