name: Fix completed sale reentry V38b
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-completed-sale-reentry-v38b.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated patch
        run: python3 scripts/fix_completed_sale_reentry_v38b.py
      - name: Validate JavaScript
        run: node --check pos-sales.js
      - name: Commit isolated app change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pos-sales.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Reset completed sale when entering sales again'
          git push
