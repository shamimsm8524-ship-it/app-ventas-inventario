name: Corregir estilo Productos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corregir-estilo-productos.yml'
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir CSS insertado
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('}}<style>.product .stock,.product [data-stock]{display:none!important}', '}}.product .stock,.product [data-stock]{display:none!important}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Corregir estilos de Productos"
          git push
