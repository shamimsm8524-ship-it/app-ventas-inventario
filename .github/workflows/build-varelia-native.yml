name: Build Varelia Native APK
# build-trigger: 1.0.33-installable
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-varelia-native.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare icon
        run: |
          mkdir -p android-native/app/src/main/res/drawable
          cp favicon-512.png android-native/app/src/main/res/drawable/varelia_icon.png
      - name: Build installable APK 1.0.33
        working-directory: android-native
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK exists
        run: |
          test -f android-native/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-native/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Varelia-1.0.33-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
