name: Build Varelia Native APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-varelia-native.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare icon
        run: |
          mkdir -p android-native/app/src/main/res/drawable
          cp favicon-512.png android-native/app/src/main/res/drawable/varelia_icon.png
      - name: Build unsigned release APK
        working-directory: android-native
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: varelia-native-unsigned
          path: android-native/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
