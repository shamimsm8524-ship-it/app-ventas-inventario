name: Build Varelia Native APK
# build-trigger: 1.0.16
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-varelia-native.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare icon
        run: |
          mkdir -p android-native/app/src/main/res/drawable
          cp favicon-512.png android-native/app/src/main/res/drawable/varelia_icon.png
      - name: Build unsigned release APK
        working-directory: android-native
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: varelia-native-unsigned
          path: android-native/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Collect official Android signing tools
        run: |
          BT="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          mkdir -p /tmp/varelia-apk-tools
          cp "$BT/lib/apksigner.jar" /tmp/varelia-apk-tools/apksigner.jar
          cp "$BT/zipalign" /tmp/varelia-apk-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-tools
          path: /tmp/varelia-apk-tools
          if-no-files-found: error
