name: Force scanner load
on:
  push:
    paths:
      - '.github/workflows/force-scanner-load.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('barcode-tools.js?v=20260819-2','barcode-tools.js?v=20260819-5')
          scanner='<script src="scanner-fix.js?v=20260902-2"></script>'
          s=re.sub(r'<script src="scanner-fix\.js(?:\?[^\"]*)?\"></script>',scanner,s)
          if scanner not in s:
              s=s.replace('</body>',scanner+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load supermarket POS scanner"
          git push