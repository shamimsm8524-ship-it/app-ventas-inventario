name: Force scanner load
on:
  push:
    paths:
      - '.github/workflows/force-scanner-load.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve scanner torch support
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          block = base64.b64decode("").decode()

          p=Path('scanner-fix.js')
          s=p.read_text()
          start=s.index('    const sleep=ms=>new Promise(r=>setTimeout(r,ms));')
          end=s.index('    function esc(v)', start)
          p.write_text(s[:start]+block+s[end:])

          i=Path('index.html')
          x=i.read_text()
          x=re.sub(r'scanner-fix\.js\?v=[^"]+','scanner-fix.js?v=20261003-torch-native-v46',x)
          i.write_text(x)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner-fix.js index.html
          git diff --cached --quiet || git commit -m "Improve Android scanner flashlight support"
          git push
