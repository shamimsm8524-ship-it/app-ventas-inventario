name: Forzar acceso Varelia
on:
  push:
    paths:
      - '.github/workflows/forzar-varelia-auth.yml'
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar version del script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'product-view\.js\?v=[^"\']+', 'product-view.js?v=20260819-7', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Forzar carga del nuevo acceso Varelia"
          git push