name: Forzar acceso Varelia
on:
  push:
    paths:
      - '.github/workflows/forzar-varelia-auth.yml'
      - 'supabase-auth.js'
      - 'logout-ui.js'
      - 'bluetooth-printer.js'
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar versiones de acceso y sesión
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('product-view.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'supabase-auth\.js\?v=[^"\']+', 'supabase-auth.js?v=20260819-2', s)
          s=re.sub(r'bluetooth-printer\.js\?v=[^"\']+', 'bluetooth-printer.js?v=20260819-3', s)
          p.write_text(s,encoding='utf-8')

          i=Path('index.html')
          h=i.read_text(encoding='utf-8')
          h=re.sub(r'product-view\.js\?v=[^"\']+', 'product-view.js?v=20260819-7', h)
          i.write_text(h,encoding='utf-8')
          PY
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-view.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Forzar carga de cerrar sesión en Varelia"
          git push