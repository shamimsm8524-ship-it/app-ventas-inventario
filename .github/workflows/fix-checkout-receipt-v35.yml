name: Fix checkout receipt V35

on:
  push:
    paths:
      - '.github/workflows/fix-checkout-receipt-v35.yml'
      - 'scripts/fix_checkout_receipt_v35.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated checkout fix
        run: python scripts/fix_checkout_receipt_v35.py
      - name: Commit checkout fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pos-sales.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix checkout completion and receipt opening"
          git push
