name: Aplicar rueda cromatica
on:
  push:
    paths:
      - 'wheel-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convertir selector a rueda cromatica
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_css=".colorPickerBox{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}.colorBigPreview{height:76px;border-radius:15px;background:var(--p);border:1px solid var(--line);box-shadow:inset 0 0 0 1px #ffffff33;margin-bottom:13px}.colorControl{display:grid;grid-template-columns:86px 1fr 44px;gap:9px;align-items:center;margin-top:10px}.colorControl span{font-size:12px;font-weight:800}.colorControl output{text-align:right;font-size:12px;font-weight:800;color:var(--muted)}.colorControl input[type=range]{padding:0;border:0;box-shadow:none;height:32px;background:transparent}.hueRange{accent-color:var(--p)}.pickerActions{display:flex;gap:8px;margin-top:14px}.pickerActions>*{flex:1}"
          new_css=".colorPickerBox{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--bg)}.wheelWrap{display:grid;place-items:center;margin:8px 0 14px}.colorWheel{width:min(270px,76vw);aspect-ratio:1;border-radius:50%;position:relative;touch-action:none;cursor:crosshair;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);box-shadow:0 12px 30px rgba(15,23,42,.16),inset 0 0 0 1px #ffffff66}.colorWheel:after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at center,#fff 0%,rgba(255,255,255,.9) 8%,rgba(255,255,255,0) 70%);pointer-events:none}.wheelCursor{position:absolute;width:24px;height:24px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #11182788,0 3px 10px #0005;transform:translate(-50%,-50%);z-index:2;pointer-events:none}.pickerPreviewRow{display:flex;align-items:center;gap:10px;margin:12px 0}.colorBigPreview{height:58px;flex:1;border-radius:15px;background:var(--p);border:1px solid var(--line);box-shadow:inset 0 0 0 1px #ffffff33}.hexPreview{width:58px;height:58px;border-radius:15px;border:1px solid var(--line);background:var(--p);flex:0 0 58px}.brightnessRow{display:grid;grid-template-columns:70px 1fr 44px;gap:9px;align-items:center;margin-top:10px}.brightnessRow span,.brightnessRow output{font-size:12px;font-weight:800}.brightnessRow output{text-align:right;color:var(--muted)}.brightnessRow input[type=range]{padding:0;border:0;box-shadow:none;height:34px;background:transparent}.pickerActions{display:flex;gap:8px;margin-top:14px}.pickerActions>*{flex:1}"
          if old_css not in s: raise SystemExit('CSS marker missing')
          s=s.replace(old_css,new_css,1)
          old_html='''<div class="optionCard"><strong>🎯 Color personalizado</strong><p class="notice">Ajusta la tonalidad visualmente y mira el resultado antes de aplicarlo.</p><div class="colorPickerBox"><div class="colorBigPreview" id="colorBigPreview"></div><div class="colorControl"><span>Tono</span><input id="hueSlider" type="range" min="0" max="360" value="330"><output id="hueValue">330°</output></div><div class="colorControl"><span>Saturación</span><input id="satSlider" type="range" min="0" max="100" value="78"><output id="satValue">78%</output></div><div class="colorControl"><span>Brillo</span><input id="lightSlider" type="range" min="20" max="80" value="42"><output id="lightValue">42%</output></div><div class="hexRow"><span class="hexPreview" id="hexPreview"></span><input id="customColor" type="text" maxlength="7" placeholder="#C2185B"></div><div class="pickerActions"><button class="btn secondary" id="resetPicker" type="button">Restablecer</button><button class="btn primary" id="applyCustomColor" type="button">Aplicar color</button></div></div></div>'''
          new_html='''<div class="optionCard"><strong>🎯 Color personalizado</strong><p class="notice">Toca o desliza el dedo por la rueda para elegir exactamente la tonalidad.</p><div class="colorPickerBox"><div class="wheelWrap"><div class="colorWheel" id="colorWheel"><span class="wheelCursor" id="wheelCursor"></span></div></div><div class="pickerPreviewRow"><span class="hexPreview" id="hexPreview"></span><div class="colorBigPreview" id="colorBigPreview"></div></div><div class="brightnessRow"><span>Brillo</span><input id="lightSlider" type="range" min="20" max="80" value="45"><output id="lightValue">45%</output></div><input id="customColor" type="text" maxlength="7" placeholder="#C2185B" style="margin-top:10px"><div class="pickerActions"><button class="btn secondary" id="resetPicker" type="button">Restablecer</button><button class="btn primary" id="applyCustomColor" type="button">Aplicar color</button></div></div></div>'''
          if old_html not in s: raise SystemExit('HTML marker missing')
          s=s.replace(old_html,new_html,1)
          start=s.index("themeGrid.onclick=e=>")
          end=s.index("document.querySelectorAll('[data-close]')",start)
          new_js=r'''themeGrid.onclick=e=>{let b=e.target.closest('[data-color]');if(b){setThemeColor(b.dataset.color);syncWheelFromHex(b.dataset.color)}};lightModeBtn.onclick=()=>{theme.dark=false;localStorage.setItem(K.theme,JSON.stringify(theme));applyTheme()};darkModeBtn.onclick=()=>{theme.dark=true;localStorage.setItem(K.theme,JSON.stringify(theme));applyTheme()};let wheelH=330,wheelS=78;function hslToHex(h,s,l){s/=100;l/=100;let k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(255*x).toString(16).padStart(2,'0')).join('')}function hexToHsl(hex){hex=hex.replace('#','');let r=parseInt(hex.slice(0,2),16)/255,g=parseInt(hex.slice(2,4),16)/255,b=parseInt(hex.slice(4,6),16)/255,max=Math.max(r,g,b),min=Math.min(r,g,b),h=0,ss=0,l=(max+min)/2;if(max!==min){let d=max-min;ss=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4}h*=60}return[Math.round(h),Math.round(ss*100),Math.round(l*100)]}function refreshWheel(){let l=+lightSlider.value,c=hslToHex(wheelH,wheelS,l);customColor.value=c.toUpperCase();hexPreview.style.background=c;colorBigPreview.style.background=c;lightValue.textContent=l+'%';let rect=colorWheel.getBoundingClientRect(),r=rect.width/2,rad=(wheelH-90)*Math.PI/180,dist=(wheelS/100)*r*.82;wheelCursor.style.left=(r+Math.cos(rad)*dist)+'px';wheelCursor.style.top=(r+Math.sin(rad)*dist)+'px'}function pickWheel(ev){let rect=colorWheel.getBoundingClientRect(),x=ev.clientX-rect.left-rect.width/2,y=ev.clientY-rect.top-rect.height/2,r=rect.width/2,dist=Math.min(Math.hypot(x,y),r*.88);wheelS=Math.round(Math.min(100,dist/(r*.82)*100));wheelH=(Math.atan2(y,x)*180/Math.PI+90+360)%360;refreshWheel()}colorWheel.addEventListener('pointerdown',e=>{colorWheel.setPointerCapture(e.pointerId);pickWheel(e)});colorWheel.addEventListener('pointermove',e=>{if(colorWheel.hasPointerCapture(e.pointerId))pickWheel(e)});lightSlider.oninput=refreshWheel;function syncWheelFromHex(c){if(!/^#[0-9a-f]{6}$/i.test(c))return;let[h,ss,l]=hexToHsl(c);wheelH=h;wheelS=ss;lightSlider.value=Math.max(20,Math.min(80,l));refreshWheel()}customColor.oninput=()=>{let c=customColor.value.trim();if(/^#[0-9a-f]{6}$/i.test(c))syncWheelFromHex(c)};applyCustomColor.onclick=()=>{let c=customColor.value.trim();if(!c.startsWith('#'))c='#'+c;if(!setThemeColor(c))alert('Elige un color válido.')};resetPicker.onclick=()=>syncWheelFromHex(theme.color||'#be185d');syncWheelFromHex(theme.color||'#be185d');'''
          s=s[:start]+new_js+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Usar rueda cromatica circular" || exit 0
          git push
