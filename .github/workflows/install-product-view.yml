name: Instalar vistas de productos
on:
  push:
    paths:
      - '.github/workflows/install-product-view.yml'
      - 'product-view.css'
      - 'product-view.js'
      - 'public-catalog.js'
      - 'catalog-view.js'
      - 'catalogo.html'
      - 'merchandise-reminders.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar recursos y corregir navegación inicial
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="product-view.css?v=20260819-3">'
          js='<script src="product-view.js?v=20260819-15"></script>'
          catalog='<script src="public-catalog.js?v=20260819-2"></script>'
          reminders='<script src="merchandise-reminders.js?v=20260819-1"></script>'
          s=re.sub(r'<link rel="stylesheet" href="product-view\.css(?:\?[^\"]*)?">',css,s)
          s=re.sub(r'<script src="product-view\.js(?:\?[^\"]*)?\"></script>',js,s)
          s=re.sub(r'<script src="public-catalog\.js(?:\?[^\"]*)?\"></script>',catalog,s)
          s=re.sub(r'<script src="merchandise-reminders\.js(?:\?[^\"]*)?\"></script>',reminders,s)
          if css not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          if js not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          if catalog not in s:
              if js in s:
                  s=s.replace(js,js+'\n'+catalog,1)
              else:
                  s=s.replace('</body>',catalog+'\n</body>',1)
          if reminders not in s:
              if catalog in s:
                  s=s.replace(catalog,catalog+'\n'+reminders,1)
              else:
                  s=s.replace('</body>',reminders+'\n</body>',1)

          old="render();switchView('products');"
          new="""render();(()=>{const map={productos:'products',inventario:'inventory',categorias:'categories',proveedores:'suppliers',mercaderia:'purchases',ventas:'sales',caja:'cash',apariencia:'appearance'};const valid=['products','inventory','categories','suppliers','purchases','sales','cash','appearance'];let v=map[(location.hash||'').replace(/^#/,'')];if(!v){try{v=localStorage.getItem('miNegocio_lastView_v3')||localStorage.getItem('miNegocio_lastView_v2')||sessionStorage.getItem('miNegocio_lastView_v3')}catch{}}if(!valid.includes(v))v='products';switchView(v)})();"""
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          cp=Path('catalogo.html')
          cs=cp.read_text(encoding='utf-8')
          catalog_view='<script src="catalog-view.js?v=20260819-1"></script>'
          cs=re.sub(r'<script src="catalog-view\.js(?:\?[^\"]*)?\"></script>',catalog_view,cs)
          if catalog_view not in cs:
              cs=cs.replace('</body>',catalog_view+'\n</body>',1)
          cp.write_text(cs,encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html catalogo.html
          git commit -m "Actualizar acceso de Varelia"
          git push