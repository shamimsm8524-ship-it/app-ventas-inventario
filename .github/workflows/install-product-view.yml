name: Instalar vistas de productos
on:
  push:
    paths:
      - '.github/workflows/install-product-view.yml'
      - 'product-view.css'
      - 'product-view.js'
      - 'public-catalog.js'
      - 'catalog-view.js'
      - 'catalogo.html'
      - 'merchandise-reminders.js'
      - 'admin-guard.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar recursos y corregir navegación inicial
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="product-view.css?v=20260819-3">'
          js='<script src="product-view.js?v=20260902-24"></script>'
          catalog='<script src="public-catalog.js?v=20260819-2"></script>'
          reminders='<script src="merchandise-reminders.js?v=20260819-1"></script>'
          admin='<script src="admin-guard.js?v=20260902-1"></script>'
          s=re.sub(r'<link rel="stylesheet" href="product-view\.css(?:\?[^\"]*)?">',css,s)
          s=re.sub(r'<script src="product-view\.js(?:\?[^\"]*)?\"></script>',js,s)
          s=re.sub(r'<script src="public-catalog\.js(?:\?[^\"]*)?\"></script>',catalog,s)
          s=re.sub(r'<script src="merchandise-reminders\.js(?:\?[^\"]*)?\"></script>',reminders,s)
          s=re.sub(r'<script src="admin-guard\.js(?:\?[^\"]*)?\"></script>',admin,s)
          if css not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          if js not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          if catalog not in s:
              if js in s:
                  s=s.replace(js,js+'\n'+catalog,1)
              else:
                  s=s.replace('</body>',catalog+'\n</body>',1)
          if reminders not in s:
              if catalog in s:
                  s=s.replace(catalog,catalog+'\n'+reminders,1)
              else:
                  s=s.replace('</body>',reminders+'\n</body>',1)
          if admin not in s:
              if reminders in s:
                  s=s.replace(reminders,reminders+'\n'+admin,1)
              elif catalog in s:
                  s=s.replace(catalog,catalog+'\n'+admin,1)
              else:
                  s=s.replace('</body>',admin+'\n</body>',1)

          guard='''<script id="vareliaReaderTruthGuardV1">
          (()=>{
            try{localStorage.removeItem('varelia_reader_ready')}catch{}
            window.__vareliaReaderArmed=false;
            window.__vareliaReaderConfirmed=false;
            window.__vareliaReaderAttemptTimer=null;
            const ui=(mode='off',label='Lector no conectado',button='🔗 Conectar lector')=>{
              const b=document.getElementById('vposReaderBtn'),t=document.getElementById('vposReaderText'),d=document.getElementById('vposReaderDot');
              if(!b||!t||!d)return false;
              b.textContent=button;t.textContent=label;
              d.classList.toggle('on',mode==='on');d.classList.toggle('warn',mode==='warn');
              return true;
            };
            const resetReader=()=>{
              clearTimeout(window.__vareliaReaderAttemptTimer);
              window.__vareliaReaderArmed=false;
              window.__vareliaReaderConfirmed=false;
              try{localStorage.removeItem('varelia_reader_ready')}catch{}
              ui('off','Lector no conectado','🔗 Conectar lector');
            };
            const enforce=()=>{
              const dev=window.__vareliaBarcodeReaderDevice;
              if(window.__vareliaReaderArmed&&dev?.opened){
                clearTimeout(window.__vareliaReaderAttemptTimer);
                window.__vareliaReaderConfirmed=true;
              }
              if(window.__vareliaReaderConfirmed){ui('on',dev?.opened?'Conectado: '+(dev.productName||'lector USB'):'Escaneo recibido · lector activo','✓ Lector conectado');return}
              if(window.__vareliaReaderArmed){ui('warn','Buscando lector USB/Bluetooth...','⌛ Esperando lector');return}
              ui('off','Lector no conectado','🔗 Conectar lector');
            };
            document.addEventListener('click',e=>{
              if(!e.target.closest('#vposReaderBtn'))return;
              clearTimeout(window.__vareliaReaderAttemptTimer);
              window.__vareliaReaderArmed=true;window.__vareliaReaderConfirmed=false;
              setTimeout(enforce,0);setTimeout(enforce,250);setTimeout(enforce,1000);
              window.__vareliaReaderAttemptTimer=setTimeout(()=>{
                const dev=window.__vareliaBarcodeReaderDevice;
                if(!window.__vareliaReaderConfirmed&&!dev?.opened)resetReader();
              },8000);
            },true);
            document.addEventListener('keydown',e=>{
              const input=e.target.closest?.('#vposInput');
              if(!input||e.key!=='Enter'||!input.value.trim()||!window.__vareliaReaderArmed)return;
              clearTimeout(window.__vareliaReaderAttemptTimer);
              window.__vareliaReaderConfirmed=true;setTimeout(enforce,80);
            },true);
            setInterval(enforce,250);
            addEventListener('pageshow',resetReader);
          })();
          </script>'''
          s=re.sub(r'<script id="vareliaReaderTruthGuardV1">[\s\S]*?</script>',guard,s)
          if 'id="vareliaReaderTruthGuardV1"' not in s:
              s=s.replace('</body>',guard+'\n</body>',1)

          old="render();switchView('products');"
          new="""render();(()=>{const map={productos:'products',inventario:'inventory',categorias:'categories',proveedores:'suppliers',mercaderia:'purchases',ventas:'sales',caja:'cash',apariencia:'appearance'};const valid=['products','inventory','categories','suppliers','purchases','sales','cash','appearance'];let v=map[(location.hash||'').replace(/^#/,'')];if(!v){try{v=localStorage.getItem('miNegocio_lastView_v3')||localStorage.getItem('miNegocio_lastView_v2')||sessionStorage.getItem('miNegocio_lastView_v3')}catch{}}if(!valid.includes(v))v='products';switchView(v)})();"""
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          cp=Path('catalogo.html')
          cs=cp.read_text(encoding='utf-8')
          catalog_view='<script src="catalog-view.js?v=20260819-1"></script>'
          cs=re.sub(r'<script src="catalog-view\.js(?:\?[^\"]*)?\"></script>',catalog_view,cs)
          if catalog_view not in cs:
              cs=cs.replace('</body>',catalog_view+'\n</body>',1)
          cp.write_text(cs,encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html catalogo.html
          git commit -m "Actualizar acceso de Varelia"
          git pull --rebase origin main
          git push