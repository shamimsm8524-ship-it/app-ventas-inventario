name: Corregir CSS final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corregir-css-final.yml'
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<style>.product .stock', '.product .stock')
          p.write_text(s, encoding='utf-8')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Corregir CSS final de Productos"
          git push
