name: Fix Ganancias sale type v29

on:
  push:
    paths:
      - '.github/workflows/fix-checkout-profit-v26.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Ganancias sale type patch
        run: python3 scripts/fix_gain_sale_logic_v29.py
      - name: Validate JavaScript
        run: |
          node --check central-stock-sync.js
          node --check reports-profit.js
      - name: Commit fix
        run: |
          git config user.name "Varelia Stability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add central-stock-sync.js reports-profit.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Calculate profit by each sale type correctly"
          git push
