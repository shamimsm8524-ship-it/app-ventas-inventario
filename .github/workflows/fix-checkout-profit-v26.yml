name: Fix Ganancias stability v28

on:
  push:
    paths:
      - '.github/workflows/fix-checkout-profit-v26.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Ganancias directly
        shell: python
        run: |
          from pathlib import Path

          p=Path('reports-profit.js')
          s=p.read_text(encoding='utf-8')

          old_valid="""  function gainValidSales(){
    return arr('sales').filter(s=>s&&!s.cancelled&&!s.canceled&&!s.voided&&
      !['cancelada','anulada','cancelled','voided'].includes(String(s.status||s.state||'').toLowerCase()));
  }
"""
          new_valid="""  function gainValidSales(){
    return arr('sales').filter(s=>s&&!s.cancelled&&!s.canceled&&!s.voided&&
      !['cancelada','anulada','cancelled','voided'].includes(String(s.status||s.state||'').toLowerCase()));
  }
  // Ganancias debe conservar cualquier venta válida que ya vio en esta sesión.
  // La carga asíncrona del perfil o de Supabase nunca debe convertir una venta
  // visible en S/ 0.00 mientras la misma sesión sigue abierta.
  let gainStickyLocalSales=[];
  const gainSaleIdentity=s=>{
    const ids=[s?.cloudSaleId,s?.cloud_sale_id,s?.saleId,s?.sale_id,s?.id,
      s?.receiptNumber,s?.receipt_number,s?.receiptNo,s?.ticketNumber,s?.ticket_number]
      .map(v=>String(v??'').trim()).filter(Boolean);
    if(ids.length)return 'id:'+ids[0];
    return 'fallback:'+String(s?.date??s?.created_at??s?.createdAt??'')+'|'+String(Number(s?.total)||0);
  };
  const gainIsValidSale=s=>s&&!s.cancelled&&!s.canceled&&!s.voided&&
    !['cancelada','anulada','cancelled','voided'].includes(String(s.status||s.state||'').toLowerCase());
  function gainRememberLocalSales(list){
    for(const sale of Array.isArray(list)?list:[]){
      if(!gainIsValidSale(sale))continue;
      const key=gainSaleIdentity(sale);
      const at=gainStickyLocalSales.findIndex(x=>gainSaleIdentity(x)===key);
      if(at>=0)gainStickyLocalSales[at]={...gainStickyLocalSales[at],...sale};
      else gainStickyLocalSales.push({...sale});
    }
    return gainStickyLocalSales;
  }
  function gainStoredSales(){
    try{
      const key=(typeof K!=='undefined'&&K?.sales)?K.sales:'';
      if(!key)return [];
      const parsed=JSON.parse(localStorage.getItem(key)||'[]');
      return Array.isArray(parsed)?parsed.filter(gainIsValidSale):[];
    }catch{return []}
  }
  function gainLocalSales(){
    gainRememberLocalSales(gainStoredSales());
    gainRememberLocalSales(gainValidSales());
    return [...gainStickyLocalSales];
  }
  gainRememberLocalSales(gainStoredSales());
  gainRememberLocalSales(gainValidSales());
"""
          if 'gainStickyLocalSales' not in s:
            if old_valid not in s: raise SystemExit('gainValidSales anchor not found')
            s=s.replace(old_valid,new_valid,1)

          old_listener="""  window.addEventListener('varelia:sale-recorded',event=>{
    const detail=event?.detail||{};
    if(detail.sale||detail.source==='cloud-confirmed')gainInvalidateAndRefresh();
  });
"""
          new_listener="""  window.addEventListener('varelia:sale-recorded',event=>{
    const detail=event?.detail||{};
    if(detail.sale)gainRememberLocalSales([detail.sale]);
    if(detail.sale||detail.source==='cloud-confirmed')gainInvalidateAndRefresh();
  });
  window.addEventListener('varelia:checkout-confirmed',event=>{
    if(event?.detail?.sale)gainRememberLocalSales([event.detail.sale]);
  });
"""
          if old_listener in s:
            s=s.replace(old_listener,new_listener,1)

          old_local="const localSales=window.vareliaCurrentUserProfile?.role==='owner'?gainValidSales():[];"
          if old_local in s:
            s=s.replace(old_local,"const localSales=gainLocalSales();",1)
          elif "const localSales=gainLocalSales();" not in s:
            raise SystemExit('local sales anchor not found')

          old_marker="if(marker!==panel.dataset.gainHistoryMarker){"
          if old_marker in s:
            s=s.replace(old_marker,"if(selected.known&&marker!==panel.dataset.gainHistoryMarker){",1)

          old_active="""      let activePeriod=selectedHistory.mode==='day'?'day':
        selectedHistory.mode==='today'?'today':
        selectedHistory.mode==='month'?'month':
        selectedHistory.mode==='all'?'all':'today';
"""
          new_active="""      let activePeriod=selectedHistory.known&&selectedHistory.mode==='day'?'day':
        selectedHistory.mode==='today'?'today':
        selectedHistory.mode==='month'?'month':
        selectedHistory.known&&selectedHistory.mode==='all'?'all':'today';
"""
          if old_active in s:
            s=s.replace(old_active,new_active,1)

          old_use="""      panel.__gainUseHistoryDate=(selected,date)=>{
        if(selected.mode==='day'){
"""
          new_use="""      panel.__gainUseHistoryDate=(selected,date)=>{
        if(!selected?.known)return;
        if(selected.mode==='day'){
"""
          if old_use in s:
            s=s.replace(old_use,new_use,1)

          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          old_cache='reports-profit.js?v=20261021-profit-live-v26'
          new_cache='reports-profit.js?v=20261021-profit-sticky-v28'
          if old_cache in h:
            h=h.replace(old_cache,new_cache,1)
          elif new_cache not in h:
            raise SystemExit('reports-profit cache anchor not found')
          old_build="const BUILD='20261021-PROFIT-PRESENTATIONS-V23'"
          new_build="const BUILD='20261021-GAIN-STICKY-V28'"
          if old_build in h:
            h=h.replace(old_build,new_build,1)
          idx.write_text(h,encoding='utf-8')

      - name: Validate JavaScript
        run: node --check reports-profit.js

      - name: Commit direct fix
        run: |
          git config user.name "Varelia Stability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports-profit.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Keep Ganancias sale stable during cloud refresh"
          git push
