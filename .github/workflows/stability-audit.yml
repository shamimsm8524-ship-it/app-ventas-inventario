name: Varelia stability audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check active runtime integrity
        run: node scripts/stability-audit.mjs

      - name: Stabilize Ganancias period filter
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('reports-profit.js')
          s=p.read_text(encoding='utf-8')
          changed=False

          old1="""      if(panel.querySelector('[data-gain-period-buttons]')){
        const selected=reportHistoryFilter();
        const day=selected.mode==='day'?(gainHistoryDate()||selected.date||''):'';
        const marker=selected.mode+':'+day;
        if(marker!==panel.dataset.gainHistoryMarker){
          panel.dataset.gainHistoryMarker=marker;
          if(typeof panel.__gainUseHistoryDate==='function')panel.__gainUseHistoryDate(selected,day);
        }
        continue;
      }
"""
          new1="""      if(panel.querySelector('[data-gain-period-buttons]')){
        const selected=reportHistoryFilter();
        // Mientras Historial todavía está montando sus botones, reportHistoryFilter()
        // devuelve Todo/known:false. Ese estado transitorio no es una elección real.
        if(selected.known){
          const day=selected.mode==='day'?(gainHistoryDate()||selected.date||''):'';
          const marker=selected.mode+':'+day;
          if(marker!==panel.dataset.gainHistoryMarker){
            panel.dataset.gainHistoryMarker=marker;
            if(typeof panel.__gainUseHistoryDate==='function')panel.__gainUseHistoryDate(selected,day);
          }
        }
        continue;
      }
"""
          if old1 in s:
            s=s.replace(old1,new1,1); changed=True

          old2="""      let activePeriod=selectedHistory.mode==='day'?'day':
        selectedHistory.mode==='today'?'today':
        selectedHistory.mode==='month'?'month':
        selectedHistory.mode==='all'?'all':'today';
"""
          new2="""      let activePeriod=selectedHistory.mode==='day'&&selectedHistory.known?'day':
        selectedHistory.mode==='today'?'today':
        selectedHistory.mode==='month'?'month':
        selectedHistory.mode==='all'&&selectedHistory.known?'all':'today';
"""
          if old2 in s:
            s=s.replace(old2,new2,1); changed=True

          old3="""      panel.__gainUseHistoryDate=(selected,date)=>{
        if(selected.mode==='day'){
"""
          new3="""      panel.__gainUseHistoryDate=(selected,date)=>{
        // No convertir el estado transitorio desconocido en Todo.
        if(!selected?.known)return;
        if(selected.mode==='day'){
"""
          if old3 in s:
            s=s.replace(old3,new3,1); changed=True

          if changed:
            p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          if 'reports-profit.js?v=20261021-profit-live-v26' in h:
            h=h.replace('reports-profit.js?v=20261021-profit-live-v26','reports-profit.js?v=20261021-filter-stable-v27',1)
            idx.write_text(h,encoding='utf-8')
            changed=True

          Path('.gain_filter_patch_changed').write_text('1' if changed else '0')
          PY
          node --check reports-profit.js
          if [ "$(cat .gain_filter_patch_changed)" = "1" ]; then
            rm .gain_filter_patch_changed
            git config user.name "Varelia Stability Bot"
            git config user.email "actions@users.noreply.github.com"
            git add reports-profit.js index.html
            git commit -m "Fix Ganancias transient filter flash"
            git push
          else
            rm .gain_filter_patch_changed
          fi