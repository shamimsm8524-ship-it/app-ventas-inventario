name: Varelia stability audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and regression checks
        run: |
          for file in *.js; do node --check "$file"; done
          node scripts/stability-audit.mjs
          node --test tests/purchase-cost.test.cjs
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/varelia-browser playwright@1.56.1
          /tmp/varelia-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Mobile login and product form browser checks
        env:
          PLAYWRIGHT_MODULE: /tmp/varelia-browser/node_modules/playwright
        run: node tests/browser-smoke.cjs
