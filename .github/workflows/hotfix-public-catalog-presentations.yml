name: Public catalog presentations hotfix

on:
  push:
    paths:
      - '.github/workflows/hotfix-public-catalog-presentations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply public catalog presentation patch
        run: python scripts/hotfix_public_catalog_presentations.py
      - name: Commit patch
        run: |
          git config user.name "Varelia Stability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public-catalog.js catalogo/milagros/catalogo-v2.html catalogo/milagros/index.html catalog-orders-admin.js index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add sale presentations to public catalog"
          git push
