name: Public catalog presentations hotfix

on:
  push:
    paths:
      - '.github/workflows/hotfix-public-catalog-presentations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix catalog-v2 laptop brand alignment
        run: python scripts/fix_catalog_v2_laptop_brand.py
      - name: Commit patch
        run: |
          git config user.name "Varelia Stability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalogo/milagros/catalogo-v2.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Align catalog-v2 laptop brand above contact"
          git push
