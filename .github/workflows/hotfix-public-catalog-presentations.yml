name: Public catalog pricing verification

on:
  push:
    paths:
      - 'catalogo/milagros/catalogo-v2.html'
      - 'catalogo/milagros/catalogo-v104.html'
      - 'catalogo/milagros/catalogo-v105.html'
      - 'catalogo/milagros/catalogo-v112.html'
      - 'catalogo/milagros/catalogo-base-v110.html'
      - 'catalogo-enlace.html'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public catalog pricing files
        run: |
          test -f catalogo/milagros/catalogo-v112.html
          grep -q "catalogo-v112.html" catalogo/milagros/catalogo-v104.html
          grep -q "catalogo-v112.html" catalogo/milagros/catalogo-v105.html
          grep -q "catalogo-v112.html" catalogo/milagros/catalogo-v2.html
          grep -q "total/units" catalogo/milagros/catalogo-v112.html
          grep -q "catalogo-v112.html" catalogo-enlace.html
          echo "Public catalog routes and presentation pricing verified"
