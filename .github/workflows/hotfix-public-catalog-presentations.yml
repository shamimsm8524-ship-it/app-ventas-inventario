name: Public catalog presentations hotfix

on:
  push:
    paths:
      - '.github/workflows/hotfix-public-catalog-presentations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply contact card below dark hero v100
        run: python scripts/fix_public_catalog_laptop_layout_v97.py
      - name: Commit patch
        run: |
          git config user.name "Varelia Stability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalogo/milagros/catalogo-v2.html catalogo/milagros/index.html catalogo-enlace.html public-catalog.js index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Place contact card fully below dark hero v100"
          git push
