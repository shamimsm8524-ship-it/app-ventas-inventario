name: One-time presentation profit hotfix

on:
  push:
    paths:
      - '.github/workflows/hotfix-profit-presentations-v23.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply presentation profit repair
        run: python3 scripts/apply-profit-presentation-v23.py

      - name: Validate reports
        run: |
          node --check reports-profit.js
          node scripts/stability-audit.mjs

      - name: Commit fix
        run: |
          git config user.name "Varelia Stability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports-profit.js index.html scripts/stability-audit.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Fix profit math for commercial presentations"
          git push origin main
