name: Fix advanced pricing medicine UI leak

on:
  push:
    paths:
      - '.github/workflows/hotfix-advanced-pricing-ui-leak.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair stale advanced pricing proxies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'{path}: anchor not found for {label}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 1) Advanced pricing must recognize old cloud proxy rows even if the
          #    encoded advancedPricing metadata was temporarily lost. The remote
          #    proxy marker is explicit and belongs only to this feature.
          p=Path('advanced-pricing.js')
          s=p.read_text(encoding='utf-8')
          old="""  // Un producto normal con precios por cantidad puede usar internamente el motor remoto de presentaciones,
  // pero nunca debe comportarse visualmente como medicamento.
  const isMedicine=p=>(!!p?.medicine||/^(pastillas?|medicinas?|medicamentos?)$/i.test(String(p?.category||'').trim()))&&!getConfig(p);
"""
          new="""  // Un producto normal con precios por cantidad puede usar internamente el motor remoto de presentaciones,
  // pero nunca debe comportarse visualmente como medicamento. Algunas filas antiguas
  // conservan el marcador remoto aunque advancedPricing todavía no haya sido reconstruido.
  const isPricingProxyMarker=p=>/^varelia precios por cantidad$/i.test(String(p?.medicinePresentation||p?.medicine_presentation||'').trim());
  const isMedicine=p=>(!!p?.medicine||/^(pastillas?|medicinas?|medicamentos?)$/i.test(String(p?.category||'').trim()))&&!getConfig(p)&&!isPricingProxyMarker(p);
"""
          if old not in s: raise SystemExit('advanced-pricing medicine guard anchor not found')
          s=s.replace(old,new,1)

          old="""  function getConfig(p){
    const c=normalizeConfig(p?.advancedPricing||{});
    if(!(c.dozenEnabled||c.wholesaleEnabled||c.promoEnabled))return null;
    return c;
  }
"""
          new="""  function getConfig(p){
    let c=normalizeConfig(p?.advancedPricing||{});
    if(c.dozenEnabled||c.wholesaleEnabled||c.promoEnabled)return c;
    // Recuperación compatible: antes se guardaban estos precios en columnas de
    // presentaciones para que la RPC central pudiera descontar el stock correcto.
    // Si el metadato JSON no llegó, reconstruimos SOLO desde el marcador explícito.
    if(!isPricingProxyMarker(p))return null;
    const regular=Math.max(0,Number(p?.unitMedicinePrice||p?.sellPrice)||0);
    const wholesale=Math.max(0,Number(p?.blisterPrice)||0);
    const dozen=Math.max(0,Number(p?.boxPrice)||0);
    const hasWholesale=wholesale>0&&regular>0&&Math.abs(wholesale-regular)>0.009;
    c=normalizeConfig({
      proxy:true,
      dozenEnabled:dozen>0,
      dozenPrice:dozen,
      wholesaleEnabled:hasWholesale,
      wholesaleMinQty:12,
      wholesalePrice:hasWholesale?wholesale:0,
      promoEnabled:false
    });
    return (c.dozenEnabled||c.wholesaleEnabled||c.promoEnabled)?c:null;
  }
"""
          if old not in s: raise SystemExit('advanced-pricing getConfig anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 2) Cloud mapper: if the metadata suffix was lost but the explicit proxy
          #    presentation survived, rebuild enough information to classify the
          #    product correctly and keep it out of the medicine UI.
          p=Path('central-stock-sync.js')
          s=p.read_text(encoding='utf-8')
          old="""      const advanced=readAdvancedPricing(p.specifications);
      const pricingProxy=!!advanced?.proxy;
"""
          new="""      let advanced=readAdvancedPricing(p.specifications);
      const legacyPricingMarker=/^varelia precios por cantidad$/i.test(String(p.medicine_presentation||'').trim());
      if(!advanced&&legacyPricingMarker){
        const regular=Math.max(0,Number(p.unit_medicine_price||p.sell_price)||0);
        const wholesale=Math.max(0,Number(p.blister_price)||0);
        const dozen=Math.max(0,Number(p.box_price)||0);
        const hasWholesale=wholesale>0&&regular>0&&Math.abs(wholesale-regular)>0.009;
        advanced=normalizeAdvancedPricing({
          proxy:true,
          dozenEnabled:dozen>0,
          dozenPrice:dozen,
          wholesaleEnabled:hasWholesale,
          wholesaleMinQty:12,
          wholesalePrice:hasWholesale?wholesale:0,
          promoEnabled:false,
          baseSellPrice:regular,
          baseBuyPrice:Math.max(0,Number(p.buy_price)||0)/12,
          baseUnit:String(p.unit||'Unidad')
        });
      }
      const pricingProxy=!!advanced?.proxy||legacyPricingMarker;
"""
          if old not in s: raise SystemExit('central stock pricing proxy anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 3) Main UI guards: the explicit proxy marker must also bypass the old
          #    Caja/Blister/Pastilla selector before the advanced-pricing wrapper runs.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""    const med=(!!p.medicine||/^(pastillas?|medicinas?|medicamentos?)$/i.test(String(p.category||'').trim()))&&!(p.advancedPricing&&(p.advancedPricing.dozenEnabled||p.advancedPricing.wholesaleEnabled||p.advancedPricing.promoEnabled));
"""
          new="""    const pricingProxy=!!(p.advancedPricing&&(p.advancedPricing.dozenEnabled||p.advancedPricing.wholesaleEnabled||p.advancedPricing.promoEnabled))||/^varelia precios por cantidad$/i.test(String(p.medicinePresentation||p.medicine_presentation||'').trim());
    const med=(!!p.medicine||/^(pastillas?|medicinas?|medicamentos?)$/i.test(String(p.category||'').trim()))&&!pricingProxy;
"""
          if old not in s: raise SystemExit('index catalog medicine guard anchor not found')
          s=s.replace(old,new,1)
          old="""  const isMedicine=(!!p.medicine||medicineCategory)&&!(p.advancedPricing&&(p.advancedPricing.dozenEnabled||p.advancedPricing.wholesaleEnabled||p.advancedPricing.promoEnabled));
"""
          new="""  const pricingProxy=!!(p.advancedPricing&&(p.advancedPricing.dozenEnabled||p.advancedPricing.wholesaleEnabled||p.advancedPricing.promoEnabled))||/^varelia precios por cantidad$/i.test(String(p.medicinePresentation||p.medicine_presentation||'').trim());
  const isMedicine=(!!p.medicine||medicineCategory)&&!pricingProxy;
"""
          if old not in s: raise SystemExit('index addToCart medicine guard anchor not found')
          s=s.replace(old,new,1)

          if '20261020-ADVANCED-PRICING-V15' not in s: raise SystemExit('build V15 marker not found')
          s=s.replace('20261020-ADVANCED-PRICING-V15','20261020-ADVANCED-PRICING-V16',1)
          if 'advanced-pricing.js?v=20261020-v15' not in s: raise SystemExit('advanced pricing script v15 marker not found')
          s=s.replace('advanced-pricing.js?v=20261020-v15','advanced-pricing.js?v=20261020-v16',1)
          # Force Android WebView to request the repaired cloud mapper as well.
          s=s.replace('central-stock-sync.js?v=20261015-cashier-name-fix-v1','central-stock-sync.js?v=20261020-advanced-pricing-proxy-v16')
          p.write_text(s,encoding='utf-8')

          # 4) Public catalog: never expose this internal proxy as medicine.
          p=Path('public-catalog.js')
          s=p.read_text(encoding='utf-8')
          old="medicine:!!p.medicine&&!p.advancedPricing,blistersPerBox:"
          new="medicine:!!p.medicine&&!p.advancedPricing&&!/^varelia precios por cantidad$/i.test(String(p.medicinePresentation||p.medicine_presentation||'').trim()),blistersPerBox:"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check advanced-pricing.js
          node --check central-stock-sync.js
          node --check public-catalog.js

      - name: Run stability audit
        run: node scripts/stability-audit.mjs

      - name: Commit repair
        run: |
          git config user.name "Varelia Stability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add advanced-pricing.js central-stock-sync.js index.html public-catalog.js
          git diff --cached --quiet && exit 0
          git commit -m "Repair stale advanced pricing proxy UI"
          git push origin main
