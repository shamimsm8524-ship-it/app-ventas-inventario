name: Fix advanced pricing medicine UI leak

on:
  push:
    paths:
      - '.github/workflows/hotfix-advanced-pricing-ui-leak.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair stale advanced pricing proxies
        run: python3 scripts/repair-stale-advanced-pricing-proxy.py

      - name: Validate JavaScript syntax
        run: |
          node --check advanced-pricing.js
          node --check central-stock-sync.js
          node --check public-catalog.js

      - name: Run stability audit
        run: node scripts/stability-audit.mjs

      - name: Commit repair
        run: |
          git config user.name "Varelia Stability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add advanced-pricing.js central-stock-sync.js index.html public-catalog.js
          git diff --cached --quiet && exit 0
          git commit -m "Repair stale advanced pricing proxy UI"
          git push origin main
