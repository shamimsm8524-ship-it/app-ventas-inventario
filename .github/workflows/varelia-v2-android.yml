name: Build Varelia 2 Android prototype
on:
  push:
    branches: [feature/varelia-2-rebuild-foundation]
    paths:
      - 'varelia-v2/android/**'
      - 'varelia-v2/web/**'
      - '.github/workflows/varelia-v2-android.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 35 and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate web JavaScript syntax
        run: |
          for file in varelia-v2/web/*.js; do node --check "$file"; done
          test -s varelia-v2/web/index.html
          test -s varelia-v2/web/styles.css
      - name: Copy web application assets
        run: |
          mkdir -p varelia-v2/android/app/src/main/assets
          cp varelia-v2/web/*.html varelia-v2/web/*.js varelia-v2/web/*.css varelia-v2/android/app/src/main/assets/
      - name: Build debug APK
        working-directory: varelia-v2/android
        run: gradle --no-daemon assembleDebug
      - name: Rename APK to Varelia.apk
        run: mv varelia-v2/android/app/build/outputs/apk/debug/app-debug.apk varelia-v2/android/app/build/outputs/apk/debug/Varelia.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Varelia-APK-prototipo
          path: varelia-v2/android/app/build/outputs/apk/debug/Varelia.apk
          if-no-files-found: error
