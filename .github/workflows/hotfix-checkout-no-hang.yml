name: Fix checkout stall
on:
  push:
    paths:
      - 'scripts/hotfix_checkout_no_hang.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/hotfix_checkout_no_hang.py
      - run: |
          git config user.name "Varelia Stability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add central-stock-sync.js index.html
          git commit -m "Fix checkout freezing before receipt"
          git push
