name: V19 product form and commercial sales repair

on:
  push:
    paths:
      - 'scripts/apply-product-form-commercial-v19.py'
      - '.github/workflows/hotfix-product-form-commercial-v19.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply V19 repair
        run: python3 scripts/apply-product-form-commercial-v19.py
      - name: Validate JavaScript and stability
        run: |
          node --check central-stock-sync.js
          node --check advanced-pricing.js
          node --check medicine-stock-count-fix.js
          node --check product-form-safety.js
          node scripts/stability-audit.mjs
      - name: Commit V19 repair
        run: |
          git config user.name "Varelia Stability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add central-stock-sync.js advanced-pricing.js medicine-stock-count-fix.js product-form-safety.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix product form medicine leak and commercial presentations"
          git push origin main
