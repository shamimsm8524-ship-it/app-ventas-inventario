name: Hotfix public catalog business info

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-public-catalog-business-info.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch current public catalog implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Publisher: include RUC from Ajustes in business_info.
          pub = Path('public-catalog.js')
          text = pub.read_text(encoding='utf-8')
          ruc_code = "ruc:String(s.ruc||'').trim().slice(0,40),"
          if ruc_code not in text:
              old = "phone:String(s.phone||'').trim().slice(0,40),"
              if old not in text:
                  raise SystemExit('Could not locate phone field in publicBusinessInfo')
              text = text.replace(old, ruc_code + old, 1)
          pub.write_text(text, encoding='utf-8')

          # 2) Active public catalog route used by shared links.
          path = Path('catalogo/milagros/catalogo-v2.html')
          text = path.read_text(encoding='utf-8')

          # Remove stale visual defaults. Runtime data will replace these values.
          text = text.replace('<div class="top"><b>MQ</b><div>', '<div class="top"><b>V</b><div>')
          text = text.replace('<h1 id="business">Milagros Quispe</h1>', '<h1 id="business">Mi negocio</h1>')
          text = text.replace("business='Milagros Quispe'", "business='Mi negocio'")

          # A real configured slogan must never be hidden by a hardcoded exception.
          text = text.replace("if(slogan.toLowerCase()==='calidad y buenos precios')slogan='';", "")

          # Render slogan, logo (or initials), dynamic title, and hide the generic subtitle when a slogan exists.
          old_render = "$('heroSlogan').textContent=slogan;$('heroSlogan').style.display=slogan?'block':'none';$('businessSloganText').textContent=slogan;$('businessSlogan').style.display='none';"
          if "var brandMark=document.querySelector('.top>b')" not in text:
              if old_render not in text:
                  raise SystemExit('Could not locate slogan render block')
              new_render = "$('heroSlogan').textContent=slogan;$('heroSlogan').style.display=slogan?'block':'none';$('businessSloganText').textContent=slogan;$('businessSlogan').style.display='none';var heroSubtitle=Array.from(document.querySelectorAll('.hero>div')).find(function(el){return String(el.textContent||'').trim()==='Catálogo oficial · Stock actualizado'});if(heroSubtitle)heroSubtitle.style.display=slogan?'none':'';var brandMark=document.querySelector('.top>b');if(brandMark){var words=String(business||'').trim().split(/\\s+/).filter(Boolean),initials=(words.length>1?(words[0].charAt(0)+words[1].charAt(0)):String(business||'V').trim().slice(0,2)).toUpperCase(),brandLogo=String(info.logo||info.logo_data||info.logo_url||'').trim(),safeLogo=/^(?:data:image\\/(?:png|jpe?g|webp|gif);base64,|https?:\\/\\/)/i.test(brandLogo);brandMark.textContent=safeLogo?'':initials;if(safeLogo){var logoImg=document.createElement('img');logoImg.src=brandLogo;logoImg.alt='Logo de '+business;logoImg.style.cssText='display:block;max-width:92px;max-height:56px;object-fit:contain;border-radius:12px';brandMark.appendChild(logoImg)}}document.title=business+' | Catálogo';"
              text = text.replace(old_render, new_render, 1)

          # Show RUC together with contact, location and hours.
          old_facts = "var f=[];if(info.phone)f.push(['CONTACTO',info.phone]);if(info.address)f.push(['UBICACIÓN',info.address]);if(info.hours)f.push(['HORARIO',info.hours]);"
          new_facts = "var f=[];if(info.ruc)f.push(['RUC / DOCUMENTO',info.ruc]);if(info.phone)f.push(['CONTACTO',info.phone]);if(info.address)f.push(['UBICACIÓN',info.address]);if(info.hours)f.push(['HORARIO',info.hours]);"
          if old_facts in text:
              text = text.replace(old_facts, new_facts, 1)
          elif new_facts not in text:
              raise SystemExit('Could not locate business facts block')

          # Add configured Google Maps link beside social links.
          old_social = "$('socials').innerHTML=(x.social_links||[]).map(function(y){return'<a class=\"pill\" href=\"'+esc(y.url)+'\" target=\"_blank\">'+esc(y.label||y.type)+'</a>'}).join('');"
          if "mapUrl=String(info.map_url||'').trim()" not in text:
              if old_social not in text:
                  raise SystemExit('Could not locate social links block')
              new_social = "var socialHtml=(x.social_links||[]).map(function(y){return'<a class=\"pill\" href=\"'+esc(y.url)+'\" target=\"_blank\" rel=\"noopener\">'+esc(y.label||y.type)+'</a>'}).join(''),mapUrl=String(info.map_url||'').trim();if(/^https?:\\/\\//i.test(mapUrl))socialHtml+='<a class=\"pill\" href=\"'+esc(mapUrl)+'\" target=\"_blank\" rel=\"noopener\">📍 Ver ubicación</a>';$('socials').innerHTML=socialHtml;"
              text = text.replace(old_social, new_social, 1)

          path.write_text(text, encoding='utf-8')

          # 3) Keep the root copy consistent where the same current blocks exist.
          root = Path('catalogo-v2.html')
          if root.exists():
              root_text = root.read_text(encoding='utf-8')
              root_text = root_text.replace("if(slogan.toLowerCase()==='calidad y buenos precios')slogan='';", "")
              root_text = root_text.replace("var f=[];if(info.phone)f.push(['CONTACTO',info.phone]);if(info.address)f.push(['UBICACIÓN',info.address]);if(info.hours)f.push(['HORARIO',info.hours]);", new_facts)
              root.write_text(root_text, encoding='utf-8')

          # 4) Force browsers to load the new publisher logic.
          index = Path('index.html')
          index_text = index.read_text(encoding='utf-8')
          index_text, count = re.subn(r'public-catalog\.js\?v=\d+', 'public-catalog.js?v=202610220105', index_text, count=1)
          if count:
              index.write_text(index_text, encoding='utf-8')

          # Validation: current account isolation was already present; preserve it.
          active = path.read_text(encoding='utf-8')
          checks = {
              'publisher RUC': ruc_code in pub.read_text(encoding='utf-8'),
              'real business id': "BID=String(x.business_id)" in active,
              'products scoped by business': "&business_id=eq.'+encodeURIComponent(BID)" in active,
              'slogan visible': "if(slogan.toLowerCase()==='calidad y buenos precios')slogan=''" not in active,
              'RUC visible': "['RUC / DOCUMENTO',info.ruc]" in active,
              'dynamic logo': "var brandMark=document.querySelector('.top>b')" in active,
              'maps link': "mapUrl=String(info.map_url||'').trim()" in active,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Validation failed: ' + ', '.join(failed))
          print('All public catalog business info checks passed')
          PY

      - name: Commit hotfix
        run: |
          rm -f .github/workflows/hotfix-public-catalog-business-info.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix public catalog business information"
          git push origin HEAD:main
