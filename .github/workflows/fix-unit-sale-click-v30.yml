name: Fix unit product sale click flow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-unit-sale-click-v30.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix direct sale click for normal unit products
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""    if(med){addToCart(p);return}
    openSale(false);
    addToCart(p);
    return;
"""
          new="""    if(med){addToCart(p);return}
    // Productos normales (por unidad, caja, etc. sin selector especial):
    // primero agregarlos al carrito y recién después abrir Nueva venta.
    // Así nunca se abre el modal vacío por una carrera de renderizado.
    const hasChars=Array.isArray(p.characteristics)&&p.characteristics.length>0;
    const rawUnit=String(p.unit||'').trim().toLowerCase();
    const continuousUnit=['kg','kilo','kilos','kilogramo','kilogramos','g','gr','gramo','gramos','l','litro','litros','ml','mililitro','mililitros','m','metro','metros','m2','m²'].includes(rawUnit);
    const commercial=!!(window.VareliaCommercialPresentations&&typeof window.VareliaCommercialPresentations.enabledFor==='function'&&window.VareliaCommercialPresentations.enabledFor(p));
    if(!hasChars&&!continuousUnit&&!commercial){
      addToCart(p);
      openSale(false);
      return;
    }
    // Los productos que sí necesitan selector conservan el flujo anterior para
    // que talla/color, peso o presentación se elijan dentro de Nueva venta.
    openSale(false);
    addToCart(p);
    return;
"""
          if old not in s:
              if "primero agregarlos al carrito y recién después abrir Nueva venta" in s:
                  print('sale click fix already present')
              else:
                  raise SystemExit('Expected sale click block not found; refusing unsafe patch')
          else:
              s=s.replace(old,new,1)

          s=s.replace("const BUILD='20261021-SALE-LOGIC-V29'","const BUILD='20261022-UNIT-SALE-CLICK-V30'",1)
          p.write_text(s,encoding='utf-8')

          check=p.read_text(encoding='utf-8')
          required=[
              "if(!hasChars&&!continuousUnit&&!commercial)",
              "addToCart(p);\n      openSale(false);",
              "20261022-UNIT-SALE-CLICK-V30"
          ]
          for x in required:
              if x not in check:
                  raise SystemExit('Validation failed: '+x)
          print('unit sale click validation OK')
          PY

      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-unit-sale-click-v30.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix direct unit product sale selection"
          git push origin HEAD:main
