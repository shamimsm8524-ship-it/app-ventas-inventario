name: Fix unit product sale click flow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-unit-sale-click-v30.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply unit sale click fix
        run: python3 scripts/fix_unit_sale_click_v30.py
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-unit-sale-click-v30.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix direct unit product sale selection"
          git push origin HEAD:main
