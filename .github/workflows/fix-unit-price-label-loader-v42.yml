name: Fix unit price label loader v42

on:
  push:
    paths:
      - '.github/workflows/fix-unit-price-label-loader-v42.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply unit price label loader fix
        run: python scripts/fix_unit_price_label_loader_v42.py
      - name: Commit patch
        run: |
          git config user.name "Varelia Stability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Load clarified unit price label v111"
          git push
