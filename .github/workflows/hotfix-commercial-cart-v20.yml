name: One-time commercial cart modal hotfix

on:
  push:
    paths:
      - '.github/workflows/hotfix-commercial-cart-v20.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch presentation picker into active dialog
        shell: python
        run: |
          from pathlib import Path

          ap = Path('advanced-pricing.js')
          s = ap.read_text()
          old_append = "document.body.appendChild(l);$('vCSClose').onclick=closePicker;"
          new_append = "const host=($('scannerDialog')?.open&&$('scannerDialog'))||($('saleDialog')?.open&&$('saleDialog'))||document.body;host.appendChild(l);$('vCSClose').onclick=closePicker;"
          if old_append not in s:
              raise SystemExit('advanced-pricing: picker append marker not found')
          s = s.replace(old_append, new_append, 1)

          old_open = "function openPicker(p,initial=1){if(!enabledFor(p))return false;const l=ensurePicker(),c=pricingFor(p),options="
          new_open = "function openPicker(p,initial=1){if(!enabledFor(p))return false;const l=ensurePicker(),host=($('scannerDialog')?.open&&$('scannerDialog'))||($('saleDialog')?.open&&$('saleDialog'))||document.body,c=pricingFor(p);if(l.parentNode!==host)host.appendChild(l);const options="
          if old_open not in s:
              raise SystemExit('advanced-pricing: openPicker marker not found')
          s = s.replace(old_open, new_open, 1)
          ap.write_text(s)

          idx = Path('index.html')
          h = idx.read_text()
          old_build = "20261021-PRODUCT-FORM-COMMERCIAL-V19"
          new_build = "20261021-COMMERCIAL-CART-V20"
          if old_build not in h:
              raise SystemExit('index: build marker not found')
          h = h.replace(old_build, new_build, 1)
          old_src = "advanced-pricing.js?v=20261021-commercial-v19"
          new_src = "advanced-pricing.js?v=20261021-commercial-cart-v20"
          if old_src not in h:
              raise SystemExit('index: advanced-pricing source marker not found')
          h = h.replace(old_src, new_src, 1)
          idx.write_text(h)
      - name: Validate JavaScript
        run: |
          node --check advanced-pricing.js
          node scripts/stability-audit.mjs
      - name: Commit hotfix
        run: |
          rm -f .github/workflows/hotfix-commercial-cart-v20.yml
          git config user.name 'Varelia Stability Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add advanced-pricing.js index.html .github/workflows/hotfix-commercial-cart-v20.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix commercial add-to-sale picker inside modal'
          git push origin HEAD:main
