name: Wire checkout receipt watchdog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-checkout-receipt-watchdog.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add receipt watchdog script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="checkout-receipt-watchdog.js?v=20261021-v1"></script>'
          if tag not in s:
              anchor='<script src="pos-receipt.js?v=20261021-receipt-open-v24"></script>'
              if anchor not in s:
                  raise SystemExit('pos-receipt anchor not found')
              s=s.replace(anchor, anchor+'\n'+tag, 1)
          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name "Varelia Stability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load independent checkout receipt watchdog"
          git push
