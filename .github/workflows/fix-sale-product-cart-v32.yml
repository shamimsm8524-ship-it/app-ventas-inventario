name: Fix sale product cart V32

on:
  push:
    branches: [main]
    paths:
      - "scripts/fix_sale_product_cart_v32.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply sale product cart fix
        run: python3 scripts/fix_sale_product_cart_v32.py
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-sale-product-cart-v32.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Keep selected product in sale cart"
          git push origin HEAD:main
