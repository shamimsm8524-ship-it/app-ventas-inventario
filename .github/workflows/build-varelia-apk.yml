name: Varelia 1.0.53 APK validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/build-varelia-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          out = pathlib.Path("/tmp/varelia-inline-js")
          out.mkdir(parents=True, exist_ok=True)
          count = 0
          for i, m in enumerate(re.finditer(r'<script\b([^>]*)>(.*?)</script>', html, re.I | re.S), 1):
              attrs, code = m.group(1), m.group(2)
              if re.search(r'\bsrc\s*=', attrs, re.I) or 'application/ld+json' in attrs.lower():
                  continue
              count += 1
              (out / f"inline-{i}.js").write_text(code, encoding="utf-8")
          print(f"Checking {count} inline JavaScript blocks")
          PY
          for f in /tmp/varelia-inline-js/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
          for f in pos-sales.js pos-receipt.js payment-options.js; do
            echo "Checking external JavaScript $f"
            node --check "$f"
          done

      - name: Product and profit regression checks
        run: node --test tests/purchase-cost.test.cjs

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare exact Varelia logo
        run: |
          mkdir -p android-native/app/src/main/res/mipmap-xxxhdpi android-native/app/src/main/res/drawable
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          img = Image.open("varelia_icon.jpg").convert("RGB")
          img.save("android-native/app/src/main/res/mipmap-xxxhdpi/varelia_icon.png", format="PNG", optimize=True)
          img.save("android-native/app/src/main/res/drawable/varelia_icon.png", format="PNG", optimize=True)
          PY

      - name: Build installable APK
        working-directory: android-native
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare client APK name
        run: cp android-native/app/build/outputs/apk/debug/app-debug.apk Varelia.apk

      - name: Verify APK
        run: |
          test -f Varelia.apk
          file Varelia.apk
          ls -lh Varelia.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs Varelia.apk

      - name: Upload Varelia APK
        uses: actions/upload-artifact@v4
        with:
          name: Varelia-1.0.53-validation
          path: Varelia.apk
          if-no-files-found: error
          retention-days: 30

