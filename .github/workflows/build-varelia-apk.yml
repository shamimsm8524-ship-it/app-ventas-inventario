name: Varelia 1.0.45 APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare exact Varelia logo
        run: |
          mkdir -p android-native/app/src/main/res/mipmap-xxxhdpi
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          img = Image.open("varelia_icon.jpg").convert("RGB")
          img.save("android-native/app/src/main/res/mipmap-xxxhdpi/varelia_icon.png", format="PNG", optimize=True)
          PY

      - name: Build installable APK
        working-directory: android-native
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare client APK name
        run: cp android-native/app/build/outputs/apk/debug/app-debug.apk Varelia.apk

      - name: Verify APK
        run: |
          test -f Varelia.apk
          file Varelia.apk
          ls -lh Varelia.apk

      - name: Upload Varelia APK
        uses: actions/upload-artifact@v4
        with:
          name: Varelia-APK
          path: Varelia.apk
          if-no-files-found: error
          retention-days: 30

# Build trigger: verify secure Varelia APK build
