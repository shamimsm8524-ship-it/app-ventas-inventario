name: Varelia 1.0.34 APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare icon
        run: |
          mkdir -p android-native/app/src/main/res/drawable
          cp favicon-512.png android-native/app/src/main/res/drawable/varelia_icon.png

      - name: Build installable APK
        working-directory: android-native
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android-native/app/build/outputs/apk/debug/app-debug.apk
          file android-native/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Varelia 1.0.34 APK
        uses: actions/upload-artifact@v4
        with:
          name: Varelia-1.0.34-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
