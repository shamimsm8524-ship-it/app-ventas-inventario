name: Instalar alarma de recordatorios
on:
  push:
    paths:
      - '.github/workflows/install-reminder-alarm.yml'
      - 'reminder-alarm.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar alarma en la app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          alarm='<script src="reminder-alarm.js?v=20260819-1"></script>'
          s=re.sub(r'<script src="reminder-alarm\.js(?:\?[^\"]*)?\"></script>',alarm,s)
          if alarm not in s:
              marker=re.search(r'<script src="merchandise-reminders\.js(?:\?[^\"]*)?\"></script>',s)
              if marker:
                  s=s[:marker.end()]+'\n'+alarm+s[marker.end():]
              else:
                  s=s.replace('</body>',alarm+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activar alarma sonora de recordatorios"
          git push