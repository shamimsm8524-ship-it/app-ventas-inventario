name: Fix simple sale direct V33
on:
  push:
    branches: [main]
    paths:
      - "scripts/fix_simple_sale_direct_v33.py"
      - ".github/workflows/fix-simple-sale-direct-v33.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply direct simple sale fix
        run: python3 scripts/fix_simple_sale_direct_v33.py
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-simple-sale-direct-v33.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix simple product Vender flow directly"
          git push origin HEAD:main
