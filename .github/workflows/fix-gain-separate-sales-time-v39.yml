name: Fix gain separate sales time V39
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-gain-separate-sales-time-v39.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated Ganancias detail patch
        run: python3 scripts/fix_gain_separate_sales_time_v39.py
      - name: Validate JavaScript syntax
        run: node --check reports-profit.js
      - name: Show isolated diff
        run: git diff -- reports-profit.js index.html
      - name: Commit isolated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports-profit.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show Ganancias sales separately with sale time'
          git push
