name: Fix sale button V31

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-sale-button-v31.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply sale button V31 fix
        run: python3 scripts/fix_sale_button_v31.py
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-sale-button-v31.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix Vender button opening sale with product"
          git push origin HEAD:main
