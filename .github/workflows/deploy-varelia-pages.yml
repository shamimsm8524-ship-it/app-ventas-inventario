name: Deploy Varelia Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "varelia-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar sitio
        uses: actions/checkout@v4

      - name: Corregir filtro transitorio de Ganancias
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('reports-profit.js')
          s=p.read_text(encoding='utf-8')

          old1="""      if(panel.querySelector('[data-gain-period-buttons]')){
        const selected=reportHistoryFilter();
        const day=selected.mode==='day'?(gainHistoryDate()||selected.date||''):'';
        const marker=selected.mode+':'+day;
        if(marker!==panel.dataset.gainHistoryMarker){
          panel.dataset.gainHistoryMarker=marker;
          if(typeof panel.__gainUseHistoryDate==='function')panel.__gainUseHistoryDate(selected,day);
        }
        continue;
      }
"""
          new1="""      if(panel.querySelector('[data-gain-period-buttons]')){
        const selected=reportHistoryFilter();
        // Mientras Historial todavía está montando sus botones, reportHistoryFilter()
        // puede devolver Todo/known:false. Ese estado transitorio no es una elección real.
        if(selected.known){
          const day=selected.mode==='day'?(gainHistoryDate()||selected.date||''):'';
          const marker=selected.mode+':'+day;
          if(marker!==panel.dataset.gainHistoryMarker){
            panel.dataset.gainHistoryMarker=marker;
            if(typeof panel.__gainUseHistoryDate==='function')panel.__gainUseHistoryDate(selected,day);
          }
        }
        continue;
      }
"""
          if old1 in s:
            s=s.replace(old1,new1,1)

          old2="""      let activePeriod=selectedHistory.mode==='day'?'day':
        selectedHistory.mode==='today'?'today':
        selectedHistory.mode==='month'?'month':
        selectedHistory.mode==='all'?'all':'today';
"""
          new2="""      let activePeriod=selectedHistory.mode==='day'&&selectedHistory.known?'day':
        selectedHistory.mode==='today'?'today':
        selectedHistory.mode==='month'?'month':
        selectedHistory.mode==='all'&&selectedHistory.known?'all':'today';
"""
          if old2 in s:
            s=s.replace(old2,new2,1)

          old3="""      panel.__gainUseHistoryDate=(selected,date)=>{
        if(selected.mode==='day'){
"""
          new3="""      panel.__gainUseHistoryDate=(selected,date)=>{
        // No convertir un filtro todavía desconocido en Todo.
        if(!selected?.known)return;
        if(selected.mode==='day'){
"""
          if old3 in s:
            s=s.replace(old3,new3,1)

          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=h.replace('reports-profit.js?v=20261021-profit-live-v26','reports-profit.js?v=20261021-filter-stable-v27')
          idx.write_text(h,encoding='utf-8')
          PY
          node --check reports-profit.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos incluyendo .well-known
        run: |
          tar --dereference --hard-dereference \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Subir artefacto de Pages
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5