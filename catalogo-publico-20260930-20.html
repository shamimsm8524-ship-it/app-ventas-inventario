<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="theme-color" content="#fffaf5"><title>Varelia Store</title><style>:root{--ink:#241b18;--muted:#776a65;--accent:#a8553a;--accent2:#d9a441;--cream:#fffaf5;--paper:#fff;--line:#eadfd8;--soft:#f8f0ea}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fffaf5 0,#f7f2ee 48%,#f4f1ef 100%);color:var(--ink)}.wrap{max-width:1080px;margin:auto;padding:18px 16px 120px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#fff 0%,#fff7ef 65%,#f6e7da 100%);border:1px solid var(--line);border-radius:30px;padding:26px;box-shadow:0 18px 55px rgba(70,45,35,.08)}.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-70px;top:-85px;background:radial-gradient(circle,rgba(217,164,65,.25),rgba(217,164,65,0))}.brand{display:flex;gap:15px;align-items:center;position:relative;z-index:1}.logo{width:68px;height:68px;border-radius:21px;background:linear-gradient(145deg,var(--accent),#7f3928);color:white;display:grid;place-items:center;font-size:24px;font-weight:950;box-shadow:0 10px 25px rgba(168,85,58,.25)}.hero h1{margin:0;font-size:clamp(24px,5vw,34px);letter-spacing:-.8px}.tag{margin:5px 0;color:var(--muted);font-size:14px}.verified{display:inline-flex;margin-top:5px;background:#eef8f0;color:#287a42;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800}.heroBtns{display:flex;gap:9px;margin-top:20px;position:relative;z-index:1}.heroBtns a,.heroBtns button{border:0;border-radius:14px;padding:12px 16px;font-weight:850;text-decoration:none;text-align:center;cursor:pointer}.heroBtns a{background:#1f9d58;color:white}.heroBtns button{background:var(--ink);color:white}.panel{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:24px;padding:19px;margin-top:15px;box-shadow:0 10px 35px rgba(70,45,35,.05)}.panelHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.panel h2{font-size:17px;margin:0}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);font-weight:900}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:13px}.fact{background:var(--soft);border:1px solid #f0e4dc;border-radius:15px;padding:12px}.fact small{display:block;color:#9a7d70;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}.fact b{font-size:13px;line-height:1.35}.socialTitle{font-size:11px;color:var(--muted);font-weight:800;margin-top:16px}.socials{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.social{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;font-size:12px;font-weight:850;box-shadow:0 4px 12px rgba(70,45,35,.04)}.social:hover{transform:translateY(-1px);border-color:#d8c1b4}.socialIcon{width:22px;height:22px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-size:11px}.payments{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.pill{font-size:11px;font-weight:850;padding:7px 10px;border-radius:999px;background:#fff6dc;color:#79570b;border:1px solid #f0dfae}.search{position:sticky;top:0;z-index:8;background:rgba(250,247,244,.9);backdrop-filter:blur(14px);padding:10px 0}.search input,select{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;font-size:15px;color:var(--ink);outline:none}.search input:focus,select:focus{border-color:#c99684;box-shadow:0 0 0 3px rgba(168,85,58,.08)}.title{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 11px}.title h2{margin:0;font-size:22px;letter-spacing:-.4px}.title span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 25px rgba(70,45,35,.05);transition:.2s}.card:hover{transform:translateY(-2px);box-shadow:0 13px 30px rgba(70,45,35,.09)}.photo{aspect-ratio:1.08;background:linear-gradient(145deg,#faf4ef,#f0e7e1);display:grid;place-items:center;color:#aa9388;font-size:12px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.cat{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:900}.name{font-weight:950;margin:6px 0;font-size:16px;line-height:1.2}.desc{font-size:11px;color:var(--muted);line-height:1.4;min-height:30px}.row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:11px}.price{font-size:20px;font-weight:950}.stock{font-size:9px;color:#287a42;background:#eef8f0;padding:6px 7px;border-radius:999px;font-weight:900}.add{width:100%;border:0;background:linear-gradient(135deg,var(--ink),#46322c);color:#fff;border-radius:13px;padding:11px;margin-top:11px;font-weight:900}.status{text-align:center;padding:55px 20px;color:var(--muted)}.bar{display:none;position:fixed;left:50%;bottom:13px;transform:translateX(-50%);width:min(94%,700px);background:rgba(36,27,24,.96);backdrop-filter:blur(12px);color:#fff;border-radius:20px;padding:13px 16px;z-index:20;align-items:center;justify-content:space-between;box-shadow:0 18px 45px rgba(36,27,24,.3)}.bar.on{display:flex}.bar button{border:0;background:#fff4eb;color:var(--ink);border-radius:13px;padding:11px 15px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:rgba(36,27,24,.6);backdrop-filter:blur(4px);z-index:30;padding:55px 12px 12px}.modal.on{display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--cream);border-radius:27px;width:min(100%,700px);max-height:90vh;overflow:auto;padding:20px}.sheet h2{margin-top:0}.item{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0}.delivery{margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:17px;background:#fff}.cost,.total{display:flex;justify-content:space-between;padding:8px 0}.total{font-size:20px;font-weight:950;border-top:1px solid var(--line)}.order,.close{width:100%;border:0;border-radius:14px;padding:13px;font-weight:900}.order{background:linear-gradient(135deg,var(--accent),#873e2b);color:#fff;margin-bottom:8px}.close{background:#eee5df;color:var(--ink)}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.facts{grid-template-columns:repeat(4,1fr)}}@media(max-width:440px){.wrap{padding-left:12px;padding-right:12px}.hero{padding:21px}.facts{grid-template-columns:1fr}.heroBtns{flex-direction:column}.social{flex:1 1 calc(50% - 8px);justify-content:center}}</style></head><body><main class="wrap"><header class="hero"><div class="brand"><div class="logo" id="logo">VS</div><div><div class="eyebrow">Tienda oficial</div><h1 id="business">Catálogo</h1><p class="tag">Compra directamente al negocio</p><div class="verified">● Stock actualizado</div></div></div><div class="heroBtns"><a id="wa" style="display:none" target="_blank" rel="noopener">WhatsApp</a><button id="share">Compartir tienda</button></div></header><section class="panel"><div class="panelHead"><div><div class="eyebrow">Conoce al vendedor</div><h2>Información del negocio</h2></div></div><div class="facts" id="facts"></div><div class="payments" id="payments"></div><div class="socialTitle" id="socialTitle" style="display:none">Síguenos y contáctanos</div><div class="socials" id="socials"></div></section><div class="search"><input id="q" placeholder="Buscar en la tienda…"></div><div class="title"><h2>Productos</h2><span id="pc"></span></div><section class="grid" id="grid"><div class="status">Cargando tienda…</div></section></main><div class="bar" id="bar"><div><b id="count">0 productos</b><div id="sum">S/ 0.00</div></div><button id="view">Ver carrito →</button></div><div class="modal" id="modal"><div class="sheet"><h2>Tu pedido</h2><div id="items"></div><div class="delivery"><b>Forma de entrega</b><select id="delivery"></select><div id="note" style="font-size:11px;color:#776a65;margin-top:8px"></div></div><div class="cost"><span>Productos</span><b id="subtotal"></b></div><div class="cost"><span id="shiplabel">Envío</span><b id="shipcost"></b></div><div class="total"><span>Total</span><span id="total"></span></div><button class="order" id="order">Enviar pedido</button><button class="close" id="close">Seguir comprando</button></div></div><script>(()=>{const API='https://onvdcaohnftrjunwdvjp.supabase.co/rest/v1/',KEY='sb_publishable_bz2z5uglf_EALJezqv4rCw_S73GMNrh',id=new URLSearchParams(location.search).get('c')||'',H={apikey:KEY,Authorization:'Bearer '+KEY},$=x=>document.getElementById(x),money=n=>'S/ '+Number(n||0).toFixed(2),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[],business='',cart={},info={},social=[];async function get(p){const r=await fetch(API+p,{headers:H,cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}function details(){const rows=[];if(info.ruc)rows.push(['RUC',info.ruc]);if(info.phone)rows.push(['Teléfono',info.phone]);if(info.address)rows.push(['Dirección',info.address]);if(info.hours)rows.push(['Horario',info.hours]);$('facts').innerHTML=rows.length?rows.map(x=>`<div class="fact"><small>${esc(x[0])}</small><b>${esc(x[1])}</b></div>`).join(''):'<div class="fact"><small>Atención</small><b>Consulta directamente con el negocio</b></div>';const pm=Array.isArray(info.payment_methods)?info.payment_methods:[];$('payments').innerHTML=pm.length?'<span class="pill">Métodos de pago</span>'+pm.map(x=>`<span class="pill">${esc(x)}</span>`).join(''):'';const icons={facebook:'f',instagram:'◎',tiktok:'♪',youtube:'▶',whatsapp:'✆'};const links=Array.isArray(social)?social.filter(x=>x&&x.url):[];$('socials').innerHTML=links.map(x=>`<a class="social" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><span class="socialIcon">${icons[x.type]||'↗'}</span>${esc(x.label||x.type)}</a>`).join('');$('socialTitle').style.display=links.length?'block':'none';if(info.whatsapp){$('wa').href=info.whatsapp;$('wa').style.display='block'}}function ps(){let n=0,t=0;Object.entries(cart).forEach(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);if(p){n+=v;t+=v*(+p.sell_price||0)}});return{n,t}}function dd(){const type=$('delivery').value,d=info.delivery||{};let charge=0,label='Recojo / coordinado',note='';if(type==='olva'){charge=Math.max(0,+d.olva?.cost||0);label='Olva Courier'}if(type==='indrive'){charge=Math.max(0,+d.indrive?.cost||0);label='InDrive'}if(type==='shalom'){label='Shalom';note='El flete se paga directamente en Shalom al recoger.'}return{type,charge,label,note}}function totals(){const p=ps(),d=dd();return{...p,...d,total:p.t+d.charge}}function deliveries(){const d=info.delivery||{},o=[];if(d.pickup!==false&&info.allow_pickup!==false)o.push(['pickup','Recojo / entrega coordinada — S/ 0.00']);if(d.olva?.enabled)o.push(['olva','Olva Courier — '+money(d.olva.cost)]);if(d.indrive?.enabled)o.push(['indrive','InDrive — '+money(d.indrive.cost)]);if(d.shalom?.enabled)o.push(['shalom','Shalom — flete se paga en agencia']);if(!o.length)o.push(['pickup','Entrega a coordinar']);$('delivery').innerHTML=o.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}function cartRender(){const s=totals();$('bar').classList.toggle('on',s.n>0);$('count').textContent=s.n+' producto'+(s.n===1?'':'s');$('sum').textContent=money(s.total);$('subtotal').textContent=money(s.t);$('shiplabel').textContent=s.type==='shalom'?'Envío Shalom':'Envío';$('shipcost').textContent=s.type==='shalom'?'Se paga en agencia':money(s.charge);$('total').textContent=money(s.total);$('note').textContent=s.note;$('items').innerHTML=Object.entries(cart).map(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);return p?`<div class="item"><span><b>${esc(p.name)}</b><br><small>${v} × ${money(p.sell_price)}</small></span><b>${money(v*p.sell_price)}</b></div>`:''}).join('')}function render(){const q=$('q').value.toLowerCase(),list=products.filter(p=>!q||String(p.name+' '+(p.category||'')).toLowerCase().includes(q));$('pc').textContent=products.length+' disponibles';$('grid').innerHTML=list.length?list.map(p=>`<article class="card"><div class="photo">${p.image_data?`<img src="${p.image_data}" alt="${esc(p.name)}">`:'Sin imagen'}</div><div class="body"><div class="cat">${esc(p.category||'Producto')}</div><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||p.specifications||'Disponible para compra')}</div><div class="row"><span class="price">${money(p.sell_price)}</span><span class="stock">${Math.floor(+p.stock||0)} disponibles</span></div><button class="add" data-id="${esc(p.product_id)}">Agregar al carrito</button></div></article>`).join(''):'<div class="status">No encontramos productos.</div>';cartRender()}async function load(){try{const c=await get('public_catalogs?select=business_id,business_name,business_info,social_links&public_id=eq.'+encodeURIComponent(id)+'&enabled=eq.true&limit=1');if(!c.length)throw Error();business=c[0].business_name||'Tienda';info=c[0].business_info||{};social=c[0].social_links||[];$('business').textContent=business;$('logo').textContent=business.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();document.title=business+' · Varelia Store';details();products=await get('public_catalog_products?select=product_id,name,category,sell_price,stock,image_data,description,specifications&business_id=eq.'+encodeURIComponent(c[0].business_id)+'&stock=gt.0&order=name.asc');deliveries();render()}catch(e){console.error(e);$('grid').innerHTML='<div class="status">No pudimos cargar la tienda. Actualiza la página.</div>'}}$('q').oninput=render;$('grid').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const p=products.find(x=>String(x.product_id)===b.dataset.id);if(p)cart[b.dataset.id]=Math.min((cart[b.dataset.id]||0)+1,Math.floor(+p.stock||1));cartRender()};$('view').onclick=()=>$('modal').classList.add('on');$('close').onclick=()=>$('modal').classList.remove('on');$('delivery').onchange=cartRender;$('share').onclick=async()=>{const u='https://vareliastore.tech/catalogo/milagros/';try{navigator.share?await navigator.share({title:business,url:u}):await navigator.clipboard.writeText(u)}catch{}};$('order').onclick=async()=>{const s=totals(),lines=Object.entries(cart).map(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);return p?`${v} x ${p.name} — ${money(v*p.sell_price)}`:''}).filter(Boolean),text=`Pedido para ${business}\n\n${lines.join('\n')}\n\nEntrega: ${s.label}${s.type==='shalom'?' (flete se paga en Shalom)':''}\nTotal: ${money(s.total)}\nhttps://vareliastore.tech/catalogo/milagros/`;try{navigator.share?await navigator.share({title:'Pedido '+business,text}):await navigator.clipboard.writeText(text)}catch{}};load()})()</script></body></html>
