<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="theme-color" content="#ffffff"><title>Varelia Store</title><style>:root{--black:#111;--gray:#6b7280;--line:#e8e8e8;--soft:#f7f7f7;--green:#18a957;--brand:#111;--brandSoft:#f1f1f1}*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}.page{max-width:1120px;margin:auto;padding-bottom:110px}.top{padding:18px 18px 12px;border-bottom:1px solid var(--line);background:#fff}.brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:var(--gray);font-size:12px}.actions{display:flex;gap:8px;margin-top:13px}.actions a,.actions button{height:40px;border-radius:10px;padding:0 14px;border:1px solid #ddd;background:#fff;color:#111;text-decoration:none;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:12px}.actions .wa{background:#111;color:#fff;border-color:#111}.seller{margin:14px 16px 0;border:1px solid var(--line);border-radius:16px;padding:15px}.sellerTop{display:flex;align-items:center;justify-content:space-between}.seller h2{font-size:14px;margin:0}.sellerBadge{font-size:10px;background:#edf9f1;color:#178344;padding:5px 8px;border-radius:99px;font-weight:800}.facts{display:flex;gap:18px;overflow:auto;padding:13px 0 4px}.fact{min-width:130px}.fact small{display:block;color:#999;font-size:9px;text-transform:uppercase;font-weight:800;margin-bottom:4px}.fact b{font-size:12px;line-height:1.3}.socials{display:flex;gap:7px;overflow:auto;padding-top:11px;border-top:1px solid #f0f0f0;margin-top:10px}.social{white-space:nowrap;text-decoration:none;color:var(--brand);background:#fff;border:1px solid color-mix(in srgb,var(--brand) 28%,#ddd);border-radius:9px;padding:8px 10px;font-size:11px;font-weight:800;transition:.18s}.social:active,.social.selected{background:var(--brandSoft);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brand) 35%,transparent);transform:scale(.97)}.pay{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pay span{font-size:10px;background:#f5f5f5;border-radius:7px;padding:6px 8px}.shopbar{position:sticky;top:0;z-index:8;background:#fffffff2;backdrop-filter:blur(12px);padding:14px 16px 9px}.search{position:relative}.search input{width:100%;height:46px;border:1px solid #ddd;border-radius:12px;padding:0 15px 0 42px;font-size:14px;outline:none}.search:before{content:'⌕';position:absolute;left:15px;top:8px;font-size:25px;color:#777}.cats{display:flex;gap:8px;overflow:auto;padding-top:10px}.catBtn{white-space:nowrap;border:0;border-radius:99px;background:#f3f3f3;padding:8px 12px;font-size:11px;font-weight:800}.catBtn.on{background:var(--brand);color:#fff;box-shadow:0 5px 14px color-mix(in srgb,var(--brand) 24%,transparent)}.section{padding:8px 16px}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.sectionHead h2{font-size:20px;margin:0}.sectionHead span{font-size:11px;color:#888}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{min-width:0}.photo{position:relative;aspect-ratio:1/1;background:#f5f5f5;border-radius:14px;overflow:hidden;display:grid;place-items:center;color:#aaa;font-size:11px}.photo img{width:100%;height:100%;object-fit:cover}.stock{position:absolute;left:8px;bottom:8px;background:#ffffffeb;border-radius:7px;padding:5px 7px;font-size:9px;font-weight:800}.pbody{padding:9px 2px 4px}.pcat{font-size:9px;color:#999;text-transform:uppercase;font-weight:800}.pname{font-size:14px;font-weight:800;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.desc{font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:7px}.price{font-size:17px;font-weight:900}.add{width:34px;height:34px;border:0;border-radius:50%;background:var(--brand);color:#fff;font-size:21px;line-height:1;transition:.15s}.add:active{transform:scale(.9);box-shadow:0 0 0 5px var(--brandSoft)}.empty{text-align:center;color:#888;padding:50px 10px}.cartbar{display:none;position:fixed;z-index:20;bottom:12px;left:50%;transform:translateX(-50%);width:min(94%,620px);background:#111;color:#fff;border-radius:15px;padding:12px 14px;align-items:center;justify-content:space-between;box-shadow:0 10px 35px #0003}.cartbar.on{display:flex}.cartbar small{display:block;color:#bbb;margin-top:2px}.cartbar button{border:0;border-radius:9px;background:#fff;padding:10px 13px;font-weight:900}.modal{display:none;position:fixed;inset:0;z-index:30;background:#0008;padding:20px 10px}.modal.on{display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:min(100%,650px);max-height:90vh;overflow:auto;border-radius:22px 22px 12px 12px;padding:19px}.sheet h2{margin:0 0 15px}.item{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee;font-size:13px}.delivery{background:#f7f7f7;border-radius:12px;padding:12px;margin:13px 0}.delivery select{width:100%;margin-top:8px;padding:11px;border:1px solid #ddd;border-radius:9px;background:#fff}.note{font-size:10px;color:#777;margin-top:7px}.line,.total{display:flex;justify-content:space-between;padding:7px 0}.total{font-size:19px;font-weight:900;border-top:1px solid #ddd;margin-top:4px;padding-top:12px}.order,.close{width:100%;padding:13px;border:0;border-radius:11px;font-weight:900}.order{background:#111;color:#fff;margin-top:10px}.close{background:#f2f2f2;margin-top:7px}@media(min-width:720px){.top{display:flex;justify-content:space-between;align-items:center}.actions{margin:0}.grid{grid-template-columns:repeat(4,1fr)}.seller{margin-left:18px;margin-right:18px}.section,.shopbar{padding-left:18px;padding-right:18px}}</style></head><body><main class="page"><header class="top"><div class="brand"><div class="logo" id="logo">VS</div><div><h1 id="business">Tienda</h1><p>Catálogo oficial · stock actualizado</p></div></div><div class="actions"><a class="wa" id="wa" style="display:none" target="_blank" rel="noopener">WhatsApp</a><button id="share">Compartir</button></div></header><section class="seller"><div class="sellerTop"><h2>Información de la tienda</h2><span class="sellerBadge">● Disponible</span></div><div class="facts" id="facts"></div><div class="pay" id="payments"></div><div class="socials" id="socials" style="display:none"></div></section><div class="shopbar"><div class="search"><input id="q" placeholder="Buscar productos"></div><div class="cats" id="cats"></div></div><section class="section"><div class="sectionHead"><h2>Productos</h2><span id="pc"></span></div><div class="grid" id="grid"><div class="empty">Cargando productos…</div></div></section></main><div class="cartbar" id="bar"><div><b id="count">0 productos</b><small id="sum">S/ 0.00</small></div><button id="view">Ver carrito</button></div><div class="modal" id="modal"><div class="sheet"><h2>Tu carrito</h2><div id="items"></div><div class="delivery"><b>Entrega</b><select id="delivery"></select><div class="note" id="note"></div></div><div class="line"><span>Productos</span><b id="subtotal"></b></div><div class="line"><span id="shiplabel">Envío</span><b id="shipcost"></b></div><div class="total"><span>Total</span><span id="total"></span></div><button class="order" id="order">Enviar pedido</button><button class="close" id="close">Seguir comprando</button></div></div><script>(()=>{const API='https://onvdcaohnftrjunwdvjp.supabase.co/rest/v1/',KEY='sb_publishable_bz2z5uglf_EALJezqv4rCw_S73GMNrh',id=new URLSearchParams(location.search).get('c')||'',H={apikey:KEY,Authorization:'Bearer '+KEY},$=x=>document.getElementById(x),money=n=>'S/ '+Number(n||0).toFixed(2),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[],business='',cart={},info={},social=[],category='Todos';async function get(p){const r=await fetch(API+p,{headers:H,cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}function applyBrand(){const raw=String(info.theme_color||info.brand_color||info.accent_color||'#111111').trim();const ok=/^#[0-9a-f]{6}$/i.test(raw)?raw:'#111111';document.documentElement.style.setProperty('--brand',ok);document.documentElement.style.setProperty('--brandSoft',ok+'20');}function details(){const a=[];if(info.ruc)a.push(['RUC',info.ruc]);if(info.phone)a.push(['Teléfono',info.phone]);if(info.address)a.push(['Dirección',info.address]);if(info.hours)a.push(['Horario',info.hours]);$('facts').innerHTML=(a.length?a:[['Atención','Contacta directamente con la tienda']]).map(x=>`<div class="fact"><small>${esc(x[0])}</small><b>${esc(x[1])}</b></div>`).join('');const pm=Array.isArray(info.payment_methods)?info.payment_methods:[];$('payments').innerHTML=pm.map(x=>`<span>${esc(x)}</span>`).join('');const icons={facebook:'f',instagram:'◎',tiktok:'♪',youtube:'▶',whatsapp:'✆'},links=Array.isArray(social)?social.filter(x=>x&&x.url):[];$('socials').innerHTML=links.map(x=>`<a class="social" href="${esc(x.url)}" target="_blank" rel="noopener">${icons[x.type]||'↗'} ${esc(x.label||x.type)}</a>`).join('');$('socials').style.display=links.length?'flex':'none';$('socials').onclick=e=>{const a=e.target.closest('.social');if(a){document.querySelectorAll('.social').forEach(x=>x.classList.remove('selected'));a.classList.add('selected')}};if(info.whatsapp){$('wa').href=info.whatsapp;$('wa').style.display='flex'}}function categories(){const a=['Todos',...new Set(products.map(p=>p.category||'Otros'))];$('cats').innerHTML=a.map(x=>`<button class="catBtn ${x===category?'on':''}" data-cat="${esc(x)}">${esc(x)}</button>`).join('')}function ps(){let n=0,t=0;Object.entries(cart).forEach(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);if(p){n+=v;t+=v*(+p.sell_price||0)}});return{n,t}}function dd(){const type=$('delivery').value,d=info.delivery||{};let charge=0,label='Recojo / coordinado',note='';if(type==='olva'){charge=Math.max(0,+d.olva?.cost||0);label='Olva Courier'}if(type==='indrive'){charge=Math.max(0,+d.indrive?.cost||0);label='InDrive'}if(type==='shalom'){label='Shalom';note='El flete se paga directamente en Shalom al recoger.'}return{type,charge,label,note}}function totals(){const p=ps(),d=dd();return{...p,...d,total:p.t+d.charge}}function deliveries(){const d=info.delivery||{},o=[];if(d.pickup!==false&&info.allow_pickup!==false)o.push(['pickup','Recojo / entrega coordinada — S/ 0.00']);if(d.olva?.enabled)o.push(['olva','Olva Courier — '+money(d.olva.cost)]);if(d.indrive?.enabled)o.push(['indrive','InDrive — '+money(d.indrive.cost)]);if(d.shalom?.enabled)o.push(['shalom','Shalom — flete se paga en agencia']);if(!o.length)o.push(['pickup','Entrega a coordinar']);$('delivery').innerHTML=o.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}function cartRender(){const s=totals();$('bar').classList.toggle('on',s.n>0);$('count').textContent=s.n+' producto'+(s.n===1?'':'s');$('sum').textContent=money(s.total);$('subtotal').textContent=money(s.t);$('shiplabel').textContent=s.type==='shalom'?'Envío Shalom':'Envío';$('shipcost').textContent=s.type==='shalom'?'Pago en agencia':money(s.charge);$('total').textContent=money(s.total);$('note').textContent=s.note;$('items').innerHTML=Object.entries(cart).map(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);return p?`<div class="item"><span><b>${esc(p.name)}</b><br><small>${v} × ${money(p.sell_price)}</small></span><b>${money(v*p.sell_price)}</b></div>`:''}).join('')}function render(){const q=$('q').value.toLowerCase().trim(),list=products.filter(p=>(category==='Todos'||(p.category||'Otros')===category)&&(!q||String(p.name+' '+(p.category||'')).toLowerCase().includes(q)));$('pc').textContent=products.length+' disponibles';$('grid').innerHTML=list.length?list.map(p=>`<article class="card"><div class="photo">${p.image_data?`<img src="${p.image_data}" alt="${esc(p.name)}">`:'Sin imagen'}<span class="stock">${Math.floor(+p.stock||0)} en stock</span></div><div class="pbody"><div class="pcat">${esc(p.category||'Producto')}</div><div class="pname">${esc(p.name)}</div><div class="desc">${esc(p.description||p.specifications||'')}</div><div class="bottom"><span class="price">${money(p.sell_price)}</span><button class="add" data-id="${esc(p.product_id)}">+</button></div></div></article>`).join(''):'<div class="empty">No encontramos productos.</div>';cartRender()}async function load(){try{const c=await get('public_catalogs?select=business_id,business_name,business_info,social_links&public_id=eq.'+encodeURIComponent(id)+'&enabled=eq.true&limit=1');if(!c.length)throw Error();business=c[0].business_name||'Tienda';info=c[0].business_info||{};social=c[0].social_links||[];applyBrand();$('business').textContent=business;$('logo').textContent=business.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();document.title=business+' · Varelia Store';details();products=await get('public_catalog_products?select=product_id,name,category,sell_price,stock,image_data,description,specifications&business_id=eq.'+encodeURIComponent(c[0].business_id)+'&stock=gt.0&order=name.asc');categories();deliveries();render()}catch(e){console.error(e);$('grid').innerHTML='<div class="empty">No pudimos cargar la tienda. Actualiza la página.</div>'}}$('q').oninput=render;$('cats').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;category=b.dataset.cat;categories();render()};$('grid').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const p=products.find(x=>String(x.product_id)===b.dataset.id);if(p)cart[b.dataset.id]=Math.min((cart[b.dataset.id]||0)+1,Math.floor(+p.stock||1));cartRender()};$('view').onclick=()=>$('modal').classList.add('on');$('close').onclick=()=>$('modal').classList.remove('on');$('delivery').onchange=cartRender;$('share').onclick=async()=>{const u='https://vareliastore.tech/catalogo/milagros/';try{navigator.share?await navigator.share({title:business,url:u}):await navigator.clipboard.writeText(u)}catch{}};$('order').onclick=async()=>{const s=totals(),lines=Object.entries(cart).map(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);return p?`${v} x ${p.name} — ${money(v*p.sell_price)}`:''}).filter(Boolean),text=`Pedido para ${business}\n\n${lines.join('\n')}\n\nEntrega: ${s.label}${s.type==='shalom'?' (flete se paga en Shalom)':''}\nTotal: ${money(s.total)}\nhttps://vareliastore.tech/catalogo/milagros/`;try{navigator.share?await navigator.share({title:'Pedido '+business,text}):await navigator.clipboard.writeText(text)}catch{}};load()})()</script></body></html>
