<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Varelia Store</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#111827}.wrap{max-width:900px;margin:auto;padding:18px 16px 110px}.head{background:linear-gradient(135deg,#111827,#1f2937);color:#fff;border-radius:0 0 28px 28px;margin:-18px -16px 18px;padding:28px 20px}.brand{display:flex;gap:14px;align-items:center}.logo{width:60px;height:60px;border-radius:18px;background:#2463eb;display:grid;place-items:center;font-weight:900;font-size:24px}.head h1{margin:0}.head p{margin:5px 0;color:#cbd5e1}.share{margin-top:14px;border:1px solid #ffffff33;background:#ffffff12;color:#fff;border-radius:13px;padding:10px 14px;font-weight:800}.search{position:sticky;top:0;z-index:5;padding:8px 0;background:#f6f7fbef}.search input,select{width:100%;border:1px solid #e5e7eb;border-radius:14px;padding:13px;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;overflow:hidden}.photo{aspect-ratio:1.2;background:#eef2f7;display:grid;place-items:center;color:#94a3b8;font-size:12px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:13px}.cat{font-size:10px;text-transform:uppercase;color:#64748b;font-weight:800}.name{font-weight:900;margin:5px 0}.row{display:flex;justify-content:space-between;align-items:center}.price{font-size:19px;font-weight:950}.stock{font-size:10px;color:#047857;font-weight:800}.add{width:100%;border:0;background:#111827;color:#fff;border-radius:12px;padding:10px;margin-top:10px;font-weight:850}.status{text-align:center;padding:55px 20px;color:#64748b}.bar{display:none;position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(94%,680px);background:#111827;color:#fff;border-radius:18px;padding:12px 15px;z-index:20;align-items:center;justify-content:space-between}.bar.on{display:flex}.bar button{border:0;background:#fff;border-radius:12px;padding:10px 14px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#11182799;z-index:30;padding:60px 14px 14px}.modal.on{display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;border-radius:24px;width:min(100%,680px);max-height:88vh;overflow:auto;padding:18px}.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.delivery{margin:14px 0;padding:14px;border:1px solid #e5e7eb;border-radius:17px;background:#f8fafc}.hint{font-size:11px;color:#64748b;margin-top:8px}.costrow,.total{display:flex;justify-content:space-between;padding:8px 0}.total{font-size:20px;font-weight:950;border-top:1px solid #e5e7eb}.close,.order{width:100%;border:0;border-radius:13px;padding:13px;font-weight:900}.order{background:#16a34a;color:#fff;margin-bottom:8px}.close{background:#f1f5f9}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="wrap"><header class="head"><div class="brand"><div class="logo" id="logo">VS</div><div><h1 id="business">Catálogo</h1><p>Productos disponibles en tiempo real</p></div></div><button class="share" id="share">↗ Compartir tienda</button></header><div class="search"><input id="q" placeholder="Buscar productos o categorías…"></div><section class="grid" id="grid"><div class="status">Cargando tienda…</div></section></main><div class="bar" id="bar"><div><b id="count">0 productos</b><div id="sum">S/ 0.00</div></div><button id="view">Ver carrito →</button></div><div class="modal" id="modal"><div class="sheet"><h2>Tu compra</h2><div id="items"></div><div class="delivery"><h3>¿Cómo quieres recibir tu pedido?</h3><select id="delivery"></select><div class="hint" id="deliveryNote"></div></div><div class="costrow"><span>Productos</span><b id="subtotal">S/ 0.00</b></div><div class="costrow"><span id="shiplabel">Envío</span><b id="shipcost">S/ 0.00</b></div><div class="total"><span>Total a pagar aquí</span><span id="total">S/ 0.00</span></div><button class="order" id="order">Compartir pedido</button><button class="close" id="close">Seguir comprando</button></div></div><script>(()=>{const API='https://onvdcaohnftrjunwdvjp.supabase.co/rest/v1/',KEY='sb_publishable_bz2z5uglf_EALJezqv4rCw_S73GMNrh',id=new URLSearchParams(location.search).get('c')||'',H={apikey:KEY,Authorization:'Bearer '+KEY},$=x=>document.getElementById(x),money=n=>'S/ '+Number(n||0).toFixed(2);let products=[],business='',cart={},info={};async function get(path){const r=await fetch(API+path,{headers:H,cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}function ps(){let n=0,t=0;for(const[k,v]of Object.entries(cart)){const p=products.find(x=>String(x.product_id)===k);if(p){n+=v;t+=v*Number(p.sell_price||0)}}return{n,t}}function dd(){const type=$('delivery').value,d=info.delivery||{};let charge=0,label='Recojo / coordinado',note='';if(type==='olva'){charge=Math.max(0,+d.olva?.cost||0);label='Olva Courier'}if(type==='indrive'){charge=Math.max(0,+d.indrive?.cost||0);label='InDrive'}if(type==='shalom'){label='Shalom';note='El flete se paga directamente en Shalom al recoger el pedido.'}return{type,charge,label,note}}function totals(){const s=ps(),d=dd();return{...s,...d,total:s.t+d.charge}}function renderDelivery(){const d=info.delivery||{},opts=[];if(d.pickup!==false&&info.allow_pickup!==false)opts.push(['pickup','Recojo / entrega coordinada — S/ 0.00']);if(d.olva?.enabled)opts.push(['olva','Olva Courier — '+money(d.olva.cost)]);if(d.indrive?.enabled)opts.push(['indrive','InDrive — '+money(d.indrive.cost)]);if(d.shalom?.enabled)opts.push(['shalom','Shalom — flete se paga en agencia']);if(!opts.length)opts.push(['pickup','Entrega a coordinar']);$('delivery').innerHTML=opts.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');cartRender()}function cartRender(){const s=totals();$('bar').classList.toggle('on',s.n>0);$('count').textContent=s.n+' '+(s.n===1?'producto':'productos');$('sum').textContent=money(s.total);$('subtotal').textContent=money(s.t);$('shiplabel').textContent=s.type==='shalom'?'Envío Shalom':'Envío '+(s.type==='pickup'?'':s.label);$('shipcost').textContent=s.type==='shalom'?'Se paga en agencia':money(s.charge);$('total').textContent=money(s.total);$('deliveryNote').textContent=s.note;$('items').innerHTML=Object.entries(cart).map(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);return p?`<div class="item"><span><b>${p.name}</b><br><small>${v} × ${money(p.sell_price)}</small></span><b>${money(v*p.sell_price)}</b></div>`:''}).join('')}function render(){const q=$('q').value.toLowerCase().trim(),list=products.filter(p=>!q||String(p.name+' '+(p.category||'')).toLowerCase().includes(q));$('grid').innerHTML=list.length?list.map(p=>`<article class="card"><div class="photo">${p.image_data?`<img src="${p.image_data}" alt="">`:'Sin imagen'}</div><div class="body"><div class="cat">${p.category||'Producto'}</div><div class="name">${p.name}</div><div class="row"><span class="price">${money(p.sell_price)}</span><span class="stock">${Math.floor(+p.stock||0)} disponibles</span></div><button class="add" data-id="${p.product_id}">+ Agregar</button></div></article>`).join(''):'<div class="status">No hay productos disponibles.</div>';cartRender()}async function load(){try{const c=await get('public_catalogs?select=business_id,business_name,business_info&public_id=eq.'+encodeURIComponent(id)+'&enabled=eq.true&limit=1');if(!c.length)throw Error('Catálogo no disponible');business=c[0].business_name||'Tienda';info=c[0].business_info||{};$('business').textContent=business;$('logo').textContent=business.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();document.title=business+' · Varelia Store';products=await get('public_catalog_products?select=product_id,name,category,sell_price,stock,image_data&business_id=eq.'+encodeURIComponent(c[0].business_id)+'&stock=gt.0&order=name.asc');renderDelivery();render()}catch(e){console.error(e);$('grid').innerHTML='<div class="status">No pudimos cargar la tienda. Actualiza la página e inténtalo otra vez.</div>'}}$('q').oninput=render;$('grid').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const p=products.find(x=>String(x.product_id)===b.dataset.id);if(p)cart[b.dataset.id]=Math.min((cart[b.dataset.id]||0)+1,Math.floor(+p.stock||1));cartRender()};$('view').onclick=()=>$('modal').classList.add('on');$('close').onclick=()=>$('modal').classList.remove('on');$('delivery').onchange=cartRender;$('share').onclick=async()=>{const u='https://vareliastore.tech/catalogo/milagros/';try{navigator.share?await navigator.share({title:business+' · Catálogo',url:u}):await navigator.clipboard.writeText(u)}catch{}};$('order').onclick=async()=>{const s=totals(),lines=Object.entries(cart).map(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);return p?`${v} x ${p.name} — ${money(v*p.sell_price)}`:''}).filter(Boolean);let dl='Entrega: '+s.label;if(s.type==='olva'||s.type==='indrive')dl+=' — '+money(s.charge);if(s.type==='shalom')dl+=' — flete pagado por el cliente directamente en Shalom';const text=`Pedido para ${business}\n\n${lines.join('\n')}\n\nSubtotal productos: ${money(s.t)}\n${dl}\nTotal a pagar aquí: ${money(s.total)}\nCatálogo: https://vareliastore.tech/catalogo/milagros/`;try{navigator.share?await navigator.share({title:'Pedido '+business,text}):await navigator.clipboard.writeText(text)}catch{}};load()})()</script></body></html>
