<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="theme-color" content="#2463eb"><title>Varelia Store</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#111827}.wrap{max-width:900px;margin:auto;padding:18px 16px 110px}.head{background:linear-gradient(135deg,#111827,#1f2937);color:white;border-radius:0 0 28px 28px;margin:-18px -16px 18px;padding:28px 20px}.brand{display:flex;gap:14px;align-items:center}.logo{width:60px;height:60px;border-radius:18px;background:#2463eb;display:grid;place-items:center;font-weight:900;font-size:24px}.head h1{margin:0;font-size:25px}.head p{margin:5px 0 0;color:#cbd5e1}.share{margin-top:18px;border:1px solid #ffffff33;background:#ffffff12;color:white;border-radius:13px;padding:10px 14px;font-weight:800}.search{position:sticky;top:0;z-index:5;padding:8px 0;background:#f6f7fbeF;backdrop-filter:blur(10px)}input{width:100%;border:1px solid #e5e7eb;border-radius:16px;padding:14px;background:white;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}.card{background:white;border:1px solid #e5e7eb;border-radius:20px;overflow:hidden;box-shadow:0 8px 25px #1118270b}.photo{aspect-ratio:1.2;background:#eef2f7;display:grid;place-items:center;color:#94a3b8;font-size:12px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:13px}.cat{font-size:10px;text-transform:uppercase;color:#64748b;font-weight:800}.name{font-size:16px;font-weight:900;margin:5px 0}.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.price{font-size:19px;font-weight:950}.stock{font-size:10px;color:#047857;font-weight:800}.add{width:100%;border:0;background:#111827;color:white;border-radius:12px;padding:10px;margin-top:10px;font-weight:850}.status{text-align:center;padding:55px 20px;color:#64748b}.bar{display:none;position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(94%,680px);background:#111827;color:white;border-radius:18px;padding:12px 15px;z-index:20;box-shadow:0 15px 40px #11182755;align-items:center;justify-content:space-between}.bar.on{display:flex}.bar button{border:0;background:white;border-radius:12px;padding:10px 14px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#11182799;z-index:30;padding:60px 14px 14px}.modal.on{display:flex;align-items:flex-end;justify-content:center}.sheet{background:white;border-radius:24px;width:min(100%,680px);max-height:85vh;overflow:auto;padding:18px}.sheet h2{margin:0 0 12px}.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.total{font-size:20px;font-weight:950;display:flex;justify-content:space-between;padding:16px 0}.close,.order{width:100%;border:0;border-radius:13px;padding:13px;font-weight:900}.order{background:#16a34a;color:white;margin-bottom:8px}.close{background:#f1f5f9}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}} </style></head><body><main class="wrap"><header class="head"><div class="brand"><div class="logo" id="logo">VS</div><div><h1 id="business">Catálogo</h1><p>Productos disponibles en tiempo real</p></div></div><button class="share" id="share">↗ Compartir tienda</button></header><div class="search"><input id="q" placeholder="Buscar productos o categorías…"></div><section class="grid" id="grid"><div class="status">Cargando tienda…</div></section></main><div class="bar" id="bar"><div><b id="count">0 productos</b><div id="sum">S/ 0.00</div></div><button id="view">Ver carrito →</button></div><div class="modal" id="modal"><div class="sheet"><h2>Tu compra</h2><div id="items"></div><div class="total"><span>Total</span><span id="total">S/ 0.00</span></div><button class="order" id="order">Compartir pedido</button><button class="close" id="close">Seguir comprando</button></div></div><script>(()=>{const API='https://onvdcaohnftrjunwdvjp.supabase.co/rest/v1/',KEY='sb_publishable_bz2z5uglf_EALJezqv4rCw_S73GMNrh',id=new URLSearchParams(location.search).get('c')||'',H={apikey:KEY,Authorization:'Bearer '+KEY},$=x=>document.getElementById(x),money=n=>'S/ '+Number(n||0).toFixed(2);let products=[],business='',cart={};async function get(path){const r=await fetch(API+path,{headers:H,cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}function stats(){let n=0,t=0;for(const[k,v]of Object.entries(cart)){const p=products.find(x=>String(x.product_id)===k);if(p){n+=v;t+=v*Number(p.sell_price||0)}}return{n,t}}function cartRender(){const s=stats();$('bar').classList.toggle('on',s.n>0);$('count').textContent=s.n+' '+(s.n===1?'producto':'productos');$('sum').textContent=$('total').textContent=money(s.t);$('items').innerHTML=Object.entries(cart).map(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);return p?`<div class="item"><span><b>${p.name}</b><br><small>${v} × ${money(p.sell_price)}</small></span><b>${money(v*p.sell_price)}</b></div>`:''}).join('')}function render(){const q=$('q').value.toLowerCase().trim(),list=products.filter(p=>!q||String(p.name+' '+(p.category||'')).toLowerCase().includes(q));$('grid').innerHTML=list.length?list.map(p=>`<article class="card"><div class="photo">${p.image_data?`<img src="${p.image_data}" alt="">`:'Sin imagen'}</div><div class="body"><div class="cat">${p.category||'Producto'}</div><div class="name">${p.name}</div><div class="row"><span class="price">${money(p.sell_price)}</span><span class="stock">${Math.floor(Number(p.stock)||0)} disponibles</span></div><button class="add" data-id="${p.product_id}">+ Agregar</button></div></article>`).join(''):'<div class="status">No hay productos disponibles.</div>';cartRender()}async function load(){try{if(!/^[0-9a-f-]{36}$/i.test(id))throw Error('Enlace inválido');const c=await get('public_catalogs?select=business_id,business_name,theme_color&public_id=eq.'+encodeURIComponent(id)+'&enabled=eq.true&limit=1');if(!c.length)throw Error('Catálogo no disponible');business=c[0].business_name||'Tienda';$('business').textContent=business;$('logo').textContent=business.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();document.title=business+' · Varelia Store';products=await get('public_catalog_products?select=product_id,name,category,sell_price,stock,image_data&business_id=eq.'+encodeURIComponent(c[0].business_id)+'&stock=gt.0&order=name.asc');render()}catch(e){console.error(e);$('grid').innerHTML='<div class="status">No pudimos cargar la tienda. Actualiza la página e inténtalo otra vez.</div>'}}$('q').oninput=render;$('grid').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const p=products.find(x=>String(x.product_id)===b.dataset.id);if(!p)return;cart[b.dataset.id]=Math.min((cart[b.dataset.id]||0)+1,Math.floor(Number(p.stock)||1));cartRender()};$('view').onclick=()=>$('modal').classList.add('on');$('close').onclick=()=>$('modal').classList.remove('on');$('share').onclick=async()=>{const u='https://vareliastore.tech/catalogo/milagros/';try{navigator.share?await navigator.share({title:business+' · Catálogo',url:u}):await navigator.clipboard.writeText(u)}catch{}};$('order').onclick=async()=>{const s=stats(),lines=Object.entries(cart).map(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);return p?`${v} x ${p.name} — ${money(v*p.sell_price)}`:''}).filter(Boolean);const text=`Pedido para ${business}\n\n${lines.join('\n')}\n\nTotal: ${money(s.t)}\nCatálogo: https://vareliastore.tech/catalogo/milagros/`;try{navigator.share?await navigator.share({title:'Pedido '+business,text}):await navigator.clipboard.writeText(text)}catch{}};load()})()</script></body></html>
