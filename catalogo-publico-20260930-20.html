<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Varelia Store</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6fa;color:#111827}.wrap{max-width:980px;margin:auto;padding:0 15px 110px}.hero{margin:0 -15px 18px;padding:28px 20px 24px;background:linear-gradient(145deg,#0f172a,#1e293b);color:#fff;border-radius:0 0 30px 30px}.brand{display:flex;gap:14px;align-items:center}.logo{width:64px;height:64px;border-radius:19px;background:#2563eb;display:grid;place-items:center;font-size:24px;font-weight:950}.hero h1{margin:0}.tag{color:#cbd5e1;margin:5px 0}.verified{font-size:12px;color:#bbf7d0}.heroBtns{display:flex;gap:8px;margin-top:16px}.heroBtns a,.heroBtns button{flex:1;text-align:center;text-decoration:none;border:1px solid #ffffff28;background:#ffffff12;color:#fff;border-radius:13px;padding:11px;font-weight:800}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:17px;margin-bottom:15px;box-shadow:0 8px 30px #0f172a0b}.panel h2{font-size:17px;margin:0 0 12px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fact{background:#f8fafc;border-radius:14px;padding:11px}.fact small{display:block;color:#64748b;font-size:10px;font-weight:800;text-transform:uppercase}.fact b{font-size:13px}.socials,.payments{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.social{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#111827;background:#fff;border:1px solid #dfe3ea;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:850}.pill{font-size:11px;font-weight:800;padding:7px 10px;border-radius:999px;background:#eef2ff;color:#3730a3}.search{position:sticky;top:0;z-index:8;background:#f4f6faee;padding:8px 0}.search input,select{width:100%;border:1px solid #dfe3ea;border-radius:15px;padding:14px;background:#fff;font-size:15px}.title{display:flex;justify-content:space-between;align-items:end;margin:13px 0 10px}.title h2{margin:0}.title span{font-size:12px;color:#64748b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;overflow:hidden}.photo{aspect-ratio:1.15;background:#eef2f7;display:grid;place-items:center;color:#94a3b8;font-size:12px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:13px}.cat{font-size:10px;text-transform:uppercase;color:#64748b;font-weight:800}.name{font-weight:900;margin:5px 0}.desc{font-size:11px;color:#64748b}.row{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.price{font-size:19px;font-weight:950}.stock{font-size:10px;color:#047857;background:#ecfdf5;padding:5px 7px;border-radius:999px;font-weight:850}.add{width:100%;border:0;background:#111827;color:#fff;border-radius:12px;padding:10px;margin-top:10px;font-weight:850}.status{text-align:center;padding:55px 20px;color:#64748b}.bar{display:none;position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(94%,680px);background:#111827;color:#fff;border-radius:18px;padding:12px 15px;z-index:20;align-items:center;justify-content:space-between}.bar.on{display:flex}.bar button{border:0;background:#fff;border-radius:12px;padding:10px 14px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#0f172a99;z-index:30;padding:55px 12px 12px}.modal.on{display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;border-radius:25px;width:min(100%,680px);max-height:90vh;overflow:auto;padding:19px}.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.delivery{margin:14px 0;padding:14px;border:1px solid #e5e7eb;border-radius:17px;background:#f8fafc}.cost,.total{display:flex;justify-content:space-between;padding:8px 0}.total{font-size:20px;font-weight:950;border-top:1px solid #ddd}.order,.close{width:100%;border:0;border-radius:13px;padding:13px;font-weight:900}.order{background:#16a34a;color:#fff;margin-bottom:8px}.close{background:#f1f5f9}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.facts{grid-template-columns:repeat(4,1fr)}}@media(max-width:420px){.facts{grid-template-columns:1fr}.heroBtns{flex-direction:column}}</style></head><body><main class="wrap"><header class="hero"><div class="brand"><div class="logo" id="logo">VS</div><div><h1 id="business">Catálogo</h1><p class="tag">Compra directamente al negocio</p><div class="verified">● Stock actualizado en tiempo real</div></div></div><div class="heroBtns"><a id="wa" style="display:none" target="_blank" rel="noopener">WhatsApp</a><button id="share">↗ Compartir tienda</button></div></header><section class="panel"><h2>Información del negocio</h2><div class="facts" id="facts"></div><div class="payments" id="payments"></div><div class="socials" id="socials"></div></section><div class="search"><input id="q" placeholder="Buscar productos o categorías…"></div><div class="title"><h2>Productos</h2><span id="pc"></span></div><section class="grid" id="grid"><div class="status">Cargando tienda…</div></section></main><div class="bar" id="bar"><div><b id="count">0 productos</b><div id="sum">S/ 0.00</div></div><button id="view">Ver carrito →</button></div><div class="modal" id="modal"><div class="sheet"><h2>Resumen de tu compra</h2><div id="items"></div><div class="delivery"><b>Forma de entrega</b><select id="delivery"></select><div id="note" style="font-size:11px;color:#64748b;margin-top:8px"></div></div><div class="cost"><span>Productos</span><b id="subtotal"></b></div><div class="cost"><span id="shiplabel">Envío</span><b id="shipcost"></b></div><div class="total"><span>Total</span><span id="total"></span></div><button class="order" id="order">Enviar pedido</button><button class="close" id="close">Seguir comprando</button></div></div><script>(()=>{const API='https://onvdcaohnftrjunwdvjp.supabase.co/rest/v1/',KEY='sb_publishable_bz2z5uglf_EALJezqv4rCw_S73GMNrh',id=new URLSearchParams(location.search).get('c')||'',H={apikey:KEY,Authorization:'Bearer '+KEY},$=x=>document.getElementById(x),money=n=>'S/ '+Number(n||0).toFixed(2),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[],business='',cart={},info={},social=[];async function get(p){const r=await fetch(API+p,{headers:H,cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}function details(){const rows=[];if(info.ruc)rows.push(['RUC',info.ruc]);if(info.phone)rows.push(['Teléfono',info.phone]);if(info.address)rows.push(['Dirección',info.address]);if(info.hours)rows.push(['Horario',info.hours]);$('facts').innerHTML=rows.length?rows.map(x=>`<div class="fact"><small>${esc(x[0])}</small><b>${esc(x[1])}</b></div>`).join(''):'<div class="fact"><small>Atención</small><b>Consulta directamente con el negocio</b></div>';const pm=Array.isArray(info.payment_methods)?info.payment_methods:[];$('payments').innerHTML=pm.map(x=>`<span class="pill">${esc(x)}</span>`).join('');const icons={facebook:'●',instagram:'◎',tiktok:'♪',youtube:'▶',whatsapp:'✆'};$('socials').innerHTML=Array.isArray(social)?social.filter(x=>x&&x.url).map(x=>`<a class="social" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${icons[x.type]||'↗'} ${esc(x.label||x.type)}</a>`).join(''):'';if(info.whatsapp){$('wa').href=info.whatsapp;$('wa').style.display='block'}}function ps(){let n=0,t=0;Object.entries(cart).forEach(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);if(p){n+=v;t+=v*(+p.sell_price||0)}});return{n,t}}function dd(){const type=$('delivery').value,d=info.delivery||{};let charge=0,label='Recojo / coordinado',note='';if(type==='olva'){charge=Math.max(0,+d.olva?.cost||0);label='Olva Courier'}if(type==='indrive'){charge=Math.max(0,+d.indrive?.cost||0);label='InDrive'}if(type==='shalom'){label='Shalom';note='El flete se paga directamente en Shalom al recoger.'}return{type,charge,label,note}}function totals(){return{...ps(),...dd(),total:ps().t+dd().charge}}function deliveries(){const d=info.delivery||{},o=[];if(d.pickup!==false&&info.allow_pickup!==false)o.push(['pickup','Recojo / entrega coordinada — S/ 0.00']);if(d.olva?.enabled)o.push(['olva','Olva Courier — '+money(d.olva.cost)]);if(d.indrive?.enabled)o.push(['indrive','InDrive — '+money(d.indrive.cost)]);if(d.shalom?.enabled)o.push(['shalom','Shalom — flete se paga en agencia']);if(!o.length)o.push(['pickup','Entrega a coordinar']);$('delivery').innerHTML=o.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}function cartRender(){const s=totals();$('bar').classList.toggle('on',s.n>0);$('count').textContent=s.n+' producto'+(s.n===1?'':'s');$('sum').textContent=money(s.total);$('subtotal').textContent=money(s.t);$('shiplabel').textContent=s.type==='shalom'?'Envío Shalom':'Envío';$('shipcost').textContent=s.type==='shalom'?'Se paga en agencia':money(s.charge);$('total').textContent=money(s.total);$('note').textContent=s.note;$('items').innerHTML=Object.entries(cart).map(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);return p?`<div class="item"><span><b>${esc(p.name)}</b><br><small>${v} × ${money(p.sell_price)}</small></span><b>${money(v*p.sell_price)}</b></div>`:''}).join('')}function render(){const q=$('q').value.toLowerCase(),list=products.filter(p=>!q||String(p.name+' '+(p.category||'')).toLowerCase().includes(q));$('pc').textContent=products.length+' disponibles';$('grid').innerHTML=list.length?list.map(p=>`<article class="card"><div class="photo">${p.image_data?`<img src="${p.image_data}" alt="${esc(p.name)}">`:'Sin imagen'}</div><div class="body"><div class="cat">${esc(p.category||'Producto')}</div><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||p.specifications||'Disponible para compra')}</div><div class="row"><span class="price">${money(p.sell_price)}</span><span class="stock">${Math.floor(+p.stock||0)} disponibles</span></div><button class="add" data-id="${esc(p.product_id)}">+ Agregar al carrito</button></div></article>`).join(''):'<div class="status">No encontramos productos.</div>';cartRender()}async function load(){try{const c=await get('public_catalogs?select=business_id,business_name,business_info,social_links&public_id=eq.'+encodeURIComponent(id)+'&enabled=eq.true&limit=1');if(!c.length)throw Error();business=c[0].business_name||'Tienda';info=c[0].business_info||{};social=c[0].social_links||[];$('business').textContent=business;$('logo').textContent=business.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();document.title=business+' · Varelia Store';details();products=await get('public_catalog_products?select=product_id,name,category,sell_price,stock,image_data,description,specifications&business_id=eq.'+encodeURIComponent(c[0].business_id)+'&stock=gt.0&order=name.asc');deliveries();render()}catch(e){console.error(e);$('grid').innerHTML='<div class="status">No pudimos cargar la tienda. Actualiza la página.</div>'}}$('q').oninput=render;$('grid').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const p=products.find(x=>String(x.product_id)===b.dataset.id);if(p)cart[b.dataset.id]=Math.min((cart[b.dataset.id]||0)+1,Math.floor(+p.stock||1));cartRender()};$('view').onclick=()=>$('modal').classList.add('on');$('close').onclick=()=>$('modal').classList.remove('on');$('delivery').onchange=cartRender;$('share').onclick=async()=>{const u='https://vareliastore.tech/catalogo/milagros/';try{navigator.share?await navigator.share({title:business,url:u}):await navigator.clipboard.writeText(u)}catch{}};$('order').onclick=async()=>{const s=totals(),lines=Object.entries(cart).map(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);return p?`${v} x ${p.name} — ${money(v*p.sell_price)}`:''}).filter(Boolean),text=`Pedido para ${business}\n\n${lines.join('\n')}\n\nEntrega: ${s.label}${s.type==='shalom'?' (flete se paga en Shalom)':''}\nTotal: ${money(s.total)}\nhttps://vareliastore.tech/catalogo/milagros/`;try{navigator.share?await navigator.share({title:'Pedido '+business,text}):await navigator.clipboard.writeText(text)}catch{}};load()})()</script></body></html>
