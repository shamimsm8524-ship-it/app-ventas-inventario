<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comprobante de pedido</title>
<style>
html,body{margin:0;padding:0;background:#fff;color:#111}
#printFallback{position:fixed;right:16px;bottom:16px;z-index:9999;border:0;border-radius:14px;padding:13px 18px;background:#111;color:#fff;font:700 15px system-ui,sans-serif;box-shadow:0 6px 20px #0003}
@media print{#printFallback{display:none!important}}
</style>
</head>
<body>
<button id="printFallback" type="button">Imprimir</button>
<script>
(function(){
  var button=document.getElementById('printFallback');
  button.onclick=function(){window.print()};
  try{
    var raw=location.hash.indexOf('#p=')===0?location.hash.slice(3):'';
    if(!raw)throw new Error('Comprobante no disponible');
    var html=decodeURIComponent(raw);
    var parsed=new DOMParser().parseFromString(html,'text/html');
    document.title=parsed.title||'Comprobante de pedido';
    var keepButton=button;
    document.head.innerHTML=parsed.head.innerHTML+'<style>#printFallback{position:fixed;right:16px;bottom:16px;z-index:9999;border:0;border-radius:14px;padding:13px 18px;background:#111;color:#fff;font:700 15px system-ui,sans-serif;box-shadow:0 6px 20px #0003}@media print{#printFallback{display:none!important}}</style>';
    document.body.innerHTML=parsed.body.innerHTML;
    document.body.appendChild(keepButton);
    var fired=false;
    function printNow(){if(fired)return;fired=true;setTimeout(function(){try{window.print()}catch(e){}},220)}
    var pending=Array.prototype.slice.call(document.images||[]).filter(function(img){return !img.complete});
    if(!pending.length){printNow();return}
    var left=pending.length;
    function ready(){left--;if(left<=0)printNow()}
    pending.forEach(function(img){img.addEventListener('load',ready,{once:true});img.addEventListener('error',ready,{once:true})});
    setTimeout(printNow,1800);
  }catch(err){
    document.body.insertAdjacentHTML('afterbegin','<div style="padding:24px;font:16px system-ui,sans-serif">No se pudo preparar el comprobante.</div>');
  }
})();
</script>
</body>
</html>
