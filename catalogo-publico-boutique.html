<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="theme-color" content="#171310"><title>Varelia Boutique</title><style>:root{--ink:#171310;--ivory:#f8f4ee;--paper:#fffdf9;--gold:#b18a52;--muted:#81766d;--line:#e9e0d5;--green:#1f7a4d}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Georgia,'Times New Roman',serif}.page{max-width:1180px;margin:auto;padding-bottom:120px}.hero{min-height:330px;padding:34px 22px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 80% 15%,#725947 0,#30261f 34%,#171310 75%);color:white}.nav{display:flex;justify-content:space-between;align-items:center}.mark{width:48px;height:48px;border:1px solid #d7bd91;border-radius:50%;display:grid;place-items:center;font:700 14px Arial}.navBtns{display:flex;gap:8px}.navBtns a,.navBtns button{border:1px solid #ffffff44;background:#ffffff10;color:white;padding:10px 13px;border-radius:999px;text-decoration:none;font:700 11px Arial}.heroCopy{max-width:650px;padding:48px 0 8px}.kicker{font:700 10px Arial;letter-spacing:2.8px;text-transform:uppercase;color:#d7bd91}.hero h1{font-size:clamp(38px,8vw,72px);font-weight:400;line-height:.96;margin:12px 0}.hero p{font:400 13px Arial;color:#d8d0c9;max-width:470px;line-height:1.6}.seller{margin:-26px 16px 0;position:relative;background:var(--paper);border-radius:20px;padding:18px;box-shadow:0 18px 50px #30261f1a}.sellerHead{display:flex;justify-content:space-between;align-items:center}.sellerHead b{font-size:17px;font-weight:400}.badge{font:700 9px Arial;color:var(--green);background:#eaf5ef;padding:7px 9px;border-radius:99px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.fact{border-top:1px solid var(--line);padding-top:10px}.fact small{display:block;font:700 9px Arial;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:5px}.fact strong{font:600 12px Arial}.socials,.payments{display:flex;gap:7px;overflow:auto;margin-top:13px}.social,.payments span{white-space:nowrap;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:#fff;padding:8px 10px;border-radius:999px;font:700 10px Arial}.shop{padding:28px 16px}.shopTitle{text-align:center;margin-bottom:20px}.shopTitle .kicker{color:var(--gold)}.shopTitle h2{font-weight:400;font-size:32px;margin:7px 0}.search{max-width:600px;margin:0 auto 12px}.search input{width:100%;border:0;border-bottom:1px solid #bfb4aa;background:transparent;padding:13px 4px;font:400 13px Arial;outline:none}.cats{display:flex;justify-content:center;gap:8px;overflow:auto;padding:8px 0 22px}.cat{border:0;background:transparent;padding:8px 10px;font:700 10px Arial;color:#8b8179;text-transform:uppercase;letter-spacing:.7px}.cat.on{color:var(--ink);border-bottom:1px solid var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 12px}.card{min-width:0}.photo{position:relative;aspect-ratio:.82;background:#eee8e0;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.stock{position:absolute;top:9px;left:9px;background:#fffdf9e8;padding:6px 8px;font:700 9px Arial}.body{padding:11px 2px}.pcat{font:700 9px Arial;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}.name{font-size:16px;margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.desc{font:400 10px Arial;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.buy{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.price{font:800 16px Arial}.add{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:9px 11px;font:800 10px Arial;text-transform:uppercase}.empty{text-align:center;padding:50px;color:var(--muted);font:12px Arial}.cartbar{display:none;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:20;width:min(94%,620px);background:#171310;color:white;padding:13px 15px;box-shadow:0 16px 45px #0004;align-items:center;justify-content:space-between}.cartbar.on{display:flex}.cartbar b,.cartbar small{font-family:Arial}.cartbar small{display:block;color:#cfc5bc;margin-top:2px}.cartbar button{border:1px solid #d7bd91;background:#d7bd91;padding:10px 14px;font:800 11px Arial}.modal{display:none;position:fixed;inset:0;background:#171310aa;z-index:30;padding:12px}.modal.on{display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(100%,650px);max-height:90vh;overflow:auto;background:var(--paper);padding:22px;border-radius:20px 20px 0 0}.sheet h2{font-weight:400;font-size:27px;margin:0 0 15px}.item{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font:12px Arial}.delivery{margin:15px 0;padding:14px;background:#f2ece5}.delivery b{font:800 11px Arial}.delivery select{width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);background:white}.note{font:10px Arial;color:var(--muted);margin-top:7px}.line,.total{display:flex;justify-content:space-between;padding:8px 0;font:12px Arial}.total{font-size:18px;font-weight:900;border-top:1px solid var(--ink)}.order,.close{width:100%;padding:13px;border:0;font:800 11px Arial;text-transform:uppercase;letter-spacing:.5px}.order{background:var(--ink);color:white;margin-top:10px}.close{background:#eee7df;margin-top:7px}@media(min-width:760px){.hero{min-height:430px;padding:42px}.seller{margin:-38px 40px 0;padding:24px}.facts{grid-template-columns:repeat(4,1fr)}.shop{padding:45px 40px}.grid{grid-template-columns:repeat(4,1fr);gap:30px 18px}}</style></head><body><main class="page"><header class="hero"><nav class="nav"><div class="mark" id="logo">VS</div><div class="navBtns"><a id="wa" style="display:none" target="_blank" rel="noopener">WhatsApp</a><button id="share">Compartir</button></div></nav><div class="heroCopy"><div class="kicker">Boutique · Catálogo oficial</div><h1 id="business">Tu tienda</h1><p>Una selección especial de productos disponibles directamente con el negocio.</p></div></header><section class="seller"><div class="sellerHead"><b>La boutique</b><span class="badge">● STOCK ACTUALIZADO</span></div><div class="facts" id="facts"></div><div class="payments" id="payments"></div><div class="socials" id="socials" style="display:none"></div></section><section class="shop"><div class="shopTitle"><div class="kicker">Colección</div><h2>Descubre nuestros productos</h2></div><div class="search"><input id="q" placeholder="Buscar en la colección"></div><div class="cats" id="cats"></div><div class="grid" id="grid"><div class="empty">Cargando colección…</div></div></section></main><div class="cartbar" id="bar"><div><b id="count">0 productos</b><small id="sum">S/ 0.00</small></div><button id="view">VER PEDIDO</button></div><div class="modal" id="modal"><div class="sheet"><h2>Tu selección</h2><div id="items"></div><div class="delivery"><b>FORMA DE ENTREGA</b><select id="delivery"></select><div class="note" id="note"></div></div><div class="line"><span>Productos</span><b id="subtotal"></b></div><div class="line"><span id="shiplabel">Envío</span><b id="shipcost"></b></div><div class="total"><span>Total</span><span id="total"></span></div><button class="order" id="order">Enviar pedido</button><button class="close" id="close">Seguir comprando</button></div></div><script>(()=>{const API='https://onvdcaohnftrjunwdvjp.supabase.co/rest/v1/',KEY='sb_publishable_bz2z5uglf_EALJezqv4rCw_S73GMNrh',id=new URLSearchParams(location.search).get('c')||'',H={apikey:KEY,Authorization:'Bearer '+KEY},$=x=>document.getElementById(x),money=n=>'S/ '+Number(n||0).toFixed(2),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[],business='',cart={},info={},social=[],category='Todos';async function get(p){const r=await fetch(API+p,{headers:H,cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}function details(){const a=[];if(info.ruc)a.push(['RUC',info.ruc]);if(info.phone)a.push(['Contacto',info.phone]);if(info.address)a.push(['Ubicación',info.address]);if(info.hours)a.push(['Horario',info.hours]);$('facts').innerHTML=(a.length?a:[['Atención','Contacta directamente con la boutique']]).map(x=>`<div class="fact"><small>${esc(x[0])}</small><strong>${esc(x[1])}</strong></div>`).join('');const pm=Array.isArray(info.payment_methods)?info.payment_methods:[];$('payments').innerHTML=pm.map(x=>`<span>${esc(x)}</span>`).join('');const links=Array.isArray(social)?social.filter(x=>x&&x.url):[];$('socials').innerHTML=links.map(x=>`<a class="social" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label||x.type)}</a>`).join('');$('socials').style.display=links.length?'flex':'none';if(info.whatsapp){$('wa').href=info.whatsapp;$('wa').style.display='inline-flex'}}function categories(){const a=['Todos',...new Set(products.map(p=>p.category||'Otros'))];$('cats').innerHTML=a.map(x=>`<button class="cat ${x===category?'on':''}" data-cat="${esc(x)}">${esc(x)}</button>`).join('')}function ps(){let n=0,t=0;Object.entries(cart).forEach(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);if(p){n+=v;t+=v*(+p.sell_price||0)}});return{n,t}}function dd(){const type=$('delivery').value,d=info.delivery||{};let charge=0,label='Recojo / coordinado',note='';if(type==='olva'){charge=Math.max(0,+d.olva?.cost||0);label='Olva Courier'}if(type==='indrive'){charge=Math.max(0,+d.indrive?.cost||0);label='InDrive'}if(type==='shalom'){label='Shalom';note='El flete se paga directamente en Shalom al recoger.'}return{type,charge,label,note}}function totals(){const p=ps(),d=dd();return{...p,...d,total:p.t+d.charge}}function deliveries(){const d=info.delivery||{},o=[];if(d.pickup!==false&&info.allow_pickup!==false)o.push(['pickup','Recojo / entrega coordinada — S/ 0.00']);if(d.olva?.enabled)o.push(['olva','Olva Courier — '+money(d.olva.cost)]);if(d.indrive?.enabled)o.push(['indrive','InDrive — '+money(d.indrive.cost)]);if(d.shalom?.enabled)o.push(['shalom','Shalom — flete se paga en agencia']);if(!o.length)o.push(['pickup','Entrega a coordinar']);$('delivery').innerHTML=o.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}function cartRender(){const s=totals();$('bar').classList.toggle('on',s.n>0);$('count').textContent=s.n+' producto'+(s.n===1?'':'s');$('sum').textContent=money(s.total);$('subtotal').textContent=money(s.t);$('shiplabel').textContent=s.type==='shalom'?'Envío Shalom':'Envío';$('shipcost').textContent=s.type==='shalom'?'Pago en agencia':money(s.charge);$('total').textContent=money(s.total);$('note').textContent=s.note;$('items').innerHTML=Object.entries(cart).map(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);return p?`<div class="item"><span><b>${esc(p.name)}</b><br><small>${v} × ${money(p.sell_price)}</small></span><b>${money(v*p.sell_price)}</b></div>`:''}).join('')}function render(){const q=$('q').value.toLowerCase().trim(),list=products.filter(p=>(category==='Todos'||(p.category||'Otros')===category)&&(!q||String(p.name+' '+(p.category||'')).toLowerCase().includes(q)));$('grid').innerHTML=list.length?list.map(p=>`<article class="card"><div class="photo">${p.image_data?`<img src="${p.image_data}" alt="${esc(p.name)}">`:'Sin imagen'}<span class="stock">${Math.floor(+p.stock||0)} DISP.</span></div><div class="body"><div class="pcat">${esc(p.category||'Producto')}</div><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||p.specifications||'')}</div><div class="buy"><span class="price">${money(p.sell_price)}</span><button class="add" data-id="${esc(p.product_id)}">Añadir</button></div></div></article>`).join(''):'<div class="empty">No encontramos productos.</div>';cartRender()}async function load(){try{const c=await get('public_catalogs?select=business_id,business_name,business_info,social_links&public_id=eq.'+encodeURIComponent(id)+'&enabled=eq.true&limit=1');if(!c.length)throw Error();business=c[0].business_name||'Tienda';info=c[0].business_info||{};social=c[0].social_links||[];$('business').textContent=business;$('logo').textContent=business.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();document.title=business+' · Boutique';details();products=await get('public_catalog_products?select=product_id,name,category,sell_price,stock,image_data,description,specifications&business_id=eq.'+encodeURIComponent(c[0].business_id)+'&stock=gt.0&order=name.asc');categories();deliveries();render()}catch(e){console.error(e);$('grid').innerHTML='<div class="empty">No pudimos cargar la boutique. Actualiza la página.</div>'}}$('q').oninput=render;$('cats').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;category=b.dataset.cat;categories();render()};$('grid').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const p=products.find(x=>String(x.product_id)===b.dataset.id);if(p)cart[b.dataset.id]=Math.min((cart[b.dataset.id]||0)+1,Math.floor(+p.stock||1));cartRender()};$('view').onclick=()=>$('modal').classList.add('on');$('close').onclick=()=>$('modal').classList.remove('on');$('delivery').onchange=cartRender;$('share').onclick=async()=>{const u='https://vareliastore.tech/catalogo/milagros/';try{navigator.share?await navigator.share({title:business,url:u}):await navigator.clipboard.writeText(u)}catch{}};$('order').onclick=async()=>{const s=totals(),lines=Object.entries(cart).map(([k,v])=>{const p=products.find(x=>String(x.product_id)===k);return p?`${v} x ${p.name} — ${money(v*p.sell_price)}`:''}).filter(Boolean),text=`Pedido para ${business}\n\n${lines.join('\n')}\n\nEntrega: ${s.label}${s.type==='shalom'?' (flete se paga en Shalom)':''}\nTotal: ${money(s.total)}\nhttps://vareliastore.tech/catalogo/milagros/`;try{navigator.share?await navigator.share({title:'Pedido '+business,text}):await navigator.clipboard.writeText(text)}catch{}};load()})()</script></body></html>
